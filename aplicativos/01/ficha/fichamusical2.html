<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c5cbf">
<link rel="manifest" href="manifest.json">
<title>Ficha Musical — Caderno do Professor</title>
<style>
  :root {
    --cor-fundo: #f5f3ee;
    --cor-card: #ffffff;
    --cor-texto: #2c2c2c;
    --cor-suave: #8a8a8a;
    --cor-borda: #e0ddd6;
    --cor-primaria: #7c5cbf;
    --cor-primaria-escura: #5e3f9c;
    --adquirido: #4caf7d;
    --adquirido-bg: #e8f5ef;
    --desenvolvimento: #e0a800;
    --desenvolvimento-bg: #fdf6e3;
    --nao-iniciado: #b8b8b8;
    --nao-iniciado-bg: #f0f0f0;
    --modulo-cor: #7c5cbf;
    --modulo-bg: #f3effb;
    --sombra: 0 1px 3px rgba(0,0,0,0.06);
    --alerta: #e0a800;
    --alerta-bg: #fdf6e3;
    --perigo: #c0392b;
    --toast-bg: #2c2c2c;
    --toast-texto: #ffffff;
  }

  /* Modo escuro */
  body.dark {
    --cor-fundo: #1a1a1f;
    --cor-card: #26262e;
    --cor-texto: #e8e8e8;
    --cor-suave: #9a9a9a;
    --cor-borda: #3a3a44;
    --cor-primaria: #9b7ed6;
    --cor-primaria-escura: #b89de8;
    --adquirido-bg: #1e3a2c;
    --desenvolvimento-bg: #3a3018;
    --nao-iniciado-bg: #2e2e38;
    --modulo-bg: #2e2638;
    --toast-bg: #e8e8e8;
    --toast-texto: #1a1a1f;
  }
  body.dark .bloco-notas { background: #1e1e24; color: #e8e8e8; }
  body.dark .previa-lote { background: #1e2e24; }
  body.dark .conceito-linha { background: #2e2e38; }
  body.dark .hab-modulo-linha { background: #2e2e38; }
  body.dark .bloco-modulo { background: #22222a; }
  body.dark .bloco-modulo-header { background: var(--modulo-bg); }
  body.dark .checkbox-linha { background: #2e2e38; }
  body.dark .grupo-eixo-header { border-color: var(--cor-borda); }
  body.dark .previa-lote li { border-color: #3a3a44; }
  body.dark .codigo { background: #2e2e38; }
  body.dark .codigo[data-estado="adquirido"] { background: var(--adquirido-bg); }
  body.dark .codigo[data-estado="desenvolvimento"] { background: var(--desenvolvimento-bg); }
  body.dark button:hover { background: #33333d; }
  body.dark .item-lista:hover { background: #2e2e38; }
  body.dark .modal { background: var(--cor-card); }
  body.dark input, body.dark select, body.dark textarea {
    background: #2e2e38;
    color: var(--cor-texto);
    border-color: var(--cor-borda);
  }
  body.dark .bloco-notas { background: #1e1e24; }
  body.dark .modulo-tag { background: #3a3a44; color: var(--cor-texto); }
  body.dark .conceito-linha .cod { color: var(--cor-suave); }
  body.dark .hab-check:hover { background: #33333d; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    line-height: 1.5;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
    transition: background-color 0.2s, color 0.2s;
  }

  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--cor-borda);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  header.app-header h1 {
    font-size: 1.4rem;
    color: var(--cor-primaria-escura);
    font-weight: 600;
  }

  .acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--cor-borda);
    background: var(--cor-card);
    color: var(--cor-texto);
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: #fafafa; border-color: var(--cor-suave); }
  button.primario { background: var(--cor-primaria); color: white; border-color: var(--cor-primaria); }
  button.primario:hover { background: var(--cor-primaria-escura); }
  button.perigo { color: var(--perigo); }
  button.mini { padding: 4px 10px; font-size: 0.8rem; }
  button.cloud { background: #4285f4; color: white; border-color: #4285f4; }
  button.cloud:hover { background: #3367d6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Busca global */
  .busca-global {
    position: relative;
    margin-bottom: 16px;
  }
  .busca-global input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 1px solid var(--cor-borda);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--cor-card);
    color: var(--cor-texto);
  }
  .busca-global::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    pointer-events: none;
    opacity: 0.6;
  }
  .busca-resultados {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--cor-card);
    border: 1px solid var(--cor-borda);
    border-radius: 10px;
    margin-top: 4px;
    max-height: 400px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    z-index: 50;
    display: none;
  }
  .busca-resultados.aberto { display: block; }
  .busca-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--cor-borda);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .busca-item:last-child { border-bottom: none; }
  .busca-item:hover { background: var(--cor-fundo); }
  .busca-item .tipo {
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--modulo-bg);
    color: var(--modulo-cor);
    font-weight: 600;
    margin-right: 6px;
  }
  .busca-item .subtitulo { font-size: 0.8rem; color: var(--cor-suave); margin-top: 2px; }
  .busca-vazio { padding: 20px; text-align: center; color: var(--cor-suave); font-size: 0.85rem; }

  /* Indicador de sincronização pendente */
  .status-sync {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 12px;
    background: #e8f5ef;
    color: var(--adquirido);
    cursor: pointer;
  }
  .status-sync.pendente {
    background: var(--alerta-bg);
    color: var(--alerta);
    animation: pulse-sync 2s infinite;
  }
  .status-sync.offline {
    background: #f0f0f0;
    color: var(--cor-suave);
  }
  @keyframes pulse-sync {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .card {
    background: var(--cor-card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--sombra);
    border: 1px solid var(--cor-borda);
  }

  .lista-itens { display: flex; flex-direction: column; gap: 8px; }

  .item-lista {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--cor-card);
    border-radius: 10px;
    border: 1px solid var(--cor-borda);
    cursor: pointer;
    transition: all 0.15s;
    gap: 12px;
  }
  .item-lista:hover { border-color: var(--cor-primaria); transform: translateX(2px); }
  .item-lista .info { flex: 1; min-width: 0; }
  .item-lista .titulo { font-weight: 500; }
  .item-lista .sub { font-size: 0.85rem; color: var(--cor-suave); }

  .vazio {
    text-align: center;
    padding: 40px 20px;
    color: var(--cor-suave);
    font-style: italic;
  }

  .ficha-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .chips-modulos {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chip-modulo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--modulo-bg);
    color: var(--modulo-cor);
    border: 1px solid var(--modulo-cor);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .chip-modulo button {
    background: transparent;
    border: none;
    color: var(--modulo-cor);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 2px;
    line-height: 1;
  }

  .abas {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--cor-borda);
    -webkit-overflow-scrolling: touch;
  }

  .aba {
    padding: 8px 14px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.9rem;
    color: var(--cor-suave);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .aba.ativa {
    color: var(--cor-primaria-escura);
    border-bottom-color: var(--cor-primaria);
    font-weight: 600;
  }

  .progresso-barra {
    height: 6px;
    background: var(--nao-iniciado-bg);
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0 16px;
  }
  .progresso-barra > div {
    height: 100%;
    background: var(--adquirido);
    transition: width 0.3s;
  }

  .bloco-modulo {
    border: 1px solid var(--modulo-cor);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    background: #fdfcff;
  }
  .bloco-modulo-header {
    background: var(--modulo-bg);
    padding: 8px 12px;
    font-weight: 600;
    color: var(--modulo-cor);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bloco-modulo-header .contagem {
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.8;
  }
  .bloco-modulo-body { padding: 8px 10px; }

  .codigo {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--cor-borda);
    margin-bottom: 4px;
    background: var(--nao-iniciado-bg);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .codigo[data-estado="adquirido"] { background: var(--adquirido-bg); border-color: var(--adquirido); }
  .codigo[data-estado="desenvolvimento"] { background: var(--desenvolvimento-bg); border-color: var(--desenvolvimento); }
  .codigo[data-selecionado="true"] {
    outline: 2px solid var(--cor-primaria);
    outline-offset: -2px;
  }
  .codigo[data-oculto="true"] { display: none; }

  .codigo .cod {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--cor-suave);
    min-width: 40px;
  }
  .codigo .desc { font-size: 0.9rem; }
  .codigo .data { font-size: 0.75rem; color: var(--cor-suave); }
  .codigo .obs-hab {
    font-size: 0.75rem;
    color: var(--cor-primaria);
    margin-top: 2px;
    font-style: italic;
  }
  .codigo .obs-btn {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-size: 0.8rem;
    color: var(--cor-suave);
    opacity: 0.6;
  }
  .codigo .obs-btn:hover { opacity: 1; }

  .estado-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .estado-badge[data-estado="adquirido"] { background: var(--adquirido); color: white; }
  .estado-badge[data-estado="desenvolvimento"] { background: var(--desenvolvimento); color: white; }
  .estado-badge[data-estado="nao-iniciado"] { background: var(--nao-iniciado); color: white; }

  /* Barra de ações em lote */
  .barra-lote {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--cor-primaria);
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: none;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(124, 92, 191, 0.3);
  }
  .barra-lote.ativo { display: flex; }
  .barra-lote .contagem-lote { font-weight: 600; font-size: 0.9rem; }
  .barra-lote button {
    background: white;
    color: var(--cor-primaria-escura);
    border: none;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .barra-lote button:hover { background: #f0f0f0; }

  /* Filtros de estado */
  .filtros-estado {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 8px 0;
  }
  .filtro-btn {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    border: 1px solid var(--cor-borda);
    background: var(--cor-card);
    color: var(--cor-texto);
    cursor: pointer;
  }
  .filtro-btn.ativo {
    background: var(--cor-primaria);
    color: white;
    border-color: var(--cor-primaria);
  }

  .modal-fundo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-fundo.oculto { display: none; }

  .modal {
    background: var(--cor-card);
    border-radius: 12px;
    padding: 20px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--cor-primaria-escura); }

  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 0.85rem; color: var(--cor-suave); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--cor-card);
    color: var(--cor-texto);
  }
  .campo textarea { min-height: 60px; resize: vertical; }

  .modal-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  .modulo-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modulo-check:hover { border-color: var(--modulo-cor); }
  .modulo-check input[type="checkbox"] {
    width: 20px; height: 20px;
    cursor: pointer; margin-top: 2px; flex-shrink: 0;
  }
  .modulo-check .info { flex: 1; }
  .modulo-check .titulo { font-weight: 500; font-size: 0.95rem; }
  .modulo-check .sub { font-size: 0.8rem; color: var(--cor-suave); margin-top: 2px; }

  .tutorial-secao {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cor-borda);
  }
  .tutorial-secao:last-child { border-bottom: none; }
  .tutorial-secao h3 {
    color: var(--cor-primaria-escura);
    font-size: 1rem;
    margin-bottom: 8px;
  }
  .tutorial-secao p, .tutorial-secao li {
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .tutorial-secao ul, .tutorial-secao ol { padding-left: 20px; margin-bottom: 8px; }
  .tutorial-secao code {
    background: #f0ede5;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 0.85em;
  }
  body.dark .tutorial-secao code { background: #3a3a44; }
  .tutorial-secao kbd {
    background: #2c2c2c; color: white;
    padding: 2px 6px; border-radius: 4px;
    font-size: 0.8em; font-family: inherit;
  }

  .aviso {
    background: var(--desenvolvimento-bg);
    border: 1px solid var(--desenvolvimento);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }

  .lista-conceitos { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .conceito-linha {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    background: #faf9f6;
    font-size: 0.85rem;
  }
  .conceito-linha .cod { font-family: ui-monospace, monospace; font-weight: 600; color: var(--cor-suave); }
  .conceito-linha .desc { flex: 1; }
  .conceito-linha .acoes { display: flex; gap: 4px; }
  .conceito-linha .meta { font-size: 0.75rem; color: var(--cor-suave); display: block; margin-top: 2px; }

  .modulo-card {
    border: 1px solid var(--cor-borda);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--cor-card);
    box-shadow: var(--sombra);
  }
  .modulo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .modulo-card-titulo { font-weight: 600; font-size: 1rem; }
  .modulo-card-titulo .badge {
    display: inline-block;
    background: var(--modulo-bg);
    color: var(--modulo-cor);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .modulo-card-desc {
    font-size: 0.85rem;
    color: var(--cor-suave);
    margin-bottom: 8px;
  }
  .modulo-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .modulo-tag {
    font-size: 0.72rem;
    font-family: ui-monospace, monospace;
    background: #f0ede5;
    color: var(--cor-texto);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .modulo-tag.eixo-A { background: #e8eefc; }
  .modulo-tag.eixo-E { background: #fce8e8; }
  .modulo-tag.eixo-L { background: #e8f5ef; }
  .modulo-tag.eixo-W { background: #fdf6e3; }
  .modulo-tag.eixo-AP { background: #f0e8fc; }
  .modulo-tag.eixo-CR { background: #fce8f5; }
  .modulo-tag.eixo-CT { background: #e8f5f0; }
  .modulo-tag.eixo-OU { background: #f0ede5; }
  .modulo-tag.eixo-O2 { background: #ede5f0; }

  .modulo-vazio {
    color: var(--cor-suave);
    font-size: 0.85rem;
    font-style: italic;
  }

  .previa-lote {
    background: #f0f8f4;
    border: 1px solid var(--adquirido);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    max-height: 220px;
    overflow-y: auto;
  }
  .previa-lote ul { list-style: none; padding: 0; margin: 0; }
  .previa-lote li {
    padding: 4px 0;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    border-bottom: 1px solid #e0ede6;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .previa-lote li:last-child { border-bottom: none; }
  .previa-lote li b { color: var(--cor-primaria); }

  .tag-status {
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tag-status.novo { background: var(--adquirido); color: white; }
  .tag-status.existe { background: var(--alerta); color: white; }

  .lista-hab-modulo {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }
  .hab-modulo-linha {
    display: grid;
    grid-template-columns: 60px 1fr auto auto auto;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    background: #faf9f6;
    font-size: 0.85rem;
  }
  .hab-modulo-linha .cod {
    font-family: ui-monospace, monospace;

<script>
/* ============================================================
   FICHA MUSICAL — Caderno do Professor
   Versão 5.0 — Completa
   
   Novidades v5.0:

   - Reordenar módulos (↑↓)
   - Renomear eixos e ícones personalizáveis
   - Importar texto
   - Observações por habilidade
   - Marcar múltiplos códigos (modo seleção)
   - Filtro de estado na ficha
   - Modo escuro
   - Gráficos no relatório
   - Comparação entre alunos (relatório de turma)
   - Log de alterações
   - Indicador de sincronização pendente
   - PWA (manifest + service worker)
   ============================================================ */

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4LOiTzKySCMz0dfsj5a9nK_NSiUfPIgDfT63mtxVManUuNvkPjCrPjWmTwY0rZWoewA/exec";

// ⬇️ ATENÇÃO: por limite de tamanho, o resto do JavaScript continua na PARTE 2.

  const EIXOS_PADRAO = {
  A:  { nome: "Audição",     icone: "🎧", codigos: [

    ["AP.2", "Reconhece estilos musicais"],
    ["AP.3", "Analisa criticamente uma obra"],

  ]},
  CR: { nome: "Criação",     icone: "🎨", codigos: [
    ["CR.1", "Improvisa livremente"],
    ["CR.2", "Improvisa sobre base harmônica"],
    ["CR.3", "Compõe pequenas melodias"],
    ["CR.4", "Cria arranjos simples"],
  ]},
  CT: { nome: "Contexto",    icone: "🌍", codigos: [
    ["CT.1", "Conhece contexto histórico do repertório"],
    ["CT.2", "Reconhece função social da música"],
    ["CT.3", "Valoriza diversidade cultural musical"],
  ]},
  OU: { nome: "Outros 1",    icone: "📌", codigos: [] },
  O2: { nome: "Outros 2",    icone: "📎", codigos: [] },
};

const ESTADOS = ["nao-iniciado", "desenvolvimento", "adquirido"];
const LABEL_ESTADO = {
  "nao-iniciado": "Não iniciado",
  "desenvolvimento": "Em desenvolvimento",
  "adquirido": "Adquirido",
};

const CHAVE = "ficha-musical-v1";
const CHAVE_CONFIG = "ficha-musical-config-v1";
const CHAVE_BACKUPS = "ficha-musical-backups-v1";
const CHAVE_LOG = "ficha-musical-log-v1";
const CHAVE_PENDENTE = "ficha-musical-pendente-v1";
const MAX_BACKUPS = 10;
const MAX_LOG = 200;

let DB = carregarDB();
let CONFIG = carregarConfig();
let navegacao = { tela: "home", turmaId: null, alunoId: null, abaAtiva: null };
let modoSelecao = false;
let codigosSelecionados = new Set();
let filtroEstado = "todos";
let alteracoesPendentes = carregarPendente();

/* ============================================================
   Persistência
   ============================================================ */

function carregarDB() {
  try {
    const raw = localStorage.getItem(CHAVE);
    if (!raw) return dbInicial();
    const dados = JSON.parse(raw);
    if (!dados.eixos) dados.eixos = {};
    Object.keys(EIXOS_PADRAO).forEach(k => {
      if (!dados.eixos[k]) {
        dados.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
      } else {
        if (!Array.isArray(dados.eixos[k].codigos)) dados.eixos[k].codigos = [];
        if (!dados.eixos[k].nome) dados.eixos[k].nome = EIXOS_PADRAO[k].nome;
        if (!dados.eixos[k].icone) dados.eixos[k].icone = EIXOS_PADRAO[k].icone;
      }
    });
    if (!dados.modulos) dados.modulos = modulosIniciais();
    if (!dados.turmas) dados.turmas = [];
    dados.turmas.forEach(t => t.alunos.forEach(a => {
      if (!a.modulos) a.modulos = [];
      if (!a.registros) a.registros = {};
      if (!a.observacoesGerais) a.observacoesGerais = "";
      if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
      if (!a.observacoesHabilidades) a.observacoesHabilidades = {};
    }));
    return dados;
  } catch (e) {
    console.error("Erro ao carregar:", e);
    return dbInicial();
  }
}

function salvarDB() {
  // Backup automático rotativo (throttle: só cria se passou 5 min do último)
  salvarBackupAutomatico();
  localStorage.setItem(CHAVE, JSON.stringify(DB));
}

function carregarConfig() {
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_CONFIG)) || {};
    return {
      webAppUrl: WEBAPP_URL,
      email: salvo.email || "",
      darkMode: salvo.darkMode || false,
      syncAuto: salvo.syncAuto || false,
    };
  } catch {
    return { webAppUrl: WEBAPP_URL, email: "", darkMode: false, syncAuto: false };
  }
}

function salvarConfig() {
  localStorage.setItem(CHAVE_CONFIG, JSON.stringify(CONFIG));
}

function carregarPendente() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE_PENDENTE)) === true;
  } catch { return false; }
}

function marcarPendente(valor) {
  alteracoesPendentes = valor;
  localStorage.setItem(CHAVE_PENDENTE, JSON.stringify(valor));
  atualizarStatusSync();
}

function dbInicial() {
  return {
    versao: "5.0",
    turmas: [],
    eixos: JSON.parse(JSON.stringify(EIXOS_PADRAO)),
    modulos: modulosIniciais(),
  };
}

function modulosIniciais() {
  return [
    {
      id: "mod_intro",
      nome: "Módulo 1 — Introdução",
      descricao: "Primeiros passos no instrumento e na leitura",
      habilidades: ["A.1","A.2","E.1","E.2","E.3","E.4","L.1","L.2"],
    },
    {
      id: "mod_leitura",
      nome: "Módulo 2 — Leitura básica",
      descricao: "Elementos essenciais da partitura",
      habilidades: ["L.1","L.2","L.3","L.4","W.1","W.2"],
    },
  ];
}

/* ============================================================
   Backups automáticos rotativos
   ============================================================ */

function salvarBackupAutomatico() {
  try {
    const backups = JSON.parse(localStorage.getItem(CHAVE_BACKUPS)) || [];
    const agora = Date.now();
    const ULTIMO_MIN = 5 * 60 * 1000; // 5 minutos

    // Se o último backup foi feito há menos de 5 min, não cria outro
    if (backups.length > 0) {
      const ultimo = backups[backups.length - 1];
      if (agora - new Date(ultimo.data).getTime() < ULTIMO_MIN) return;
    }

    const snapshot = {
      data: new Date().toISOString(),
      dados: JSON.parse(JSON.stringify(DB)),
    };
    backups.push(snapshot);

    // Mantém só os últimos MAX_BACKUPS
    while (backups.length > MAX_BACKUPS) backups.shift();

    localStorage.setItem(CHAVE_BACKUPS, JSON.stringify(backups));
  } catch (e) {
    console.error("Erro ao salvar backup:", e);
  }
}

function listarBackups() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE_BACKUPS)) || [];
  } catch { return []; }
}

function restaurarBackup(index) {
  const backups = listarBackups();
  if (!backups[index]) return false;
  DB = backups[index].dados;
  // Normalização
  if (!DB.eixos) DB.eixos = {};
  Object.keys(EIXOS_PADRAO).forEach(k => {
    if (!DB.eixos[k]) DB.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
  });
  if (!DB.modulos) DB.modulos = modulosIniciais();
  if (!DB.turmas) DB.turmas = [];
  localStorage.setItem(CHAVE, JSON.stringify(DB));
  return true;
}

/* ============================================================
   Log de alterações
   ============================================================ */

function registrarLog(acao, detalhe) {
  try {
    const log = JSON.parse(localStorage.getItem(CHAVE_LOG)) || [];
    log.unshift({
      data: new Date().toISOString(),
      acao,
      detalhe: detalhe || "",
    });
    while (log.length > MAX_LOG) log.pop();
    localStorage.setItem(CHAVE_LOG, JSON.stringify(log));
  } catch (e) {
    console.error("Erro ao registrar log:", e);
  }
}

function listarLog() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE_LOG)) || [];
  } catch { return []; }
}

/* ============================================================
   Utilidades
   ============================================================ */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hoje() { return new Date().toISOString().slice(0, 10); }
function agoraISO() { return new Date().toISOString(); }

function getTurma(id) { return DB.turmas.find(t => t.id === id); }
function getAluno(turmaId, alunoId) {
  const t = getTurma(turmaId);
  return t ? t.alunos.find(a => a.id === alunoId) : null;
}
function getModulo(id) { return DB.modulos.find(m => m.id === id); }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function nomeModulo(id) {
  const m = getModulo(id);
  return m ? m.nome : "(módulo removido)";
}

function acharCodigoPorDescricao(eixoKey, descricao) {
  const eixo = DB.eixos[eixoKey];
  if (!eixo) return null;
  const alvo = descricao.trim().toLowerCase();
  const achado = eixo.codigos.find(([, d]) => (d || "").trim().toLowerCase() === alvo);
  return achado ? achado[0] : null;
}

function proximoCodigo(eixoKey) {
  const eixo = DB.eixos[eixoKey];
  if (!eixo || !Array.isArray(eixo.codigos) || eixo.codigos.length === 0) {
    return `${eixoKey}.1`;
  }
  let maior = 0;
  eixo.codigos.forEach(([cod]) => {
    if (!cod || typeof cod !== "string") return;
    const prefixo = eixoKey + ".";
    if (cod.startsWith(prefixo)) {
      const n = parseInt(cod.slice(prefixo.length), 10);
      if (!isNaN(n) && n > maior) maior = n;
    }
  });
  return `${eixoKey}.${maior + 1}`;
}

function contarModulosQueUsam(codigo) {
  return DB.modulos.filter(m => (m.habilidades || []).includes(codigo)).length;
}

function modulosQueUsam(codigo) {
  return DB.modulos.filter(m => (m.habilidades || []).includes(codigo));
}

function codigosDoAlunoNoEixo(aluno, eixoKey) {
  const set = new Set();
  (aluno.modulos || []).forEach(mid => {
    const m = getModulo(mid);
    if (!m) return;
    m.habilidades.forEach(cod => {
      if (cod.startsWith(eixoKey + ".")) set.add(cod);
    });
  });
  return set;
}

function contarProgressoDoAluno(aluno, eixoKey) {
  const codigos = codigosDoAlunoNoEixo(aluno, eixoKey);
  let adq = 0;
  codigos.forEach(cod => {
    if (aluno.registros[eixoKey]?.[cod]?.estado === "adquirido") adq++;
  });
  return { adquiridos: adq, total: codigos.size };
}

function progressoGeralDoAluno(aluno) {
  let adq = 0, tot = 0;
  Object.keys(DB.eixos).forEach(eixo => {
    const p = contarProgressoDoAluno(aluno, eixo);
    adq += p.adquiridos; tot += p.total;
  });
  return { adq, tot, pct: tot ? Math.round(100 * adq / tot) : 0 };
}

function habilidadesModuloPorEixo(modulo) {
  const porEixo = {};
  modulo.habilidades.forEach(cod => {
    const [eixo] = cod.split(".");
    if (!DB.eixos[eixo]) return;
    if (!porEixo[eixo]) porEixo[eixo] = [];
    porEixo[eixo].push(cod);
  });
  return porEixo;
}

/* ============================================================
   Toast
   ============================================================ */

function toast(msg, tipo = "info", duracao = 2500) {
  const el = document.createElement("div");
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.3s";
    setTimeout(() => el.remove(), 300);
  }, duracao);
}

/* ============================================================
   Diálogo de confirmação customizado
   ============================================================ */

function confirmar(titulo, mensagem, opcoes = {}) {
  return new Promise((resolve) => {
    const { confirmar = "Confirmar", cancelar = "Cancelar", perigo = false } = opcoes;
    const fundo = document.getElementById("dialogoFundo");
    const conteudo = document.getElementById("dialogoConteudo");

    conteudo.innerHTML = `
      <h3>${esc(titulo)}</h3>
      <p>${esc(mensagem)}</p>
      <div class="dialogo-acoes">
        <button id="dlgCancelar">${esc(cancelar)}</button>
        <button id="dlgConfirmar" class="${perigo ? 'perigo' : 'primario'}">${esc(confirmar)}</button>
      </div>
    `;
    fundo.classList.remove("oculto");

    function finalizar(valor) {
      fundo.classList.add("oculto");
      resolve(valor);
    }

    document.getElementById("dlgCancelar").onclick = () => finalizar(false);
    document.getElementById("dlgConfirmar").onclick = () => finalizar(true);
    fundo.onclick = (e) => { if (e.target === fundo) finalizar(false); };

    // Esc fecha
    const keyHandler = (e) => {
      if (e.key === "Escape") {
        document.removeEventListener("keydown", keyHandler);
        finalizar(false);
      }
    };
    document.addEventListener("keydown", keyHandler);
  });
}

/* ============================================================
   Indicador de sincronização
   ============================================================ */

function atualizarStatusSync() {
  const el = document.getElementById("statusSync");
  if (!el) return;

  const online = navigator.onLine;

  if (!online) {
    el.className = "status-sync offline";
    el.textContent = "📴 Offline";
    el.title = "Sem conexão com a internet";
    return;
  }

  if (alteracoesPendentes) {
    el.className = "status-sync pendente";
    el.textContent = "⚠️ Alterações não sincronizadas";
    el.title = "Clique para sincronizar agora";
  } else {
    el.className = "status-sync";
    el.textContent = "☁️ Sincronizado";
    el.title = "Clique para sincronizar";
  }
}

function bindEventos() {
  document.querySelectorAll("[data-acao]").forEach(el => {
    el.addEventListener("click", async e => {
      const acao = el.dataset.acao;

      if (acao === "abrir-turma") return abrirTurma(el.dataset.id);
      if (acao === "voltar-home") { navegacao = { tela: "home" }; return render(); }
      if (acao === "nova-turma") return modalNovaTurma();
      if (acao === "excluir-turma") {
        e.stopPropagation();
        const t = getTurma(el.dataset.id);
        const ok = await confirmar("Excluir turma", `Excluir "${t.nome}" e todos os alunos dela?`, { perigo: true, confirmar: "Excluir" });
        if (!ok) return;
        DB.turmas = DB.turmas.filter(x => x.id !== el.dataset.id);
        registrarLog("Excluir turma", t.nome);
        marcarPendente(true);
        salvarDB(); render();
        toast("Turma excluída", "sucesso");
        return;
      }
      if (acao === "novo-aluno") return modalNovoAluno();
      if (acao === "abrir-aluno") return abrirAluno(el.dataset.id);
      if (acao === "voltar-turma") { navegacao.tela = "turma"; navegacao.alunoId = null; return render(); }
      if (acao === "excluir-aluno") {
        e.stopPropagation();
        const t = getTurma(navegacao.turmaId);
        const a = t.alunos.find(x => x.id === el.dataset.id);
        const ok = await confirmar("Excluir aluno", `Excluir "${a.nome}"?`, { perigo: true, confirmar: "Excluir" });
        if (!ok) return;
        t.alunos = t.alunos.filter(x => x.id !== el.dataset.id);
        registrarLog("Excluir aluno", a.nome);
        marcarPendente(true);
        salvarDB(); render();
        toast("Aluno excluído", "sucesso");
        return;
      }
      if (acao === "mudar-aba") { navegacao.abaAtiva = el.dataset.aba; return render(); }
      if (acao === "ciclar-estado") {
        if (modoSelecao) return toggleSelecao(el.dataset.eixo, el.dataset.cod, el);
        return ciclarEstado(el.dataset.eixo, el.dataset.cod);
      }
      if (acao === "salvar-obs") return salvarObs();
      if (acao === "abrir-relatorio") { navegacao.tela = "relatorio"; return render(); }
      if (acao === "voltar-aluno") { navegacao.tela = "aluno"; return render(); }
      if (acao === "imprimir") return window.print();
      if (acao === "adicionar-modulo-aluno") return modalAdicionarModuloAoAluno();
      if (acao === "remover-modulo-aluno") {
        e.stopPropagation();
        return removerModuloDoAluno(el.dataset.id);
      }
      if (acao === "filtrar-estado") { filtroEstado = el.dataset.filtro; return render(); }
      if (acao === "toggle-selecao") {
        modoSelecao = !modoSelecao;
        codigosSelecionados.clear();
        return render();
      }
      if (acao === "obs-habilidade") {
        e.stopPropagation();
        return modalObservacaoHabilidade(el.dataset.eixo, el.dataset.cod);
      }
      if (acao === "lote-marcar-adquirido") return aplicarLote("adquirido");
      if (acao === "lote-marcar-desenvolvimento") return aplicarLote("desenvolvimento");
      if (acao === "lote-marcar-nao-iniciado") return aplicarLote("nao-iniciado");
      if (acao === "lote-cancelar") {
        modoSelecao = false;
        codigosSelecionados.clear();
        return render();
      }
      if (acao === "relatorio-turma") { navegacao.tela = "relatorioTurma"; return render(); }
      if (acao === "abrir-aluno-relatorio") {
        e.preventDefault();
        navegacao.alunoId = el.dataset.id;
        navegacao.tela = "relatorio";
        return render();
      }
    });
  });
}

/* ============================================================
   Ações
   ============================================================ */

function abrirTurma(id) { navegacao = { tela: "turma", turmaId: id }; render(); }

function abrirAluno(id) {
  navegacao.tela = "aluno";
  navegacao.alunoId = id;
  navegacao.abaAtiva = Object.keys(DB.eixos)[0];
  modoSelecao = false;
  codigosSelecionados.clear();
  filtroEstado = "todos";
  render();
}

function ciclarEstado(eixo, cod) {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  if (!aluno.registros[eixo]) aluno.registros[eixo] = {};
  const reg = aluno.registros[eixo][cod] || { estado: "nao-iniciado", data: null };
  const idx = ESTADOS.indexOf(reg.estado);
  const novo = ESTADOS[(idx + 1) % ESTADOS.length];
  reg.estado = novo;
  reg.data = novo === "adquirido" ? hoje() : (novo === "nao-iniciado" ? null : reg.data);
  aluno.registros[eixo][cod] = reg;
  aluno.atualizadoEm = agoraISO();
  marcarPendente(true);
  salvarDB();
  render();
}

function toggleSelecao(eixo, cod, el) {
  const chave = eixo + "::" + cod;
  if (codigosSelecionados.has(chave)) codigosSelecionados.delete(chave);
  else codigosSelecionados.add(chave);
  render();
}

async function aplicarLote(novoEstado) {
  if (codigosSelecionados.size === 0) {
    toast("Nenhum código selecionado", "alerta");
    return;
  }
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;

  const ok = await confirmar(
    "Aplicar em lote",
    `Marcar ${codigosSelecionados.size} código(s) como "${LABEL_ESTADO[novoEstado]}"?`
  );
  if (!ok) return;

  codigosSelecionados.forEach(chave => {
    const [eixo, cod] = chave.split("::");
    if (!aluno.registros[eixo]) aluno.registros[eixo] = {};
    const reg = aluno.registros[eixo][cod] || { estado: "nao-iniciado", data: null };
    reg.estado = novoEstado;
    reg.data = novoEstado === "adquirido" ? hoje() : (novoEstado === "nao-iniciado" ? null : reg.data);
    aluno.registros[eixo][cod] = reg;
  });
  aluno.atualizadoEm = agoraISO();
  marcarPendente(true);
  salvarDB();
  const n = codigosSelecionados.size;
  codigosSelecionados.clear();
  modoSelecao = false;
  render();
  toast(`${n} código(s) atualizado(s)`, "sucesso");
}

function salvarObs() {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  aluno.observacoesGerais = document.getElementById("obsGerais").value;
  aluno.atualizadoEm = agoraISO();
  marcarPendente(true);
  salvarDB();
  toast("Observação salva!", "sucesso");
}

async function removerModuloDoAluno(moduloId) {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  const ok = await confirmar(
    "Remover módulo",
    `Remover o módulo "${nomeModulo(moduloId)}" deste aluno?\n\nOs registros já feitos serão preservados.`,
    { perigo: true, confirmar: "Remover" }
  );
  if (!ok) return;
  aluno.modulos = aluno.modulos.filter(id => id !== moduloId);
  aluno.atualizadoEm = agoraISO();
  marcarPendente(true);
  salvarDB(); render();
  toast("Módulo removido", "sucesso");
}

function modalObservacaoHabilidade(eixo, cod) {

  if (!aluno.observacoesHabilidades) aluno.observacoesHabilidades = {};

    fecharModal();
    render();

    marcarPendente(true);

function modalAdicionarModuloAoAluno() {

  const jaTem = new Set(aluno.modulos || []);
  const disponiveis = DB.modulos.filter(m => !jaTem.has(m.id));

  if (disponiveis.length === 0) {
    return toast("Todos os módulos já estão vinculados a este aluno", "alerta");
  }

  const checkboxes = disponiveis.map(m => `
    <label class="modulo-check">
      <input type="checkbox" value="${m.id}">
      <div class="info">
        <div class="titulo">📦 ${esc(m.nome)}</div>
        <div class="sub">${m.habilidades.length} habilidade(s)${m.descricao ? " • " + esc(m.descricao) : ""}</div>
      </div>
    </label>
  `).join("");

  abrirModal(`
    <h2>Adicionar módulo a ${esc(aluno.nome)}</h2>

    <div class="modal-acoes">
      <button data-fechar>Cancelar</button>
      <button class="primario" id="mSalvar">Adicionar</button>
    </div>

    aluno.atualizadoEm = agoraISO();
    marcarPendente(true);

    toast(`${novos.length} módulo(s) adicionado(s)`, "sucesso");

}

document.getElementById("btnModulos").onclick = () => modalModulos();

function modalModulos() {
  const modulosHTML = DB.modulos.map((m, idx) => `
    <div class="modulo-card">
      <div class="modulo-card-header">
        <div style="flex:1">
          <div class="modulo-card-titulo">📦 ${esc(m.nome)} <span class="badge">${m.habilidades.length} habil.</span></div>

        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${idx > 0 ? `<button class="mini btn-reordenar" data-mover-cima="${idx}" title="Mover para cima">↑</button>` : ''}
          ${idx < DB.modulos.length - 1 ? `<button class="mini btn-reordenar" data-mover-baixo="${idx}" title="Mover para baixo">↓</button>` : ''}
          <button class="mini" data-duplicar="${m.id}" title="Duplicar">📋</button>
          <button class="mini" data-editar="${m.id}" title="Editar">✏️</button>
          <button class="mini perigo" data-excluir="${m.id}" title="Excluir">🗑</button>
        </div>
      </div>
      <div class="modulo-tags">
        ${m.habilidades.length === 0
          ? `<span class="modulo-vazio">Nenhuma habilidade vinculada</span>`
          : m.habilidades.slice(0, 30).map(c => `<span class="modulo-tag eixo-${c.split(".")[0]}">${c}</span>`).join("") +
            (m.habilidades.length > 30 ? `<span class="modulo-vazio">... +${m.habilidades.length - 30}</span>` : "")}
      </div>
    </div>
  `).join("") || `<div class="vazio">Nenhum módulo criado ainda.</div>`;

  abrirModal(`
    <h2>📦 Módulos de Estudo</h2>
    <div class="aviso">
      Escreva as habilidades diretamente no módulo. Os códigos são gerados automaticamente.
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="primario" id="btnNovoModulo">+ Novo Módulo</button>
    </div>
    <div id="listaModulos">${modulosHTML}</div>
    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };
  document.getElementById("btnNovoModulo").onclick = () => modalEditarModulo(null);

  document.querySelectorAll("[data-editar]").forEach(btn => {
    btn.onclick = () => modalEditarModulo(btn.dataset.editar);
  });
  document.querySelectorAll("[data-duplicar]").forEach(btn => {
    btn.onclick = () => duplicarModulo(btn.dataset.duplicar);
  });
  document.querySelectorAll("[data-mover-cima]").forEach(btn => {
    btn.onclick = () => moverModulo(parseInt(btn.dataset.moverCima), -1);
  });
  document.querySelectorAll("[data-mover-baixo]").forEach(btn => {
    btn.onclick = () => moverModulo(parseInt(btn.dataset.moverBaixo), 1);
  });
  document.querySelectorAll("[data-excluir]").forEach(btn => {
    btn.onclick = async () => {
      const m = getModulo(btn.dataset.excluir);
      if (!m) return;
      const usados = DB.turmas.flatMap(t => t.alunos).filter(a => (a.modulos || []).includes(m.id)).length;
      const msg = usados > 0
        ? `Este módulo está vinculado a ${usados} aluno(s). Excluir mesmo assim?`
        : `Excluir o módulo "${m.nome}"?`;
      const ok = await confirmar("Excluir módulo", msg, { perigo: true, confirmar: "Excluir" });
      if (!ok) return;
      DB.modulos = DB.modulos.filter(x => x.id !== m.id);
      registrarLog("Excluir módulo", m.nome);
      marcarPendente(true);
      salvarDB();
      modalModulos();
      toast("Módulo excluído", "sucesso");
    };
  });
}

function moverModulo(index, direcao) {
  const novoIndex = index + direcao;
  if (novoIndex < 0 || novoIndex >= DB.modulos.length) return;
  const tmp = DB.modulos[index];
  DB.modulos[index] = DB.modulos[novoIndex];
  DB.modulos[novoIndex] = tmp;
  marcarPendente(true);
  salvarDB();
  modalModulos();
}

function duplicarModulo(id) {
  const m = getModulo(id);
  if (!m) return;
  const novo = {
    id: uid(),
    nome: `${m.nome} (cópia)`,
    descricao: m.descricao || "",
    habilidades: [...m.habilidades],
  };
  const idx = DB.modulos.indexOf(m);
  DB.modulos.splice(idx + 1, 0, novo);
  registrarLog("Duplicar módulo", m.nome);
  marcarPendente(true);
  salvarDB();
  modalModulos();
  toast("Módulo duplicado", "sucesso");
}

      renderPrevia();
    };
    reader.readAsText(file);
  };

  function atualizarSelect() {
    [...select.options].forEach(opt => {
      const k = opt.value;
      opt.textContent = `${DB.eixos[k].icone} ${DB.eixos[k].nome} (${(DB.eixos[k].codigos || []).length} já cadastradas)`;
    });
  }

  function renderListaHab() {
    const arr = [...habilidadesTmp];
    contador.textContent = arr.length;

    if (arr.length === 0) {
      listaHab.innerHTML = `<div class="vazio" style="padding:12px;font-size:.85rem">Nenhuma habilidade ainda.</div>`;
      return;
    }

    const porEixo = {};
    arr.forEach(cod => {
      const [eixo] = cod.split(".");
      if (!DB.eixos[eixo]) return;
      if (!porEixo[eixo]) porEixo[eixo] = [];
      porEixo[eixo].push(cod);
    });

    Object.keys(porEixo).forEach(k => {
      porEixo[k].sort((a, b) => {
        const na = parseInt(a.split(".")[1], 10);
        const nb = parseInt(b.split(".")[1], 10);
        return na - nb;
      });
    });

    listaHab.innerHTML = Object.entries(porEixo).map(([eixoKey, cods]) => `
      <div class="grupo-eixo">
        <div class="grupo-eixo-header">${DB.eixos[eixoKey].icone} ${DB.eixos[eixoKey].nome}</div>
        ${cods.map(cod => {
          const def = DB.eixos[eixoKey].codigos.find(([c]) => c === cod);
          const desc = def ? def[1] : "(removido)";
          return `
            <div class="hab-modulo-linha">
              <span class="cod">${cod}</span>
              <span class="desc">${esc(desc)}</span>
              <button class="mini" data-editar-desc="${cod}" title="Editar descrição">✏️</button>
              <button class="mini perigo" data-remover-hab="${cod}" title="Remover do módulo">✕</button>
            </div>
          `;
        }).join("")}
      </div>
    `).join("");

    listaHab.querySelectorAll("[data-remover-hab]").forEach(btn => {
      btn.onclick = () => {
        habilidadesTmp.delete(btn.dataset.removerHab);
        marcarSujo();
        renderListaHab();
      };
    });
    listaHab.querySelectorAll("[data-editar-desc]").forEach(btn => {
      btn.onclick = () => {
        const cod = btn.dataset.editarDesc;
        const [eixo] = cod.split(".");
        const def = DB.eixos[eixo].codigos.find(([c]) => c === cod);
        const atual = def ? def[1] : "";
        const nova = prompt(`Editar descrição de ${cod}:`, atual);
        if (nova === null) return;
        if (!nova.trim()) return toast("Descrição não pode ficar vazia", "erro");
        const idx = DB.eixos[eixo].codigos.findIndex(([c]) => c === cod);
        if (idx >= 0) DB.eixos[eixo].codigos[idx] = [cod, nova.trim()];
        marcarSujo();
        renderListaHab();
      };
    });
  }

  function analisarLote() {
    const k = select.value;
    const linhasRaw = textarea.value.split("\n").map(s => s.trim()).filter(Boolean);
    const vistas = new Set();
    const linhas = [];
    linhasRaw.forEach(l => {
      const chave = l.toLowerCase();
      if (vistas.has(chave)) return;
      vistas.add(chave);
      linhas.push(l);
    });
    if (linhas.length === 0) return [];

    const eixo = DB.eixos[k];
    let maior = 0;
    (eixo.codigos || []).forEach(([cod]) => {
      const prefixo = k + ".";
      if (cod && cod.startsWith(prefixo)) {
        const n = parseInt(cod.slice(prefixo.length), 10);
        if (!isNaN(n) && n > maior) maior = n;
      }
    });
    let proximoNum = maior + 1;

    return linhas.map(desc => {
      const existente = acharCodigoPorDescricao(k, desc);
      if (existente) return { desc, cod: existente, novo: false };
      return { desc, cod: `${k}.${proximoNum++}`, novo: true };
    });
  }

  function renderPrevia() {
    const itens = analisarLote();
    if (itens.length === 0) {
      previa.innerHTML = "";
      btnAdd.disabled = true;
      btnAdd.textContent = "Adicionar ao módulo";
      return;
    }
    previa.innerHTML = `
      <div class="previa-lote">
        <div style="font-size:.8rem;color:var(--cor-suave);margin-bottom:6px">Prévia (${itens.length} linha(s)):</div>
        <ul>
          ${itens.map(it => `
            <li>
              <span><b>${it.cod}</b> — ${esc(it.desc)}</span>
              <span class="tag-status ${it.novo ? 'novo' : 'existe'}">${it.novo ? 'NOVO' : 'JÁ EXISTE'}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
    btnAdd.disabled = false;
    btnAdd.textContent = `Adicionar ${itens.length} habilidade(s) ao módulo`;
  }

  select.onchange = renderPrevia;
  textarea.oninput = () => { marcarSujo(); renderPrevia(); };

  renderListaHab();
  renderPrevia();

  btnAdd.onclick = async () => {
    const itens = analisarLote();
    if (itens.length === 0) return;
    const duplicatas = itens.filter(it => !it.novo);

    let usarExistentes = true;
    if (duplicatas.length > 0) {
      const lista = duplicatas.map(d => `• "${d.desc}" já existe como ${d.cod}`).join("\n");
      usarExistentes = await confirmar(
        "Habilidades duplicadas",
        `${lista}\n\nOK = reutilizar códigos existentes. Cancelar = criar códigos novos.`,
        { confirmar: "Reutilizar", cancelar: "Criar novos" }
      );
    }

    if (!usarExistentes) {
      const eixo = DB.eixos[select.value];
      let maior = 0;
      (eixo.codigos || []).forEach(([cod]) => {
        const prefixo = select.value + ".";
        if (cod && cod.startsWith(prefixo)) {
          const n = parseInt(cod.slice(prefixo.length), 10);
          if (!isNaN(n) && n > maior) maior = n;
        }
      });
      let proximoNum = maior + 1;
      const novosItens = itens.map(it => {
        if (it.novo) return it;
        return { desc: it.desc, cod: `${select.value}.${proximoNum++}`, novo: true };
      });
      novosItens.forEach(it => {
        if (!Array.isArray(DB.eixos[select.value].codigos)) DB.eixos[select.value].codigos = [];
        if (!DB.eixos[select.value].codigos.some(([c]) => c === it.cod)) {
          DB.eixos[select.value].codigos.push([it.cod, it.desc]);
        }
        habilidadesTmp.add(it.cod);
      });
      textarea.value = "";
      atualizarSelect();
      renderListaHab();
      renderPrevia();
      marcarSujo();
      toast(`${novosItens.length} habilidade(s) adicionada(s)`, "sucesso");
      return;
    }

    itens.forEach(it => {
      if (it.novo) {
        if (!Array.isArray(DB.eixos[select.value].codigos)) DB.eixos[select.value].codigos = [];
        if (!DB.eixos[select.value].codigos.some(([c]) => c === it.cod)) {
          DB.eixos[select.value].codigos.push([it.cod, it.desc]);
        }
      }
      habilidadesTmp.add(it.cod);
    });
    textarea.value = "";
    atualizarSelect();
    renderListaHab();
    renderPrevia();
    marcarSujo();
    toast(`${itens.length} habilidade(s) adicionada(s)`, "sucesso");
  };

  document.getElementById("mSalvar").onclick = () => {
    const nome = document.getElementById("mNome").value.trim();
    const descricao = document.getElementById("mDesc").value.trim();
    const habilidades = [...habilidadesTmp];

    if (!nome) return toast("Informe o nome do módulo", "erro");

    if (m) {
      m.nome = nome; m.descricao = descricao; m.habilidades = habilidades;
      registrarLog("Editar módulo", nome);
    } else {
      DB.modulos.push({ id: uid(), nome, descricao, habilidades });
      registrarLog("Criar módulo", nome);
    }
    estadoSujo = false;
    marcarPendente(true);
    salvarDB();
    modalModulos();
    toast("Módulo salvo!", "sucesso");
  };
}

    </div>

  const select = document.getElementById("cEixoSelect");
  const container = document.getElementById("listaCatalogo");

  function renderLista() {
    const k = select.value;
    const eixo = DB.eixos[k];
    const codigos = eixo.codigos || [];

    if (codigos.length === 0) {
      container.innerHTML = `<div class="vazio" style="padding:12px;font-size:.85rem">Nenhuma habilidade neste eixo ainda.<br><br>Vá em 📦 Módulos para criar.</div>`;
      return;
    }

    container.innerHTML = codigos.map(([cod, desc], i) => {
      const usos = contarModulosQueUsam(cod);
      return `
        <div class="conceito-linha">
          <span class="cod">${esc(cod)}</span>
          <span class="desc">
            ${esc(desc)}
            <span class="meta">Usada em ${usos} módulo(s)</span>
          </span>
          <span class="acoes">
            <button class="mini" data-editar="${i}">✏️</button>
            <button class="mini perigo" data-remover="${i}">🗑</button>
          </span>
        </div>
      `;
    }).join("");

    container.querySelectorAll("[data-editar]").forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.editar);
        const [cod, desc] = eixo.codigos[i];
        const nova = prompt(`Editar descrição de ${cod}:`, desc);
        if (nova === null) return;
        if (!nova.trim()) return toast("Descrição não pode ficar vazia", "erro");
        eixo.codigos[i] = [cod, nova.trim()];
        marcarPendente(true);
        salvarDB();
        renderLista();
        toast("Descrição atualizada", "sucesso");
      };
    });

    container.querySelectorAll("[data-remover]").forEach(async btn => {
      btn.onclick = async () => {
        const i = parseInt(btn.dataset.remover);
        const [cod, desc] = eixo.codigos[i];
        const usos = contarModulosQueUsam(cod);
        if (usos > 0) {
          const mods = modulosQueUsam(cod).map(m => m.nome).join(", ");
          return toast(`Não é possível remover. Usada em: ${mods}`, "erro", 4000);
        }
        const ok = await confirmar("Remover habilidade", `Remover "${cod} — ${desc}"?`, { perigo: true, confirmar: "Remover" });
        if (!ok) return;
        eixo.codigos.splice(i, 1);
        marcarPendente(true);
        salvarDB();
        renderLista();
        toast("Habilidade removida", "sucesso");
      };
    });
  }

  select.onchange = renderLista;
  renderLista();
}

document.getElementById("btnTexto").onclick = () => modalTexto();

function modalTexto() {
  const eixoKeys = Object.keys(DB.eixos);
  const nomePadrao = `habilidades-${hoje()}`;

  abrirModal(`
    <h2>📝 Exportar habilidades como texto</h2>
    <div class="aviso">
      Visualize e copie as habilidades formatadas. Útil para compartilhar, arquivar ou editar em massa.
    </div>

    <div class="filtros-linha">
      <div class="campo" style="margin-bottom:0">
        <label>Eixo</label>
        <select id="tEixoSelect">
          <option value="">🌐 Todas as categorias</option>
          ${eixoKeys.map(k => `
            <option value="${k}">${DB.eixos[k].icone} ${DB.eixos[k].nome} (${(DB.eixos[k].codigos || []).length})</option>
          `).join("")}
        </select>
      </div>
      <div class="campo" style="margin-bottom:0">
        <label>Módulo</label>
        <select id="tModuloSelect">
          <option value="">📚 Todos os módulos</option>
          ${DB.modulos.map(m => `
            <option value="${m.id}">📦 ${esc(m.nome)} (${m.habilidades.length})</option>
          `).join("")}
        </select>
      </div>
    </div>

    <label class="checkbox-linha">
      <input type="checkbox" id="tIncluirModulos">
      <span>Incluir módulos que usam cada habilidade</span>
    </label>

    <div class="campo">
      <label>Nome do arquivo (sem extensão)</label>
      <input id="tNomeArquivo" value="${esc(nomePadrao)}">
    </div>

    <div class="campo" style="margin-bottom:6px">
      <label>Conteúdo</label>
      <textarea id="tConteudo" class="bloco-notas" readonly></textarea>
    </div>

    <div class="acoes-bloco">
      <button class="primario" id="tCopiar">📋 Copiar tudo</button>
      <button class="cloud" id="tBaixar">💾 Baixar .txt</button>
      <button id="tAtualizar">🔄 Atualizar</button>
    </div>

    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = fecharModal;

  const selectEixo = document.getElementById("tEixoSelect");
  const selectModulo = document.getElementById("tModuloSelect");
  const chkModulos = document.getElementById("tIncluirModulos");
  const inputNome = document.getElementById("tNomeArquivo");
  const textarea = document.getElementById("tConteudo");

  function gerarTexto() {
    const eixoFiltro = selectEixo.value;
    const moduloFiltro = selectModulo.value;
    const incluirModulos = chkModulos.checked;

    const eixos = eixoFiltro ? [eixoFiltro] : Object.keys(DB.eixos);
    const blocos = [];

    eixos.forEach(eixoKey => {
      const eixo = DB.eixos[eixoKey];
      if (!eixo) return;

      let codigos = (eixo.codigos || []).slice();

      if (moduloFiltro) {
        const mod = getModulo(moduloFiltro);
        if (mod) {
          const permitidos = new Set(mod.habilidades.filter(c => c.startsWith(eixoKey + ".")));
          codigos = codigos.filter(([cod]) => permitidos.has(cod));
        }
      }

      if (codigos.length === 0) return;

      codigos.sort((a, b) => {
        const na = parseInt(a[0].split(".")[1], 10);
        const nb = parseInt(b[0].split(".")[1], 10);
        return na - nb;
      });

      const linhaCab = "═".repeat(50);
      let bloco = `${linhaCab}\n${eixo.icone} ${eixo.nome.toUpperCase()}\n${linhaCab}\n`;

      codigos.forEach(([cod, desc]) => {
        bloco += `${cod} — ${desc}\n`;
        if (incluirModulos) {
          const mods = modulosQueUsam(cod);
          if (mods.length > 0) bloco += `     Usada em: ${mods.map(m => m.nome).join(", ")}\n`;
          else bloco += `     (não vinculada a nenhum módulo)\n`;
        }
      });

      blocos.push(bloco);
    });

    if (blocos.length === 0) return "(nenhuma habilidade encontrada com os filtros atuais)";

    const total = blocos.reduce((acc, b) => acc + (b.match(/^[A-Z0-9]+\.\d+ —/gm) || []).length, 0);
    const rodape = `\n${"─".repeat(50)}\nTotal: ${total} habilidade(s)\nGerado em: ${new Date().toLocaleString("pt-BR")}\n`;
    return blocos.join("\n") + rodape;
  }

  function atualizarTexto() { textarea.value = gerarTexto(); }

  selectEixo.onchange = atualizarTexto;
  selectModulo.onchange = atualizarTexto;
  chkModulos.onchange = atualizarTexto;
  document.getElementById("tAtualizar").onclick = () => { atualizarTexto(); toast("Atualizado", "sucesso"); };

  document.getElementById("tCopiar").onclick = async () => {
    try {
      await navigator.clipboard.writeText(textarea.value);
      toast("Copiado para a área de transferência!", "sucesso");
    } catch {
      textarea.select();
      document.execCommand("copy");
      toast("Copiado!", "sucesso");
    }
  };

  document.getElementById("tBaixar").onclick = () => {
    let nome = inputNome.value.trim() || `habilidades-${hoje()}`;
    nome = nome.replace(/[\\/:*?"<>|]/g, "-");
    if (!nome.toLowerCase().endsWith(".txt")) nome += ".txt";
    const blob = new Blob([textarea.value], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
    toast("Arquivo baixado!", "sucesso");
  };

  atualizarTexto();
}

                  <div><b>${data.toLocaleString("pt-BR")}</b></div>

                </div>
                <button class="mini primario" data-restaurar="${idx}">Restaurar</button>
              </div>
            `;
          }).join("")}
    </div>

    <div>
      <h3 style="font-size:.95rem;margin-bottom:8px;color:var(--cor-primaria-escura)">📋 Log de alterações (últimas ${Math.min(log.length, 50)})</h3>
      ${log.length === 0
        ? `<div class="vazio" style="padding:16px;font-size:.85rem">Nenhuma alteração registrada.</div>`
        : `<div style="max-height:280px;overflow-y:auto;border:1px solid var(--cor-borda);border-radius:8px">
            ${log.slice(0, 50).map(item => `
              <div class="log-item">
                <div>${esc(item.acao)} ${item.detalhe ? `<span style="color:var(--cor-suave)">— ${esc(item.detalhe)}</span>` : ""}</div>
                <div class="data">${new Date(item.data).toLocaleString("pt-BR")}</div>
              </div>
            `).join("")}
          </div>`}
    </div>

    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };

  document.querySelectorAll("[data-restaurar]").forEach(async btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.restaurar);
      const ok = await confirmar("Restaurar backup", "Substituir os dados atuais pelo backup?", { perigo: true, confirmar: "Restaurar" });
      if (!ok) return;
      if (restaurarBackup(idx)) {
        registrarLog("Restaurar backup", new Date(listarBackups()[idx].data).toLocaleString("pt-BR"));
        marcarPendente(true);
        fecharModal();
        render();
        toast("Backup restaurado", "sucesso");
      }
    };
  });
}

/* ============================================================
   Modal Nuvem
   ============================================================ */

document.getElementById("btnNuvem").onclick = () => modalNuvem();

function modalNuvem() {
  abrirModal(`
    <h2>☁️ Nuvem — Google Sheets</h2>
    <div class="aviso">
      Envie para a planilha do Google e restaure de qualquer dispositivo.
      Merge por aluno: o mais recente vence.
    </div>

    <div class="campo">
      <label>E-mail de identificação (opcional)</label>
      <input id="nEmail" placeholder="seu@email.com" value="${esc(CONFIG.email || "")}">
    </div>

    <div class="campo">
      <label>URL do Web App (fixa)</label>
      <input value="${esc(WEBAPP_URL)}" readonly style="background:#f5f3ee;color:var(--cor-suave);font-size:.75em">
    </div>

    <div class="modal-acoes" style="justify-content:space-between">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="primario" id="btnSalvarEmail">Salvar e-mail</button>
        <button class="cloud" id="btnEnviar">⬆️ Enviar</button>
        <button class="cloud" id="btnRestaurar">⬇️ Restaurar</button>
      </div>
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };

  document.getElementById("btnSalvarEmail").onclick = () => {
    CONFIG.email = document.getElementById("nEmail").value.trim();
    salvarConfig();
    toast("E-mail salvo!", "sucesso");
  };

  document.getElementById("btnEnviar").onclick = async () => {
    if (!confirm("Enviar TODOS os dados para o Google Sheets?")) return;
    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    try {
      const resp = await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "salvar", email: CONFIG.email, dados: DB }),
      });
      const data = await resp.json();
      if (data.ok) {
        const r = data.resultado || {};
        const msg = [
          `Turmas:  +${r.turmas?.novos || 0} / ${r.turmas?.atualizados || 0} atual.`,
          `Módulos: +${r.modulos?.novos || 0} / ${r.modulos?.atualizados || 0} atual.`,
          `Eixos:   +${r.eixos?.novos || 0} / ${r.eixos?.atualizados || 0} atual.`,
          `Alunos:  +${r.alunos?.novos || 0} / ${r.alunos?.atualizados || 0} atual. / ${r.alunos?.ignorados || 0} ignor.`,
        ].join("\n");
        marcarPendente(false);
        registrarLog("Enviar para nuvem", "");
        alert("Enviado com sucesso!\n\n" + msg);
        fecharModal();
      } else {
        toast("Erro: " + (data.erro || "desconhecido"), "erro");
      }
    } catch (e) {
      toast("Falha ao enviar: " + e.message, "erro");
    }
    btn.disabled = false;
    btn.textContent = "⬆️ Enviar";
  };

  document.getElementById("btnRestaurar").onclick = async () => {
    if (!confirm("Substituir os dados locais pelos do Google Sheets?")) return;
    const btn = document.getElementById("btnRestaurar");
    btn.disabled = true;
    btn.textContent = "Restaurando...";
    try {
      const resp = await fetch(WEBAPP_URL + "?acao=carregar");
      const data = await resp.json();
      if (data.ok && data.dados) {
        DB = data.dados;
        if (!DB.eixos) DB.eixos = {};
        Object.keys(EIXOS_PADRAO).forEach(k => {
          if (!DB.eixos[k]) DB.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
          else {
            if (!Array.isArray(DB.eixos[k].codigos)) DB.eixos[k].codigos = [];
            if (!DB.eixos[k].nome) DB.eixos[k].nome = EIXOS_PADRAO[k].nome;
            if (!DB.eixos[k].icone) DB.eixos[k].icone = EIXOS_PADRAO[k].icone;
          }
        });
        if (!DB.modulos) DB.modulos = modulosIniciais();
        if (!DB.turmas) DB.turmas = [];
        DB.turmas.forEach(t => t.alunos.forEach(a => {
          if (!a.modulos) a.modulos = [];
          if (!a.registros) a.registros = {};
          if (!a.observacoesGerais) a.observacoesGerais = "";
          if (!a.observacoesHabilidades) a.observacoesHabilidades = {};
          if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
        }));
        marcarPendente(false);
        registrarLog("Restaurar da nuvem", "");
        localStorage.setItem(CHAVE, JSON.stringify(DB));
        fecharModal();
        render();
        alert("Dados restaurados!");
      } else {
        toast("Nenhum dado encontrado: " + (data.erro || ""), "erro");
      }
    } catch (e) {
      toast("Falha ao restaurar: " + e.message, "erro");
    }
    btn.disabled = false;
    btn.textContent = "⬇️ Restaurar";
  };
}

/* ============================================================
   Export / Import JSON
   ============================================================ */

document.getElementById("btnExportar").onclick = () => {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ficha-musical-backup-${hoje()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Backup exportado", "sucesso");
};

document.getElementById("btnImportar").onclick = () => {
  document.getElementById("inputArquivo").click();
};

document.getElementById("inputArquivo").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const dados = JSON.parse(ev.target.result);
      if (!dados.turmas) throw new Error("Arquivo inválido.");
      if (!confirm("Substituir os dados atuais pelos do arquivo?")) return;
      DB = dados;
      if (!DB.eixos) DB.eixos = {};
      Object.keys(EIXOS_PADRAO).forEach(k => {
        if (!DB.eixos[k]) DB.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
        else {
          if (!Array.isArray(DB.eixos[k].codigos)) DB.eixos[k].codigos = [];
          if (!DB.eixos[k].nome) DB.eixos[k].nome = EIXOS_PADRAO[k].nome;
          if (!DB.eixos[k].icone) DB.eixos[k].icone = EIXOS_PADRAO[k].icone;
        }
      });
      if (!DB.modulos) DB.modulos = modulosIniciais();
      DB.turmas.forEach(t => t.alunos.forEach(a => {
        if (!a.modulos) a.modulos = [];
        if (!a.registros) a.registros = {};
        if (!a.observacoesGerais) a.observacoesGerais = "";
        if (!a.observacoesHabilidades) a.observacoesHabilidades = {};
        if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
      }));
      marcarPendente(true);
      salvarDB();
      render();
      toast("Backup restaurado!", "sucesso");
    } catch (err) {
      toast("Erro ao importar: " + err.message, "erro");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ============================================================
   Busca global
   ============================================================ */

const buscaInput = document.getElementById("buscaInput");
const buscaResultados = document.getElementById("buscaResultados");

buscaInput.addEventListener("input", () => {
  const q = buscaInput.value.trim().toLowerCase();
  if (q.length < 2) {
    buscaResultados.classList.remove("aberto");
    return;
  }

  const resultados = [];

  // Buscar alunos
  DB.turmas.forEach(t => {
    t.alunos.forEach(a => {
      if (a.nome.toLowerCase().includes(q)) {
        resultados.push({
          tipo: "ALUNO",
          titulo: a.nome,
          subtitulo: `${t.nome} • ${(a.modulos || []).length} módulo(s)`,
          acao: () => {
            navegacao = { tela: "aluno", turmaId: t.id, alunoId: a.id, abaAtiva: Object.keys(DB.eixos)[0] };
            buscaInput.value = "";
            buscaResultados.classList.remove("aberto");
            render();
          },
        });
      }
    });
  });

  // Buscar módulos
  DB.modulos.forEach(m => {
    if (m.nome.toLowerCase().includes(q)) {
      resultados.push({
        tipo: "MÓDULO",
        titulo: m.nome,
        subtitulo: `${m.habilidades.length} habilidade(s)`,
        acao: () => {
          buscaInput.value = "";
          buscaResultados.classList.remove("aberto");
          modalEditarModulo(m.id);
        },
      });
    }
  });

  // Buscar habilidades
  Object.entries(DB.eixos).forEach(([k, eixo]) => {
    (eixo.codigos || []).forEach(([cod, desc]) => {
      if (desc.toLowerCase().includes(q) || cod.toLowerCase().includes(q)) {
        resultados.push({
          tipo: "HABILIDADE",
          titulo: `${cod} — ${desc}`,
          subtitulo: `${eixo.icone} ${eixo.nome}`,
          acao: () => {
            navegacao = { tela: "home" };
            buscaInput.value = "";
            buscaResultados.classList.remove("aberto");
            render();
            // Abre catálogo já no eixo certo
            setTimeout(() => {
              modalCatalogo();
              setTimeout(() => {
                const sel = document.getElementById("cEixoSelect");
                if (sel) { sel.value = k; sel.dispatchEvent(new Event("change")); }
              }, 100);
            }, 100);
          },
        });
      }
    });
  });

  if (resultados.length === 0) {
    buscaResultados.innerHTML = `<div class="busca-vazio">Nenhum resultado para "${esc(q)}"</div>`;
  } else {
    buscaResultados.innerHTML = resultados.slice(0, 20).map((r, i) => `
      <div class="busca-item" data-idx="${i}">
        <div><span class="tipo">${r.tipo}</span><b>${esc(r.titulo)}</b></div>
        <div class="subtitulo">${esc(r.subtitulo)}</div>
      </div>
    `).join("");

    buscaResultados.querySelectorAll(".busca-item").forEach((el, i) => {
      el.onclick = () => resultados[i].acao();
    });
  }

  buscaResultados.classList.add("aberto");
});

document.addEventListener("click", e => {
  if (!e.target.closest(".busca-global")) buscaResultados.classList.remove("aberto");
});

/* ============================================================
   Tema escuro
   ============================================================ */

document.getElementById("btnTema").onclick = () => {
  CONFIG.darkMode = !CONFIG.darkMode;
  salvarConfig();
  document.body.classList.toggle("dark", CONFIG.darkMode);
  toast(CONFIG.darkMode ? "Modo escuro ativado" : "Modo claro ativado", "sucesso");
};

/* ============================================================
   Atalhos de teclado
   ============================================================ */

document.addEventListener("keydown", e => {
  // Esc fecha modais abertos
  if (e.key === "Escape") {
    const modal = document.getElementById("modalFundo");
    if (!modal.classList.contains("oculto")) {
      modal.classList.add("oculto");
    }
    const dlg = document.getElementById("dialogoFundo");
    if (!dlg.classList.contains("oculto")) {
      dlg.classList.add("oculto");
    }
  }

  // Ctrl+F foca a busca
  if ((e.ctrlKey || e.metaKey) && e.key === "f") {
    e.preventDefault();
    buscaInput.focus();
    buscaInput.select();
  }

  // Ctrl+S salva em modais de edição
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    const btnSalvar = document.getElementById("mSalvar") ||
                       document.getElementById("cfgSalvar") ||
                       document.getElementById("obsSalvar");
    if (btnSalvar) btnSalvar.click();
  }
});

/* ============================================================
   Status de sincronização clicável
   ============================================================ */

document.getElementById("statusSync").onclick = async () => {
  if (!navigator.onLine) {
    toast("Sem conexão com a internet", "alerta");
    return;
  }
  modalNuvem();
};

window.addEventListener("online", () => {
  atualizarStatusSync();
  if (CONFIG.syncAuto && alteracoesPendentes) {
    sincronizarAutomatico();
  }
});
window.addEventListener("offline", atualizarStatusSync);

async function sincronizarAutomatico() {
  if (!navigator.onLine) return;
  try {
    const resp = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ acao: "salvar", email: CONFIG.email, dados: DB }),
    });
    const data = await resp.json();
    if (data.ok) {
      marcarPendente(false);
      registrarLog("Sincronização automática", "");
      toast("Sincronizado automaticamente", "sucesso");
    }
  } catch (e) {
    console.error("Erro na sincronização automática:", e);
  }
}

/* ============================================================
   PWA — Registro do Service Worker
   ============================================================ */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("Service Worker registrado:", reg.scope))
      .catch(err => console.warn("Falha ao registrar SW:", err));
  });
}

/* ============================================================
   Inicialização
   ============================================================ */

// Aplica tema salvo
document.body.classList.toggle("dark", CONFIG.darkMode);

// Aviso antes de sair se há alterações pendentes
window.addEventListener("beforeunload", e => {
  if (alteracoesPendentes) {
    e.preventDefault();
    e.returnValue = "Você tem alterações não sincronizadas.";
  }
});

// Registra log inicial
registrarLog("App iniciado", "");

// Render inicial
render();
</script>
