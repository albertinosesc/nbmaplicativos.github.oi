<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Markdown & Gerador de Acordes</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #f4f4f9; }
        
        header { background-color: #333; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        input[type="text"] { padding: 6px; border-radius: 4px; border: none; width: 200px; }
        
        .actions button, .actions label { background-color: #007bff; color: white; border: none; padding: 8px 12px; margin-left: 10px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .actions button:hover, .actions label:hover { background-color: #0056b3; }
        .actions input[type="file"] { display: none; }

        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .container { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
        .pane:last-child { border-right: none; }
        .pane-header { background-color: #e9ecef; padding: 8px 15px; font-weight: bold; font-size: 0.9rem; color: #495057; border-bottom: 1px solid #ddd; }
        textarea { flex: 1; resize: none; border: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 1rem; outline: none; }
        #preview { flex: 1; padding: 15px; overflow-y: auto; background-color: #fff; }

        /* ===== CORREÇÃO: restaura o estilo padrão das listas do Markdown ===== */
        #preview ul, #preview ol { padding-left: 28px; margin: 8px 0; }
        #preview li { margin: 4px 0; }
        #preview h1, #preview h2, #preview h3 { margin: 12px 0 6px; }
        #preview p { margin: 6px 0; }

        /* ===== Layout modes ===== */
        .layout-normal .pane-editor { display: flex; }
        .layout-normal .pane-preview { display: flex; }
        .layout-editor .pane-editor { display: flex; flex: 1; }
        .layout-editor .pane-preview { display: none; }
        .layout-preview .pane-editor { display: none; }
        .layout-preview .pane-preview { display: flex; flex: 1; }

        .layout-btn.active { background-color: #28a745 !important; }

        .chord-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .chord-modal {
            background: white;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 60px;
            left: 50px;
            padding: 20px;
            border: 1px solid #ddd;
            touch-action: none;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            cursor: move;
            user-select: none;
        }
        .modal-header h3 { font-size: 1.1rem; color: #333; }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #777; padding: 0 5px; }
        .close-modal:hover { color: #e94560; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; text-align: left; }
        .controls-grid.full { grid-template-columns: 1fr; }
        .controls-grid label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 2px; }
        .controls-grid input, .controls-grid select { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .chord-name-input { font-size: 15px; font-weight: bold; color: #e94560; border: 2px dashed #ccc; border-radius: 5px; text-align: center; width: 100%; padding: 5px; }
        
        .barre-section { background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px solid #e9ecef; margin-bottom: 10px; }
        .barre-row { display: flex; gap: 5px; align-items: center; }

        .chord-box { text-align: center; margin: 5px 0; }
        svg { background: #fff; border-radius: 5px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .clickable-area { fill: transparent; cursor: pointer; }
        .clickable-area:hover { fill: rgba(233, 69, 96, 0.15); }

        .btn-chord { background: #e94560; color: white; border: none; padding: 9px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-chord:hover { background: #d0344f; }
        
        .toggle-generator { background: #6c757d !important; }
        .toggle-generator:hover { background: #5a6268 !important; }

        /* ===== Seletor de dedo (números) ===== */
        .finger-picker { display: flex; gap: 4px; align-items: center; }
        .finger-picker button {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid #ccc; background: #fff; color: #555;
            font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.15s;
        }
        .finger-picker button.active { background: #e94560; color: #fff; border-color: #e94560; }
        .finger-picker button:hover { border-color: #e94560; }
    </style>
</head>
<body class="layout-normal">

    <header>
        <div class="header-left">
            <input type="text" id="filename-input" value="documento.md" placeholder="Nome do arquivo">
        </div>
        <div class="actions">
            <button class="layout-btn active" id="btn-layout-normal" onclick="setLayout('normal')" title="Editor + Preview">◫ Normal</button>
            <button class="layout-btn" id="btn-layout-editor" onclick="setLayout('editor')" title="Só Editor">▣ Editor</button>
            <button class="layout-btn" id="btn-layout-preview" onclick="setLayout('preview')" title="Só Preview">◉ Preview</button>
            <button class="toggle-generator" id="open-modal-btn">Criar / Inserir Acorde</button>
            <label for="file-input">Abrir</label>
            <input type="file" id="file-input" accept=".md,.txt">
            <button id="save-btn">Salvar</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="container">
            <div class="pane pane-editor">
                <div class="pane-header">Editor (Markdown)</div>
                <textarea id="editor" placeholder="# Comece a digitar..."></textarea>
            </div>
            <div class="pane pane-preview">
                <div class="pane-header">Visualizador (Preview)</div>
                <div id="preview"></div>
            </div>
        </div>
    </div>

    <div class="chord-modal-overlay" id="chordModalOverlay">
        <div class="chord-modal" id="chordModal">
            <div class="modal-header" id="modalHeader">
                <h3>Gerador de Acordes</h3>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>

            <div class="controls-grid full">
                <div>
                    <label>Instrumento:</label>
                    <select id="instrumentSelect" onchange="changeInstrument()">
                        <option value="violao" selected>Violão (6 cordas)</option>
                        <option value="ukulele">Ukulele (4 cordas)</option>
                        <option value="cavaquinho">Cavaquinho (4 cordas)</option>
                    </select>
                </div>
            </div>

            <div class="controls-grid full">
                <div>
                    <label>Nome do Acorde:</label>
                    <input type="text" id="chordNameInput" class="chord-name-input" value="Bm">
                </div>
            </div>

            <div class="controls-grid">
                <div>
                    <label>Casa Inicial (Traste):</label>
                    <select id="startFretSelect" onchange="renderDots()">
                        <option value="1">1ª Casa</option>
                        <option value="2" selected>2ª Casa</option>
                        <option value="3">3ª Casa</option>
                        <option value="4">4ª Casa</option>
                        <option value="5">5ª Casa</option>
                        <option value="6">6ª Casa</option>
                        <option value="7">7ª Casa</option>
                        <option value="8">8ª Casa</option>
                        <option value="9">9ª Casa</option>
                        <option value="10">10ª Casa</option>
                    </select>
                </div>
                <div>
                    <label>Modo de Inserção:</label>
                    <select id="insertModeSelect">
                        <option value="stack">Vertical (Empilhado)</option>
                        <option value="inline">Horizontal (Lado a lado)</option>
                    </select>
                </div>
            </div>

            <div class="controls-grid full">
                <div>
                    <label>Alinhamento do Acorde:</label>
                    <select id="textAlignSelect">
                        <option value="center">Centralizado</option>
                        <option value="left">Esquerda</option>
                        <option value="right">Direita</option>
                    </select>
                </div>
            </div>

            <!-- ===== NOVO: Estilo das notas ===== -->
            <div class="controls-grid full">
                <div>
                    <label>Estilo das Notas:</label>
                    <select id="noteStyleSelect" onchange="changeNoteStyle()">
                        <option value="dots" selected>Bolinhas</option>
                        <option value="numbers">Números (dedos)</option>
                    </select>
                </div>
            </div>

            <div class="controls-grid full" id="fingerPickerContainer" style="display:none;">
                <div>
                    <label>Dedo a ser inserido ao clicar:</label>
                    <div class="finger-picker" id="fingerPicker">
                        <button type="button" data-finger="1" onclick="selectFinger(1)">1</button>
                        <button type="button" data-finger="2" onclick="selectFinger(2)">2</button>
                        <button type="button" data-finger="3" onclick="selectFinger(3)">3</button>
                        <button type="button" data-finger="4" onclick="selectFinger(4)">4</button>
                        <button type="button" data-finger="T" onclick="selectFinger('T')" title="Polegar (T)">T</button>
                    </div>
                </div>
            </div>
            <!-- ===== FIM NOVO ===== -->

            <div class="barre-section">
                <label>Adicionar / Remover Pestana:</label>
                <div class="barre-row">
                    <select id="barreFret">
                        <option value="1">Traste 1</option>
                        <option value="2">Traste 2</option>
                        <option value="3">Traste 3</option>
                        <option value="4">Traste 4</option>
                    </select>
                    <select id="barreStart" title="Corda Inicial"></select>
                    <select id="barreEnd" title="Corda Final"></select>
                    <button type="button" onclick="toggleBarre()" style="background:#333; color:white; border:none; padding:5px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Aplicar</button>
                </div>
            </div>

            <div class="chord-box">
                <svg id="fretboard" width="140" height="160" viewBox="0 0 140 160">
                    <rect id="nut-rect" x="25" y="30" width="90" height="4" fill="#333"></rect>
                    <path d="M25 60h90M25 90h90M25 120h90M25 150h90" stroke="#888" stroke-width="2"></path>
                    <g id="string-lines"></g>
                    <g id="fret-number-group"></g>
                    <g id="interactive-grid"></g>
                    <g id="finger-dots"></g>
                </svg>
            </div>

            <button class="btn-chord" onclick="insertChordIntoEditor()">Inserir no Texto</button>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const saveBtn = document.getElementById('save-btn');
        const fileInput = document.getElementById('file-input');
        const filenameInput = document.getElementById('filename-input');
        
        const chordModalOverlay = document.getElementById('chordModalOverlay');
        const chordModal = document.getElementById('chordModal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalHeader = document.getElementById('modalHeader');

        // ===== Layout (Normal / Editor / Preview) =====
        function setLayout(mode) {
            document.body.classList.remove('layout-normal', 'layout-editor', 'layout-preview');
            document.body.classList.add('layout-' + mode);
            document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-layout-' + mode).classList.add('active');
        }

        // ===== Configuração por instrumento =====
        const INSTRUMENTS = {
            violao:      { strings: 6, stringLabels: ['6ª (E)','5ª (A)','4ª (D)','3ª (G)','2ª (B)','1ª (e)'], stringWidths: [2.2,2.0,1.8,1.6,1.4,1.2] },
            ukulele:     { strings: 4, stringLabels: ['4ª (G)','3ª (C)','2ª (E)','1ª (A)'],                  stringWidths: [1.6,1.8,1.6,1.4] },
            cavaquinho:  { strings: 4, stringLabels: ['4ª (D)','3ª (G)','2ª (B)','1ª (D)'],                  stringWidths: [1.8,1.6,1.4,1.4] }
        };
        let currentInstrument = 'violao';
        let noteStyle = 'dots';
        let selectedFinger = 1;

        function updatePreview() {
            preview.innerHTML = marked.parse(editor.value);
        }

        editor.addEventListener('input', updatePreview);

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            filenameInput.value = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                editor.value = e.target.result;
                updatePreview();
            };
            reader.readAsText(file);
        });

        saveBtn.addEventListener('click', () => {
            const markdownText = editor.value;
            const blob = new Blob([markdownText], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filenameInput.value || 'documento.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        openModalBtn.addEventListener('click', () => { chordModalOverlay.style.display = 'block'; });
        
        closeModalBtn.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            chordModalOverlay.style.display = 'none'; 
        });

        // --- Arrastar Modal ---
        let isDragging = false, startX, startY, initialX, initialY;

        modalHeader.addEventListener('pointerdown', (e) => {
            if (e.target.classList.contains('close-modal')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = chordModal.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            modalHeader.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        modalHeader.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            chordModal.style.left = (initialX + dx) + 'px';
            chordModal.style.top = (initialY + dy) + 'px';
        });

        modalHeader.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { modalHeader.releasePointerCapture(e.pointerId); } catch (err) {}
        });

        // --- Lógica de Acordes ---
        let stringsX = [];
        const fretCentersY = { 0: 22, 1: 47, 2: 75, 3: 105, 4: 135 };
        let activeNotes = [];
        let activeBarres = [];

        const gridGroup = document.getElementById('interactive-grid');
        const dotsGroup = document.getElementById('finger-dots');
        const fretNumberGroup = document.getElementById('fret-number-group');
        const stringLinesGroup = document.getElementById('string-lines');
        const fingerPickerContainer = document.getElementById('fingerPickerContainer');

        function getConfig() {
            return INSTRUMENTS[currentInstrument];
        }

        function calculateStringsX() {
            const n = getConfig().strings;
            const startX = 25, totalWidth = 90, positions = [];
            if (n === 1) positions.push(startX + totalWidth / 2);
            else {
                const step = totalWidth / (n - 1);
                for (let i = 0; i < n; i++) positions.push(startX + step * i);
            }
            return positions;
        }

        // ===== NOVO: troca estilo das notas =====
        function changeNoteStyle() {
            noteStyle = document.getElementById('noteStyleSelect').value;
            fingerPickerContainer.style.display = (noteStyle === 'numbers') ? 'block' : 'none';
            renderDots();
        }

        function selectFinger(f) {
            selectedFinger = f;
            document.querySelectorAll('#fingerPicker button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.finger == f);
            });
        }
        selectFinger(1);
        // ===== FIM NOVO =====

        function renderStringLines() {
            const config = getConfig();
            stringsX = calculateStringsX();
            let html = '';
            for (let i = 0; i < config.strings; i++) {
                const x = stringsX[i];
                const w = config.stringWidths[i] || 1.2;
                html += `<line x1="${x}" y1="30" x2="${x}" y2="150" stroke="#666" stroke-width="${w}"/>`;
            }
            stringLinesGroup.innerHTML = html;
        }

        function buildInteractiveGrid() {
            gridGroup.innerHTML = '';
            const n = getConfig().strings;
            stringsX = calculateStringsX();

            for (let s = 0; s < n; s++) {
                for (let f = 0; f <= 4; f++) {
                    const cx = stringsX[s];
                    let rectWidth;
                    if (n === 1) rectWidth = 30;
                    else if (s === 0) rectWidth = stringsX[1] - stringsX[0];
                    else if (s === n - 1) rectWidth = stringsX[n-1] - stringsX[n-2];
                    else rectWidth = Math.min(stringsX[s] - stringsX[s-1], stringsX[s+1] - stringsX[s]);
                    const rectX = cx - rectWidth / 2;

                    let rectY, rectHeight;
                    if (f === 0) { rectY = 5; rectHeight = 23; }
                    else {
                        const tops = {1:34,2:61,3:91,4:121}, bots = {1:60,2:90,3:120,4:150};
                        rectY = tops[f]; rectHeight = bots[f] - tops[f];
                    }

                    const hitBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    hitBox.setAttribute("x", rectX);
                    hitBox.setAttribute("y", rectY);
                    hitBox.setAttribute("width", rectWidth);
                    hitBox.setAttribute("height", rectHeight);
                    hitBox.setAttribute("class", "clickable-area");
                    hitBox.onclick = () => handleCellClick(s, f);
                    gridGroup.appendChild(hitBox);
                }
            }
        }

        function updateBarreSelectors() {
            const config = getConfig();
            const startSel = document.getElementById('barreStart');
            const endSel = document.getElementById('barreEnd');
            const prevStart = startSel.value, prevEnd = endSel.value;
            startSel.innerHTML = '';
            endSel.innerHTML = '';
            config.stringLabels.forEach((label, i) => {
                const o1 = document.createElement('option');
                o1.value = i; o1.textContent = label;
                startSel.appendChild(o1);
                const o2 = document.createElement('option');
                o2.value = i; o2.textContent = label;
                endSel.appendChild(o2);
            });
            startSel.value = (parseInt(prevStart) < config.strings) ? prevStart : 0;
            endSel.value = (parseInt(prevEnd) < config.strings) ? prevEnd : (config.strings - 1);
        }

        function changeInstrument() {
            currentInstrument = document.getElementById('instrumentSelect').value;
            activeNotes = [];
            activeBarres = [];
            renderStringLines();
            buildInteractiveGrid();
            updateBarreSelectors();
            renderDots();
        }

        function handleCellClick(stringIndex, fretIndex) {
            if (fretIndex === 0) {
                let existing = activeNotes.find(n => n.string === stringIndex && n.fret === 0);
                if (!existing) {
                    activeNotes.push({ string: stringIndex, fret: 0, type: 'text', value: 'O' });
                } else if (existing.value === 'O') {
                    existing.value = 'X';
                } else {
                    activeNotes = activeNotes.filter(n => !(n.string === stringIndex && n.fret === 0));
                }
            } else {
                let index = activeNotes.findIndex(n => n.string === stringIndex && n.fret === fretIndex);
                if (index > -1) {
                    activeNotes.splice(index, 1);
                } else {
                    activeNotes = activeNotes.filter(n => n.string !== stringIndex);
                    // ===== ALTERADO: tipo depende do estilo =====
                    activeNotes.push({
                        string: stringIndex,
                        fret: fretIndex,
                        type: noteStyle === 'numbers' ? 'number' : 'dot',
                        value: selectedFinger
                    });
                    // ===== FIM ALTERADO =====
                }
            }
            renderDots();
        }

        function toggleBarre() {
            let fret = parseInt(document.getElementById('barreFret').value);
            let s1 = parseInt(document.getElementById('barreStart').value);
            let s2 = parseInt(document.getElementById('barreEnd').value);
            let minStr = Math.min(s1, s2);
            let maxStr = Math.max(s1, s2);

            let index = activeBarres.findIndex(b => b.fret === fret);
            if (index > -1) {
                activeBarres.splice(index, 1);
            } else {
                activeBarres.push({ fret, minStr, maxStr });
            }
            renderDots();
        }

        // ===== NOVO: gera SVG de nota (bolinha ou número) =====
        function noteSVG(note, cx, cy) {
            if (note.type === 'dot') return `<circle cx="${cx}" cy="${cy}" r="6"/>`;
            if (note.type === 'number')
                return `<circle cx="${cx}" cy="${cy}" r="8" fill="#e94560"/><text x="${cx}" y="${cy}" fill="#fff" font-weight="bold" font-size="11" text-anchor="middle" dominant-baseline="central">${note.value}</text>`;
            if (note.type === 'text')
                return `<text x="${cx}" y="${cy}" fill="#e94560" font-weight="bold" font-size="14" text-anchor="middle" dominant-baseline="central">${note.value}</text>`;
            return '';
        }
        // ===== FIM NOVO =====

        function renderDots() {
            dotsGroup.innerHTML = '';
            fretNumberGroup.innerHTML = '';

            let startFret = parseInt(document.getElementById('startFretSelect').value);

            if (startFret > 1) {
                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", "12");
                text.setAttribute("y", "50");
                text.setAttribute("fill", "#333");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("font-size", "13");
                text.setAttribute("text-anchor", "middle");
                text.textContent = startFret + "ª";
                fretNumberGroup.appendChild(text);
            }

            activeBarres.forEach(barre => {
                let x1 = stringsX[barre.minStr];
                let x2 = stringsX[barre.maxStr];
                let cy = fretCentersY[barre.fret];
                let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", x1 - 6);
                rect.setAttribute("y", cy - 6);
                rect.setAttribute("width", (x2 - x1) + 12);
                rect.setAttribute("height", "12");
                rect.setAttribute("rx", "6");
                rect.setAttribute("fill", "#e94560");
                dotsGroup.appendChild(rect);
            });

            activeNotes.forEach(note => {
                let cx = stringsX[note.string];
                let cy = fretCentersY[note.fret];
                // ===== ALTERADO: usa noteSVG (aceita bolinha, número ou O/X) =====
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.innerHTML = noteSVG(note, cx, cy);
                dotsGroup.appendChild(g);
                // ===== FIM ALTERADO =====
            });
        }

        function insertChordIntoEditor() {
            let chordName = document.getElementById('chordNameInput').value || 'Bm';
            let textAlign = document.getElementById('textAlignSelect').value;
            let insertMode = document.getElementById('insertModeSelect').value;
            let startFret = parseInt(document.getElementById('startFretSelect').value);
            const config = getConfig();
            const n = config.strings;
            stringsX = calculateStringsX();

            let elementsHTML = '';

            if (startFret > 1) {
                elementsHTML += `<text x="12" y="50" fill="#333" font-weight="bold" font-size="13" text-anchor="middle">${startFret}ª</text>`;
            }

            activeBarres.forEach(barre => {
                let x1 = stringsX[barre.minStr];
                let x2 = stringsX[barre.maxStr];
                let cy = fretCentersY[barre.fret];
                elementsHTML += `<rect x="${x1 - 6}" y="${cy - 6}" width="${(x2 - x1) + 12}" height="12" rx="6"/>`;
            });

            // ===== ALTERADO: usa noteSVG para gerar bolinhas OU números =====
            activeNotes.forEach(note => {
                let cx = stringsX[note.string];
                let cy = fretCentersY[note.fret];
                elementsHTML += noteSVG(note, cx, cy);
            });
            // ===== FIM ALTERADO =====

            let stringLinesHTML = '';
            for (let i = 0; i < n; i++) {
                const x = stringsX[i];
                const w = config.stringWidths[i] || 1.2;
                stringLinesHTML += `<line x1="${x}" y1="30" x2="${x}" y2="150" stroke="#666" stroke-width="${w}"/>`;
            }

            let chordBody = `<div style="font:bold 20px sans-serif;color:#e94560;background:#fff;padding:0 8px;margin-bottom:-17px;text-align:center;position:relative;z-index:2;">${chordName}</div><svg width="140" height="160" viewBox="0 0 140 160"><rect x="25" y="30" width="90" height="4" fill="#333"/><path d="M25 60h90M25 90h90M25 120h90M25 150h90" stroke="#888" stroke-width="2"/>${stringLinesHTML}<g fill="#e94560" font-weight="bold" font-size="14" text-anchor="middle">${elementsHTML}</g></svg>`;

            let finalOutput = '';
            if (insertMode === 'inline') {
                finalOutput = `<div style="display:inline-block; margin: 5px 10px; text-align:${textAlign};">${chordBody}</div>`;
            } else {
                finalOutput = `<div style="text-align:${textAlign}; margin: 20px 0;"><div style="display:inline-block;">${chordBody}</div></div>`;
            }

            const startPos = editor.selectionStart;
            const endPos = editor.selectionEnd;
            
            editor.value = editor.value.substring(0, startPos) + "\n" + finalOutput + "\n" + editor.value.substring(endPos);
            updatePreview();
            
            chordModalOverlay.style.display = 'none';
        }

        // Inicialização
        editor.value = "# Meu Guia de Cifras\n\nProblema do botão 'X' resolvido!\n\n";
        currentInstrument = 'violao';
        renderStringLines();
        buildInteractiveGrid();
        updateBarreSelectors();
        renderDots();
        updatePreview();
    </script>
</body>
</html>
