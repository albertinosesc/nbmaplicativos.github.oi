<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo de Partituras - NBM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-100 flex flex-col font-sans text-slate-800">

    <!-- CABEÇALHO -->
    <header class="bg-indigo-900 text-white shadow-md p-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-music text-indigo-400"></i> Acervo de Partituras & Partes
            </h1>
            <p id="total-catalogadas" class="text-xs text-indigo-200">Carregando acervo do GitHub...</p>
        </div>

        <!-- BARRA DE BUSCA AVANÇADA -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
            <div class="relative flex-1 md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="campo-busca" placeholder="Busque por número, música, aluno, turma..." 
                    class="w-full pl-10 pr-4 py-2 bg-indigo-950/60 border border-indigo-700 rounded-lg text-sm text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>

            <!-- FILTRO DE TIPO DE BUSCA -->
            <select id="tipo-busca" class="bg-indigo-950/60 border border-indigo-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option value="todos" class="bg-indigo-950">🔍 Todos os Campos</option>
                <option value="numero" class="bg-indigo-950">🔢 Apenas por Número</option>
                <option value="texto" class="bg-indigo-950">📝 Nome / Aluno / Turma</option>
            </select>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- PAINEL LATERAL: LISTA DE ARQUIVOS -->
        <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm">
            <!-- Filtros rápidos por Tag -->
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex gap-2 overflow-x-auto text-xs">
                <button onclick="filtrarTag('todos')" class="tag-btn bg-indigo-600 text-white px-3 py-1 rounded-full font-medium whitespace-nowrap transition">Todos</button>
                <button onclick="filtrarTag('Turma A')" class="tag-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap hover:bg-slate-300 transition">Turma A</button>
                <button onclick="filtrarTag('Coral')" class="tag-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap hover:bg-slate-300 transition">Coral</button>
                <button onclick="filtrarTag('Violão')" class="tag-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-medium whitespace-nowrap hover:bg-slate-300 transition">Violão</button>
            </div>

            <!-- Lista de Resultados -->
            <div id="lista-arquivos" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p class="text-sm">Baixando índice do GitHub...</p>
                </div>
            </div>
        </aside>

        <!-- VISUALIZADOR DE PDF -->
        <main class="flex-1 bg-slate-200 flex flex-col hidden md:flex">
            <div id="painel-vazio" class="flex-1 flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                <i class="fa-regular fa-file-pdf text-6xl mb-3 text-slate-300"></i>
                <h3 class="text-lg font-medium text-slate-600">Nenhuma partitura selecionada</h3>
                <p class="text-sm max-w-sm mt-1">Selecione um item na lista ao lado ou digite o número/nome na busca para visualizar o PDF diretamente do GitHub.</p>
            </div>
            
            <iframe id="visualizador-pdf" class="w-full h-full hidden border-0" src=""></iframe>
        </main>
    </div>

    <!-- SCRIPT DE INTEGRAÇÃO COM O GITHUB -->
    <script>
        // URLs do seu repositório no GitHub (Raw)
        const URL_INDEX_JSON = "https://raw.githubusercontent.com/albertinosesc/nbmaplicativos.github.oi/main/aplicativos/01/painel/index.json";
        const URL_BASE_PDFS = "https://raw.githubusercontent.com/albertinosesc/nbmaplicativos.github.oi/main/aplicativos/01/painel/pdfs/";

        let acervoPartituras = [];
        let tagAtual = 'todos';

        // Carregar o arquivo index.json do GitHub ao iniciar
        async function carregarAcervo() {
            try {
                const resposta = await fetch(URL_INDEX_JSON);
                if (!resposta.ok) throw new Error("Erro ao carregar o arquivo index.json do GitHub.");
                
                acervoPartituras = await resposta.json();
                atualizarContador(acervoPartituras.length);
                renderizarLista(acervoPartituras);
            } catch (erro) {
                console.error(erro);
                document.getElementById('lista-arquivos').innerHTML = `
                    <div class="p-6 text-center text-red-500 text-sm">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
                        <p class="font-bold">Falha ao carregar o índice.</p>
                        <p class="text-xs text-slate-500 mt-1">Verifique se o arquivo index.json está publicado no GitHub na pasta correta.</p>
                    </div>
                `;
            }
        }

        function atualizarContador(total) {
            document.getElementById('total-catalogadas').innerText = `${total} partituras catalogadas`;
        }

        // Renderizar a lista lateral de arquivos
        function renderizarLista(itens) {
            const container = document.getElementById('lista-arquivos');
            container.innerHTML = '';

            if (itens.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Nenhuma partitura encontrada.</div>`;
                return;
            }

            // Otimização para grandes listas: renderiza os primeiros 100 para não travar o navegador
            const itensLimitados = itens.slice(0, 100);

            itensLimitados.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 hover:bg-indigo-50 cursor-pointer transition flex items-center justify-between group border-b border-slate-100";
                div.onclick = () => abrirPdf(item.id, div);

                div.innerHTML = `
                    <div class="flex items-start gap-3 overflow-hidden">
                        <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded shrink-0">#${item.id}</span>
                        <div class="truncate">
                            <h4 class="text-sm font-semibold text-slate-700 group-hover:text-indigo-900 truncate">${item.titulo || 'Sem Título'}</h4>
                            <p class="text-xs text-slate-500 truncate">Aluno: ${item.aluno || 'Geral'} | Turma: ${item.turma || 'N/A'}</p>
                            <div class="flex gap-1 mt-1">
                                <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${item.instrumento || 'Geral'}</span>
                                <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">${item.instituicao || 'NBM'}</span>
                            </div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-indigo-600 shrink-0"></i>
                `;
                container.appendChild(div);
            });

            if (itens.length > 100) {
                const aviso = document.createElement('div');
                aviso.className = "p-3 text-center text-xs text-slate-400 bg-slate-50";
                aviso.innerText = `Mostrando 100 de ${itens.length} resultados filtrados. Refine a busca para ver mais.`;
                container.appendChild(aviso);
            }
        }

        // Abrir o PDF correspondente no iframe
        function abrirPdf(id, elementoHtml) {
            // Remove seleção anterior
            document.querySelectorAll('#lista-arquivos > div').forEach(el => el.classList.remove('bg-indigo-100/60'));
            if(elementoHtml) elementoHtml.classList.add('bg-indigo-100/60');

            // Exibe iframe e oculta painel vazio
            document.getElementById('painel-vazio').classList.add('hidden');
            const iframe = document.getElementById('visualizador-pdf');
            iframe.classList.remove('hidden');

            // URL do PDF direto do GitHub (ex: .../pdfs/1.pdf)
            iframe.src = `${URL_BASE_PDFS}${id}.pdf`;
        }

        // Sistema de busca avançada
        const campoBusca = document.getElementById('campo-busca');
        const tipoBusca = document.getElementById('tipo-busca');

        function executarBusca() {
            const termo = campoBusca.value.toLowerCase().trim();
            const tipo = tipoBusca.value;

            const filtrados = acervoPartituras.filter(item => {
                // Filtro por tag rápida se ativo
                const matchTag = tagAtual === 'todos' || 
                    (item.turma && item.turma.toLowerCase().includes(tagAtual.toLowerCase())) ||
                    (item.instrumento && item.instrumento.toLowerCase().includes(tagAtual.toLowerCase()));

                if (!matchTag) return false;
                if (!termo) return true;

                const strId = String(item.id);
                const strTitulo = (item.titulo || "").toLowerCase();
                const strAluno = (item.aluno || "").toLowerCase();
                const strTurma = (item.turma || "").toLowerCase();
                const strInst = (item.instrumento || "").toLowerCase();
                const strInstituicao = (item.instituicao || "").toLowerCase();

                if (tipo === 'numero') {
                    return strId.includes(termo);
                } else if (tipo === 'texto') {
                    return strTitulo.includes(termo) || strAluno.includes(termo) || strTurma.includes(termo) || strInst.includes(termo);
                } else {
                    // Todos os campos
                    return strId.includes(termo) || strTitulo.includes(termo) || strAluno.includes(termo) || strTurma.includes(termo) || strInst.includes(termo) || strInstituicao.includes(termo);
                }
            });

            renderizarLista(filtrados);
        }

        campoBusca.addEventListener('input', executarBusca);
        tipoBusca.addEventListener('change', executarBusca);

        // Filtro por tag rápida nos botões superiores
        function filtrarTag(tag) {
            tagAtual = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-700');
            });
            event.target.classList.remove('bg-slate-200', 'text-slate-700');
            event.target.classList.add('bg-indigo-600', 'text-white');
            executarBusca();
        }

        // Inicializar aplicação baixando os dados do GitHub
        carregarAcervo();
    </script>
</body>
</html>
