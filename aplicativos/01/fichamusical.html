<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Musical — Caderno do Professor</title>
<style>
  :root {
    --cor-fundo: #f5f3ee;
    --cor-card: #ffffff;
    --cor-texto: #2c2c2c;
    --cor-suave: #8a8a8a;
    --cor-borda: #e0ddd6;
    --cor-primaria: #7c5cbf;
    --cor-primaria-escura: #5e3f9c;
    --adquirido: #4caf7d;
    --adquirido-bg: #e8f5ef;
    --desenvolvimento: #e0a800;
    --desenvolvimento-bg: #fdf6e3;
    --nao-iniciado: #b8b8b8;
    --nao-iniciado-bg: #f0f0f0;
    --modulo-cor: #7c5cbf;
    --modulo-bg: #f3effb;
    --sombra: 0 1px 3px rgba(0,0,0,0.06);
    --alerta: #e0a800;
    --alerta-bg: #fdf6e3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    line-height: 1.5;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--cor-borda);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  header.app-header h1 {
    font-size: 1.4rem;
    color: var(--cor-primaria-escura);
    font-weight: 600;
  }

  .acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--cor-borda);
    background: var(--cor-card);
    color: var(--cor-texto);
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: #fafafa; border-color: var(--cor-suave); }
  button.primario { background: var(--cor-primaria); color: white; border-color: var(--cor-primaria); }
  button.primario:hover { background: var(--cor-primaria-escura); }
  button.perigo { color: #c0392b; }
  button.mini { padding: 4px 10px; font-size: 0.8rem; }
  button.cloud { background: #4285f4; color: white; border-color: #4285f4; }
  button.cloud:hover { background: #3367d6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .card {
    background: var(--cor-card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--sombra);
    border: 1px solid var(--cor-borda);
  }

  .lista-itens { display: flex; flex-direction: column; gap: 8px; }

  .item-lista {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--cor-card);
    border-radius: 10px;
    border: 1px solid var(--cor-borda);
    cursor: pointer;
    transition: all 0.15s;
    gap: 12px;
  }
  .item-lista:hover { border-color: var(--cor-primaria); transform: translateX(2px); }
  .item-lista .info { flex: 1; min-width: 0; }
  .item-lista .titulo { font-weight: 500; }
  .item-lista .sub { font-size: 0.85rem; color: var(--cor-suave); }

  .vazio {
    text-align: center;
    padding: 40px 20px;
    color: var(--cor-suave);
    font-style: italic;
  }

  .ficha-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .chips-modulos {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chip-modulo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--modulo-bg);
    color: var(--modulo-cor);
    border: 1px solid var(--modulo-cor);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .chip-modulo button {
    background: transparent;
    border: none;
    color: var(--modulo-cor);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 2px;
    line-height: 1;
  }

  .abas {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--cor-borda);
    -webkit-overflow-scrolling: touch;
  }

  .aba {
    padding: 8px 14px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.9rem;
    color: var(--cor-suave);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .aba.ativa {
    color: var(--cor-primaria-escura);
    border-bottom-color: var(--cor-primaria);
    font-weight: 600;
  }

  .progresso-barra {
    height: 6px;
    background: var(--nao-iniciado-bg);
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0 16px;
  }
  .progresso-barra > div {
    height: 100%;
    background: var(--adquirido);
    transition: width 0.3s;
  }

  .bloco-modulo {
    border: 1px solid var(--modulo-cor);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    background: #fdfcff;
  }
  .bloco-modulo-header {
    background: var(--modulo-bg);
    padding: 8px 12px;
    font-weight: 600;
    color: var(--modulo-cor);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bloco-modulo-header .contagem {
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.8;
  }
  .bloco-modulo-body { padding: 8px 10px; }

  .codigo {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--cor-borda);
    margin-bottom: 4px;
    background: var(--nao-iniciado-bg);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .codigo[data-estado="adquirido"] { background: var(--adquirido-bg); border-color: var(--adquirido); }
  .codigo[data-estado="desenvolvimento"] { background: var(--desenvolvimento-bg); border-color: var(--desenvolvimento); }

  .codigo .cod {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--cor-suave);
    min-width: 40px;
  }
  .codigo .desc { font-size: 0.9rem; }
  .codigo .data { font-size: 0.75rem; color: var(--cor-suave); }

  .estado-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .estado-badge[data-estado="adquirido"] { background: var(--adquirido); color: white; }
  .estado-badge[data-estado="desenvolvimento"] { background: var(--desenvolvimento); color: white; }
  .estado-badge[data-estado="nao-iniciado"] { background: var(--nao-iniciado); color: white; }

  .modal-fundo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-fundo.oculto { display: none; }

  .modal {
    background: var(--cor-card);
    border-radius: 12px;
    padding: 20px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--cor-primaria-escura); }

  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 0.85rem; color: var(--cor-suave); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--cor-card);
  }
  .campo textarea { min-height: 60px; resize: vertical; }

  .modal-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  .modulo-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modulo-check:hover { border-color: var(--modulo-cor); }
  .modulo-check input[type="checkbox"] {
    width: 20px; height: 20px;
    cursor: pointer; margin-top: 2px; flex-shrink: 0;
  }
  .modulo-check .info { flex: 1; }
  .modulo-check .titulo { font-weight: 500; font-size: 0.95rem; }
  .modulo-check .sub { font-size: 0.8rem; color: var(--cor-suave); margin-top: 2px; }

  .tutorial-secao {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cor-borda);
  }
  .tutorial-secao:last-child { border-bottom: none; }
  .tutorial-secao h3 {
    color: var(--cor-primaria-escura);
    font-size: 1rem;
    margin-bottom: 8px;
  }
  .tutorial-secao p, .tutorial-secao li {
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .tutorial-secao ul, .tutorial-secao ol { padding-left: 20px; margin-bottom: 8px; }
  .tutorial-secao code {
    background: #f0ede5;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 0.85em;
  }
  .tutorial-secao kbd {
    background: #2c2c2c; color: white;
    padding: 2px 6px; border-radius: 4px;
    font-size: 0.8em; font-family: inherit;
  }

  .aviso {
    background: var(--desenvolvimento-bg);
    border: 1px solid var(--desenvolvimento);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }

  .lista-conceitos { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .conceito-linha {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    background: #faf9f6;
    font-size: 0.85rem;
  }
  .conceito-linha .cod { font-family: ui-monospace, monospace; font-weight: 600; color: var(--cor-suave); }
  .conceito-linha .desc { flex: 1; }
  .conceito-linha .acoes { display: flex; gap: 4px; }
  .conceito-linha .meta { font-size: 0.75rem; color: var(--cor-suave); display: block; margin-top: 2px; }

  .modulo-card {
    border: 1px solid var(--cor-borda);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--cor-card);
    box-shadow: var(--sombra);
  }
  .modulo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .modulo-card-titulo { font-weight: 600; font-size: 1rem; }
  .modulo-card-titulo .badge {
    display: inline-block;
    background: var(--modulo-bg);
    color: var(--modulo-cor);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .modulo-card-desc {
    font-size: 0.85rem;
    color: var(--cor-suave);
    margin-bottom: 8px;
  }
  .modulo-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .modulo-tag {
    font-size: 0.72rem;
    font-family: ui-monospace, monospace;
    background: #f0ede5;
    color: var(--cor-texto);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .modulo-tag.eixo-A { background: #e8eefc; }
  .modulo-tag.eixo-E { background: #fce8e8; }
  .modulo-tag.eixo-L { background: #e8f5ef; }
  .modulo-tag.eixo-W { background: #fdf6e3; }
  .modulo-tag.eixo-AP { background: #f0e8fc; }
  .modulo-tag.eixo-CR { background: #fce8f5; }
  .modulo-tag.eixo-CT { background: #e8f5f0; }
  .modulo-tag.eixo-OU { background: #f0ede5; }
  .modulo-tag.eixo-O2 { background: #ede5f0; }

  .modulo-vazio {
    color: var(--cor-suave);
    font-size: 0.85rem;
    font-style: italic;
  }

  .cloud-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 12px;
    background: #e8f5ef;
    color: var(--adquirido);
  }

  .previa-lote {
    background: #f0f8f4;
    border: 1px solid var(--adquirido);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    max-height: 220px;
    overflow-y: auto;
  }
  .previa-lote ul { list-style: none; padding: 0; margin: 0; }
  .previa-lote li {
    padding: 4px 0;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    border-bottom: 1px solid #e0ede6;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .previa-lote li:last-child { border-bottom: none; }
  .previa-lote li b { color: var(--cor-primaria); }

  .tag-status {
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tag-status.novo { background: var(--adquirido); color: white; }
  .tag-status.existe { background: var(--alerta); color: white; }

  .lista-hab-modulo {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }
  .hab-modulo-linha {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    background: #faf9f6;
    font-size: 0.85rem;
  }
  .hab-modulo-linha .cod {
    font-family: ui-monospace, monospace;
    font-weight: 600;
    color: var(--cor-suave);
  }
  .hab-modulo-linha .desc { flex: 1; }

  .grupo-eixo {
    margin-bottom: 12px;
  }
  .grupo-eixo-header {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--cor-primaria-escura);
    margin-bottom: 4px;
    padding: 4px 0;
    border-bottom: 1px solid var(--cor-borda);
  }

  /* Textarea do bloco de notas */
  .bloco-notas {
    width: 100%;
    min-height: 380px;
    padding: 14px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    background: #fafaf7;
    resize: vertical;
    white-space: pre;
    overflow-x: auto;
  }

  .filtros-linha {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  @media (max-width: 500px) {
    .filtros-linha { grid-template-columns: 1fr; }
  }

  .checkbox-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #faf9f6;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .checkbox-linha input { width: 18px; height: 18px; cursor: pointer; }

  .acoes-bloco {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  @media print {
    body { background: white; padding: 0; max-width: 100%; }
    .acoes-topo, .abas, .estado-badge, button, .chips-modulos button { display: none !important; }
    .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
    .codigo { background: white !important; border-color: #ccc !important; }
    header.app-header { border-bottom: 2px solid #333; }
    .codigo .data { color: #333; }
    .bloco-modulo { border-color: #999; }
  }

  @media (max-width: 480px) {
    header.app-header h1 { font-size: 1.1rem; }
    .codigo { grid-template-columns: auto 1fr; }
    .codigo .data { grid-column: 2; font-size: 0.7rem; }
    .conceito-linha { grid-template-columns: 50px 1fr auto; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>🎵 Ficha Musical</h1>
  <div class="acoes-topo">
    <button id="btnTutorial" title="Como usar o app">❓ Tutorial</button>
    <button id="btnCatalogo" title="Consultar catálogo de habilidades">📋 Catálogo</button>
    <button id="btnModulos" title="Gerenciar módulos de estudo">📦 Módulos</button>
    <button id="btnTexto" title="Exportar habilidades como texto">📝 Texto</button>
    <button class="cloud" id="btnNuvem" title="Sincronizar com Google Sheets">☁️ Nuvem</button>
    <button id="btnExportar" title="Baixar backup em JSON">⬇️ Exportar</button>
    <button id="btnImportar" title="Restaurar backup">⬆️ Importar</button>
    <input type="file" id="inputArquivo" accept=".json" style="display:none">
  </div>
</header>

<main id="app"></main>

<div class="modal-fundo oculto" id="modalFundo">
  <div class="modal" id="modalConteudo"></div>
</div>

<script>
/* ============================================================
   FICHA MUSICAL — Caderno do Professor
   Versão 4.1:
   - Botão 📝 Texto: exportar habilidades como bloco de notas
   - Filtros por eixo + módulo + "incluir módulos que usam"
   - Nome do arquivo editável
   - Copiar, baixar .txt
   ============================================================ */

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4LOiTzKySCMz0dfsj5a9nK_NSiUfPIgDfT63mtxVManUuNvkPjCrPjWmTwY0rZWoewA/exec";

const EIXOS_PADRAO = {
  A:  { nome: "Audição",     icone: "🎧", codigos: [
    ["A.1", "Identifica notas CDEFG chamando pelo nome"],
    ["A.2", "Identifica notas CDEFG tocando no instrumento"],
    ["A.3", "Identifica notas CDEFG escrevendo por grau"],
    ["A.4", "Identifica notas CDEFG digitando cifra / notação ABC"],
  ]},
  E:  { nome: "Execução",    icone: "🎹", codigos: [
    ["E.1",  "Toca cifra C (mão esquerda)"],
    ["E.2",  "Toca cifra G7 (mão esquerda)"],
    ["E.3",  "Toca nota C (mão direita)"],
    ["E.4",  "Toca nota B (mão direita)"],
    ["E.5",  "Toca EG (mão direita)"],
    ["E.6",  "Toca FG (mão direita)"],
    ["E.7",  "Toca simultâneo (mãos juntas)"],
    ["E.8",  "Toca arejado (articulação / respiração)"],
    ["E.9",  "Executa Música 12 — Cokoo"],
    ["E.10", "Executa Música 142 — Borboleta"],
  ]},
  L:  { nome: "Leitura",     icone: "📖", codigos: [
    ["L.1",  "Reconhece pentagrama"],
    ["L.2",  "Reconhece signo de compasso"],
    ["L.3",  "Reconhece barra final"],
    ["L.4",  "Reconhece barra simples"],
    ["L.5",  "Reconhece ritornelo"],
    ["L.6",  "Reconhece dinâmica p (piano)"],
    ["L.7",  "Reconhece dinâmica mf (mezzo-forte)"],
    ["L.8",  "Reconhece dinâmica ff (fortíssimo)"],
    ["L.9",  "Reconhece Clave de Sol"],
    ["L.10", "Reconhece Clave de Fá"],
  ]},
  W:  { nome: "Escrita",     icone: "✍️", codigos: [
    ["W.1", "Desenha pentagrama"],
    ["W.2", "Desenha Clave de Sol"],
    ["W.3", "Desenha Clave de Fá"],
    ["W.4", "Desenha ritornelo"],
    ["W.5", "Desenha barra final"],
  ]},
  AP: { nome: "Apreciação",  icone: "👂", codigos: [
    ["AP.1", "Escuta ativa de repertório"],
    ["AP.2", "Reconhece estilos musicais"],
    ["AP.3", "Analisa criticamente uma obra"],
    ["AP.4", "Identifica instrumentos na escuta"],
  ]},
  CR: { nome: "Criação",     icone: "🎨", codigos: [
    ["CR.1", "Improvisa livremente"],
    ["CR.2", "Improvisa sobre base harmônica"],
    ["CR.3", "Compõe pequenas melodias"],
    ["CR.4", "Cria arranjos simples"],
  ]},
  CT: { nome: "Contexto",    icone: "🌍", codigos: [
    ["CT.1", "Conhece contexto histórico do repertório"],
    ["CT.2", "Reconhece função social da música"],
    ["CT.3", "Valoriza diversidade cultural musical"],
  ]},
  OU: { nome: "Outros 1",    icone: "📌", codigos: [] },
  O2: { nome: "Outros 2",    icone: "📎", codigos: [] },
};

const ESTADOS = ["nao-iniciado", "desenvolvimento", "adquirido"];
const LABEL_ESTADO = {
  "nao-iniciado": "Não iniciado",
  "desenvolvimento": "Em desenvolvimento",
  "adquirido": "Adquirido",
};

let DB = carregarDB();
let navegacao = { tela: "home", turmaId: null, alunoId: null, abaAtiva: null };
let CONFIG = carregarConfig();

const CHAVE = "ficha-musical-v1";
const CHAVE_CONFIG = "ficha-musical-config-v1";

function carregarDB() {
  try {
    const raw = localStorage.getItem(CHAVE);
    if (!raw) return dbInicial();
    const dados = JSON.parse(raw);
    if (!dados.eixos) dados.eixos = {};
    Object.keys(EIXOS_PADRAO).forEach(k => {
      if (!dados.eixos[k]) {
        dados.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
      } else {
        if (!Array.isArray(dados.eixos[k].codigos)) dados.eixos[k].codigos = [];
        if (!dados.eixos[k].nome) dados.eixos[k].nome = EIXOS_PADRAO[k].nome;
        if (!dados.eixos[k].icone) dados.eixos[k].icone = EIXOS_PADRAO[k].icone;
      }
    });
    if (!dados.modulos) dados.modulos = modulosIniciais();
    if (!dados.turmas) dados.turmas = [];
    dados.turmas.forEach(t => t.alunos.forEach(a => {
      if (!a.modulos) a.modulos = [];
      if (!a.registros) a.registros = {};
      if (!a.observacoesGerais) a.observacoesGerais = "";
      if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
    }));
    return dados;
  } catch (e) {
    console.error("Erro ao carregar:", e);
    return dbInicial();
  }
}

function salvarDB() {
  localStorage.setItem(CHAVE, JSON.stringify(DB));
}

function carregarConfig() {
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_CONFIG)) || {};
    return { webAppUrl: WEBAPP_URL, email: salvo.email || "" };
  } catch {
    return { webAppUrl: WEBAPP_URL, email: "" };
  }
}

function salvarConfig() {
  localStorage.setItem(CHAVE_CONFIG, JSON.stringify({ email: CONFIG.email }));
}

function dbInicial() {
  return {
    versao: "4.1",
    turmas: [],
    eixos: JSON.parse(JSON.stringify(EIXOS_PADRAO)),
    modulos: modulosIniciais(),
  };
}

function modulosIniciais() {
  return [
    {
      id: "mod_intro",
      nome: "Módulo 1 — Introdução",
      descricao: "Primeiros passos no instrumento e na leitura",
      habilidades: ["A.1","A.2","E.1","E.2","E.3","E.4","L.1","L.2"],
    },
    {
      id: "mod_leitura",
      nome: "Módulo 2 — Leitura básica",
      descricao: "Elementos essenciais da partitura",
      habilidades: ["L.1","L.2","L.3","L.4","W.1","W.2"],
    },
  ];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hoje() { return new Date().toISOString().slice(0, 10); }
function agoraISO() { return new Date().toISOString(); }
function getTurma(id) { return DB.turmas.find(t => t.id === id); }
function getAluno(turmaId, alunoId) {
  const t = getTurma(turmaId);
  return t ? t.alunos.find(a => a.id === alunoId) : null;
}
function getModulo(id) { return DB.modulos.find(m => m.id === id); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function nomeModulo(id) {
  const m = getModulo(id);
  return m ? m.nome : "(módulo removido)";
}

function acharCodigoPorDescricao(eixoKey, descricao) {
  const eixo = DB.eixos[eixoKey];
  if (!eixo) return null;
  const alvo = descricao.trim().toLowerCase();
  const achado = eixo.codigos.find(([, d]) => (d || "").trim().toLowerCase() === alvo);
  return achado ? achado[0] : null;
}

function proximoCodigo(eixoKey) {
  const eixo = DB.eixos[eixoKey];
  if (!eixo || !Array.isArray(eixo.codigos) || eixo.codigos.length === 0) {
    return `${eixoKey}.1`;
  }
  let maior = 0;
  eixo.codigos.forEach(([cod]) => {
    if (!cod || typeof cod !== "string") return;
    const prefixo = eixoKey + ".";
    if (cod.startsWith(prefixo)) {
      const n = parseInt(cod.slice(prefixo.length), 10);
      if (!isNaN(n) && n > maior) maior = n;
    }
  });
  return `${eixoKey}.${maior + 1}`;
}

function contarModulosQueUsam(codigo) {
  return DB.modulos.filter(m => (m.habilidades || []).includes(codigo)).length;
}

function modulosQueUsam(codigo) {
  return DB.modulos.filter(m => (m.habilidades || []).includes(codigo));
}

function codigosDoAlunoNoEixo(aluno, eixoKey) {
  const set = new Set();
  (aluno.modulos || []).forEach(mid => {
    const m = getModulo(mid);
    if (!m) return;
    m.habilidades.forEach(cod => {
      if (cod.startsWith(eixoKey + ".")) set.add(cod);
    });
  });
  return set;
}

function contarProgressoDoAluno(aluno, eixoKey) {
  const codigos = codigosDoAlunoNoEixo(aluno, eixoKey);
  let adq = 0;
  codigos.forEach(cod => {
    if (aluno.registros[eixoKey]?.[cod]?.estado === "adquirido") adq++;
  });
  return { adquiridos: adq, total: codigos.size };
}

function progressoGeralDoAluno(aluno) {
  let adq = 0, tot = 0;
  Object.keys(DB.eixos).forEach(eixo => {
    const p = contarProgressoDoAluno(aluno, eixo);
    adq += p.adquiridos; tot += p.total;
  });
  return { adq, tot, pct: tot ? Math.round(100 * adq / tot) : 0 };
}

function habilidadesModuloPorEixo(modulo) {
  const porEixo = {};
  modulo.habilidades.forEach(cod => {
    const [eixo] = cod.split(".");
    if (!DB.eixos[eixo]) return;
    if (!porEixo[eixo]) porEixo[eixo] = [];
    porEixo[eixo].push(cod);
  });
  return porEixo;
}

// ---------- Render ----------
function render() {
  const app = document.getElementById("app");
  if (navegacao.tela === "home") app.innerHTML = renderHome();
  else if (navegacao.tela === "turma") app.innerHTML = renderTurma();
  else if (navegacao.tela === "aluno") app.innerHTML = renderAluno();
  else if (navegacao.tela === "relatorio") app.innerHTML = renderRelatorio();
  bindEventos();
}

function renderHome() {
  const turmas = DB.turmas;
  return `

      ? `<div class="vazio">Nenhuma turma cadastrada.<br>Toque em <b>Nova Turma</b> para começar.</div>`

}

    <div class="ficha-header">

function renderAluno() {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) { navegacao.tela = "turma"; return renderTurma(); }

  const eixoKeys = Object.keys(DB.eixos);
  if (!navegacao.abaAtiva || !DB.eixos[navegacao.abaAtiva]) {
    navegacao.abaAtiva = eixoKeys[0];
  }
  const eixoKey = navegacao.abaAtiva;
  const defEixo = DB.eixos[eixoKey];

  const modulosDoAluno = (aluno.modulos || []).map(getModulo).filter(Boolean);

  let conteudoEixo = "";
  const progressoAba = contarProgressoDoAluno(aluno, eixoKey);

  if (modulosDoAluno.length === 0) {
    conteudoEixo = `<div class="aviso">Este aluno ainda não tem módulos vinculados. Use "➕ Adicionar módulo" abaixo.</div>`;
  } else {
    let temAlguma = false;

    modulosDoAluno.forEach(mod => {
      const habs = mod.habilidades.filter(cod => cod.startsWith(eixoKey + "."));
      if (habs.length === 0) return;
      temAlguma = true;

      const adqMod = habs.filter(cod => aluno.registros[eixoKey]?.[cod]?.estado === "adquirido").length;

      conteudoEixo += `
        <div class="bloco-modulo">
          <div class="bloco-modulo-header">
            <span>📦 ${esc(mod.nome)}</span>
            <span class="contagem">${adqMod}/${habs.length}</span>
          </div>
          <div class="bloco-modulo-body">
            ${habs.map(cod => {
              const defCod = defEixo.codigos.find(([c]) => c === cod);
              const desc = defCod ? defCod[1] : "(conceito removido)";
              const reg = aluno.registros[eixoKey]?.[cod] || { estado: "nao-iniciado" };
              return `
                <div class="codigo" data-estado="${reg.estado}" data-acao="ciclar-estado" data-eixo="${eixoKey}" data-cod="${cod}">
                  <span class="cod">${cod}</span>
                  <div>
                    <div class="desc">${esc(desc)}</div>
                    ${reg.data ? `<div class="data">${reg.data}</div>` : ""}
                  </div>
                  <span class="estado-badge" data-estado="${reg.estado}">${LABEL_ESTADO[reg.estado].split(" ")[0]}</span>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    });

    if (!temAlguma) {
      conteudoEixo = `<div class="aviso">Nenhuma habilidade deste eixo está nos módulos deste aluno.</div>`;
    }
  }

  const pctEixo = progressoAba.total ? (progressoAba.adquiridos / progressoAba.total * 100) : 0;

  return `
    <div class="ficha-header">
      <div style="flex:1">
        <button class="mini" data-acao="voltar-turma">← Turma</button>
        <h2 style="margin-top:8px;font-size:1.15rem">${esc(aluno.nome)}</h2>
        <div class="sub" style="color:var(--cor-suave);font-size:0.85rem">Início: ${aluno.dataInicio || "—"}</div>
        <div class="chips-modulos">
          ${modulosDoAluno.map(m => `
            <span class="chip-modulo">
              📦 ${esc(m.nome)}
              <button title="Remover módulo" data-acao="remover-modulo-aluno" data-id="${m.id}">×</button>
            </span>
          `).join("") || `<span style="font-size:0.8rem;color:var(--cor-suave)">Nenhum módulo vinculado</span>`}
          <button class="mini" data-acao="adicionar-modulo-aluno" style="border-radius:20px">➕ Adicionar módulo</button>
        </div>
      </div>
      <button class="mini" data-acao="abrir-relatorio">📊 Relatório</button>
    </div>

    <div class="abas">
      ${Object.entries(DB.eixos).map(([k, v]) => {
        const p = contarProgressoDoAluno(aluno, k);
        const ativo = k === eixoKey ? "ativa" : "";
        return `<button class="aba ${ativo}" data-acao="mudar-aba" data-aba="${k}">
          ${v.icone} ${v.nome} ${p.adquiridos}/${p.total}
        </button>`;
      }).join("")}
    </div>

    <div class="card">
      <h3 style="font-size:1rem;margin-bottom:12px">${defEixo.icone} ${defEixo.nome}</h3>
      <div class="progresso-barra"><div style="width:${pctEixo}%"></div></div>
      ${conteudoEixo}
    </div>

    <div class="card">
      <h3 style="font-size:1rem;margin-bottom:12px">📝 Observações gerais</h3>
      <textarea id="obsGerais" style="width:100%;min-height:80px;padding:8px;border:1px solid var(--cor-borda);border-radius:8px;font-family:inherit" placeholder="Anotações sobre o aluno...">${esc(aluno.observacoesGerais || "")}</textarea>
      <div style="margin-top:8px;text-align:right">
        <button class="mini primario" data-acao="salvar-obs">Salvar observação</button>
      </div>
    </div>
  `;
}

  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  const turma = getTurma(navegacao.turmaId);
  if (!aluno) { navegacao.tela = "home"; return renderHome(); }

  return `
    <div class="ficha-header">
      <div>
        <button class="mini" data-acao="voltar-aluno">← Ficha</button>
        <h2 style="margin-top:8px;font-size:1.15rem">📊 Relatório — ${esc(aluno.nome)}</h2>
        <div class="sub" style="color:var(--cor-suave);font-size:0.85rem">${esc(turma.nome)} • ${turma.ano}/${turma.semestre}</div>

        ${modulosDoAluno.map(m => `
          <div style="margin-bottom:6px;font-size:.9rem">📦 <b>${esc(m.nome)}</b> — ${m.habilidades.length} habilidade(s)</div>

      </div>

    <div class="card">
      <h3 style="margin-bottom:12px">Progresso por eixo (somente módulos do aluno)</h3>
      ${Object.entries(DB.eixos).map(([k, v]) => {
        const p = contarProgressoDoAluno(aluno, k);

          <div style="margin-bottom:12px">

              <span>${v.icone} ${v.nome}</span>

            </div>
            <div class="progresso-barra"><div style="width:${pct}%"></div></div>

        `;
      }).join("")}

    <div class="card">
      <h3 style="margin-bottom:12px">Progresso por módulo</h3>
      ${modulosDoAluno.length === 0
        ? `<div class="vazio" style="padding:16px">Nenhum módulo vinculado.</div>`
        : modulosDoAluno.map(mod => {
            let adq = 0;
            mod.habilidades.forEach(cod => {
              const [eixo] = cod.split(".");
              if (aluno.registros[eixo]?.[cod]?.estado === "adquirido") adq++;
            });
            const total = mod.habilidades.length;
            const pct = total ? Math.round(100 * adq / total) : 0;
            return `
              <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:.9rem">
                  <span>📦 ${esc(mod.nome)}</span>
                  <span style="color:var(--cor-suave)">${adq}/${total} (${pct}%)</span>
                </div>
                <div class="progresso-barra"><div style="width:${pct}%"></div></div>
              </div>
            `;
          }).join("")}
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">Detalhamento por módulo</h3>
      ${modulosDoAluno.length === 0
        ? `<div class="vazio" style="padding:16px">Nenhum módulo vinculado.</div>`
        : modulosDoAluno.map(mod => {
            const porEixo = habilidadesModuloPorEixo(mod);
            return `
              <div style="margin-bottom:18px">
                <div style="font-weight:600;margin-bottom:6px">📦 ${esc(mod.nome)}</div>
                ${Object.entries(porEixo).map(([eixo, cods]) => `
                  <div style="margin-left:12px;margin-bottom:8px">
                    <div style="font-size:.85rem;color:var(--cor-suave);margin-bottom:2px">${DB.eixos[eixo].icone} ${DB.eixos[eixo].nome}</div>
                    ${cods.map(cod => {
                      const def = DB.eixos[eixo].codigos.find(([c]) => c === cod);
                      const desc = def ? def[1] : "(removido)";
                      const reg = aluno.registros[eixo]?.[cod] || { estado: "nao-iniciado" };
                      const marca = reg.estado === "adquirido" ? "✅" : reg.estado === "desenvolvimento" ? "🟡" : "⬜";
                      return `<div style="font-size:.83rem;padding:2px 0;margin-left:8px">${marca} <b>${cod}</b> — ${esc(desc)} ${reg.data ? `<span style="color:var(--cor-suave)">(${reg.data})</span>` : ""}</div>`;

                `).join("")}
              </div>

          }).join("")}

    ${aluno.observacoesGerais ? `
      <div class="card">
        <h3 style="margin-bottom:12px">Observações</h3>
        <p style="font-size:.9rem;white-space:pre-wrap">${esc(aluno.observacoesGerais)}</p>
      </div>
    ` : ""}

    <div style="text-align:center;color:var(--cor-suave);font-size:.8rem;margin-top:20px">
      Gerado em ${new Date().toLocaleString("pt-BR")}
    </div>
  `;

function bindEventos() {
  document.querySelectorAll("[data-acao]").forEach(el => {
    el.addEventListener("click", e => {
      const acao = el.dataset.acao;
      if (acao === "abrir-turma") return abrirTurma(el.dataset.id);
      if (acao === "voltar-home") { navegacao = { tela: "home" }; return render(); }
      if (acao === "nova-turma") return modalNovaTurma();
      if (acao === "excluir-turma") { e.stopPropagation(); return excluirTurma(el.dataset.id); }
      if (acao === "novo-aluno") return modalNovoAluno();
      if (acao === "abrir-aluno") return abrirAluno(el.dataset.id);
      if (acao === "voltar-turma") { navegacao.tela = "turma"; navegacao.alunoId = null; return render(); }
      if (acao === "excluir-aluno") { e.stopPropagation(); return excluirAluno(el.dataset.id); }
      if (acao === "mudar-aba") { navegacao.abaAtiva = el.dataset.aba; return render(); }
      if (acao === "ciclar-estado") return ciclarEstado(el.dataset.eixo, el.dataset.cod);
      if (acao === "salvar-obs") return salvarObs();
      if (acao === "abrir-relatorio") { navegacao.tela = "relatorio"; return render(); }
      if (acao === "voltar-aluno") { navegacao.tela = "aluno"; return render(); }
      if (acao === "imprimir") return window.print();
      if (acao === "adicionar-modulo-aluno") return modalAdicionarModuloAoAluno();
      if (acao === "remover-modulo-aluno") { e.stopPropagation(); return removerModuloDoAluno(el.dataset.id); }
    });
  });
}

function abrirTurma(id) { navegacao = { tela: "turma", turmaId: id }; render(); }

function abrirAluno(id) {
  navegacao.tela = "aluno";
  navegacao.alunoId = id;
  navegacao.abaAtiva = Object.keys(DB.eixos)[0];
  render();
}

function ciclarEstado(eixo, cod) {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  if (!aluno.registros[eixo]) aluno.registros[eixo] = {};
  const reg = aluno.registros[eixo][cod] || { estado: "nao-iniciado", data: null };
  const idx = ESTADOS.indexOf(reg.estado);
  const novo = ESTADOS[(idx + 1) % ESTADOS.length];
  reg.estado = novo;
  reg.data = novo === "adquirido" ? hoje() : (novo === "nao-iniciado" ? null : reg.data);
  aluno.registros[eixo][cod] = reg;
  aluno.atualizadoEm = agoraISO();
  salvarDB();
  render();
}

function salvarObs() {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  aluno.observacoesGerais = document.getElementById("obsGerais").value;
  aluno.atualizadoEm = agoraISO();
  salvarDB();
  flash("Observação salva!");
}

function excluirTurma(id) {
  if (!confirm("Excluir esta turma e todos os alunos dela?")) return;
  DB.turmas = DB.turmas.filter(t => t.id !== id);
  salvarDB(); render();
}

function excluirAluno(id) {
  if (!confirm("Excluir este aluno?")) return;
  const t = getTurma(navegacao.turmaId);
  t.alunos = t.alunos.filter(a => a.id !== id);
  salvarDB(); render();
}

function removerModuloDoAluno(moduloId) {
  const aluno = getAluno(navegacao.turmaId, navegacao.alunoId);
  if (!aluno) return;
  if (!confirm(`Remover o módulo "${nomeModulo(moduloId)}" deste aluno?\n\nOs registros já feitos serão preservados, mas o módulo não aparecerá mais na ficha.`)) return;
  aluno.modulos = aluno.modulos.filter(id => id !== moduloId);
  aluno.atualizadoEm = agoraISO();
  salvarDB(); render();
}

function modalModulos() {
  const modulosHTML = DB.modulos.map(m => `
    <div class="modulo-card">
      <div class="modulo-card-header">
        <div style="flex:1">
          <div class="modulo-card-titulo">📦 ${esc(m.nome)} <span class="badge">${m.habilidades.length} habil.</span></div>
          ${m.descricao ? `<div class="modulo-card-desc">${esc(m.descricao)}</div>` : ""}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="mini" data-editar="${m.id}">✏️</button>
          <button class="mini perigo" data-excluir="${m.id}">🗑</button>
        </div>
      </div>
      <div class="modulo-tags">
        ${m.habilidades.length === 0
          ? `<span class="modulo-vazio">Nenhuma habilidade vinculada</span>`
          : m.habilidades.slice(0, 30).map(c => `<span class="modulo-tag eixo-${c.split(".")[0]}">${c}</span>`).join("") +
            (m.habilidades.length > 30 ? `<span class="modulo-vazio">... +${m.habilidades.length - 30}</span>` : "")}
      </div>
    </div>
  `).join("") || `<div class="vazio">Nenhum módulo criado ainda.</div>`;

  abrirModal(`
    <h2>📦 Módulos de Estudo</h2>
    <div class="aviso">
      Um módulo é um conjunto de habilidades que o aluno vai estudar. Escreva as habilidades diretamente no módulo — os códigos são gerados automaticamente.
    </div>

    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="primario" id="btnNovoModulo">+ Novo Módulo</button>
    </div>

    <div id="listaModulos">${modulosHTML}</div>

    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };
  document.getElementById("btnNovoModulo").onclick = () => modalEditarModulo(null);

  document.querySelectorAll("[data-editar]").forEach(btn => {
    btn.onclick = () => modalEditarModulo(btn.dataset.editar);
  });
  document.querySelectorAll("[data-excluir]").forEach(btn => {
    btn.onclick = () => {
      const m = getModulo(btn.dataset.excluir);
      if (!m) return;
      const usados = DB.turmas.flatMap(t => t.alunos).filter(a => (a.modulos || []).includes(m.id)).length;
      const msg = usados > 0
        ? `Este módulo está vinculado a ${usados} aluno(s). Excluir mesmo assim? Os vínculos ficarão órfãos.`
        : `Excluir o módulo "${m.nome}"?`;
      if (!confirm(msg)) return;
      DB.modulos = DB.modulos.filter(x => x.id !== m.id);
      salvarDB();
      modalModulos();
    };
  });
}

function modalEditarModulo(moduloId) {
  const m = moduloId ? getModulo(moduloId) : null;
  const habilidadesTmp = new Set(m ? m.habilidades : []);

  const eixoKeys = Object.keys(DB.eixos);

  abrirModal(`
    <h2>${m ? "Editar" : "Novo"} Módulo</h2>
    <div class="campo">
      <label>Nome do módulo</label>
      <input id="mNome" value="${m ? esc(m.nome) : ""}" placeholder="Ex.: Módulo Thompson 1º Grau">
    </div>
    <div class="campo">
      <label>Descrição (opcional)</label>
      <input id="mDesc" value="${m ? esc(m.descricao || "") : ""}" placeholder="Ex.: Primeiras 10 peças do método">
    </div>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--cor-borda)">
      <label style="display:block;font-size:.9rem;font-weight:600;color:var(--cor-primaria-escura);margin-bottom:8px">
        ➕ Adicionar habilidades
      </label>
      <div class="aviso" style="margin-top:6px">
        Escreva <b>uma habilidade por linha</b>. O código será gerado automaticamente.<br>
        Se a descrição já existir no eixo, o app pergunta se quer reutilizar.
      </div>

      <div class="campo" style="margin-top:8px">
        <label>Eixo da habilidade</label>
        <select id="mEixoSelect">
          ${eixoKeys.map(k => `
            <option value="${k}">${DB.eixos[k].icone} ${DB.eixos[k].nome} (${(DB.eixos[k].codigos || []).length} já cadastradas)</option>
          `).join("")}
        </select>
      </div>

      <textarea id="loteHab" placeholder="Reconhece intervalo de terça&#10;Identifica notas na região aguda&#10;Reconhece padrão melódico repetido" style="width:100%;min-height:110px;padding:8px;border:1px solid var(--cor-borda);border-radius:8px;font-family:inherit;font-size:.9rem"></textarea>

      <div id="previaLote" style="margin-top:8px"></div>

      <button class="primario" id="btnAddLote" style="width:100%;margin-top:8px" disabled>
        Adicionar ao módulo
      </button>
    </div>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--cor-borda)">
      <label style="display:block;font-size:.9rem;font-weight:600;color:var(--cor-primaria-escura);margin-bottom:8px">
        📋 Habilidades deste módulo (<span id="contadorHab">0</span>)
      </label>
      <div id="listaHabModulo"></div>
    </div>

    <div class="modal-acoes">
      <button data-fechar>Cancelar</button>
      <button class="primario" id="mSalvar">Salvar Módulo</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => modalModulos();

  const select = document.getElementById("mEixoSelect");
  const textarea = document.getElementById("loteHab");
  const btnAdd = document.getElementById("btnAddLote");
  const previa = document.getElementById("previaLote");
  const listaHab = document.getElementById("listaHabModulo");
  const contador = document.getElementById("contadorHab");

  function atualizarSelect() {
    [...select.options].forEach(opt => {
      const k = opt.value;
      opt.textContent = `${DB.eixos[k].icone} ${DB.eixos[k].nome} (${(DB.eixos[k].codigos || []).length} já cadastradas)`;
    });
  }

  function renderListaHab() {
    const arr = [...habilidadesTmp];
    contador.textContent = arr.length;

    if (arr.length === 0) {
      listaHab.innerHTML = `<div class="vazio" style="padding:12px;font-size:.85rem">Nenhuma habilidade ainda.</div>`;
      return;
    }

    const porEixo = {};
    arr.forEach(cod => {
      const [eixo] = cod.split(".");
      if (!DB.eixos[eixo]) return;
      if (!porEixo[eixo]) porEixo[eixo] = [];
      porEixo[eixo].push(cod);
    });

    Object.keys(porEixo).forEach(k => {
      porEixo[k].sort((a, b) => {
        const na = parseInt(a.split(".")[1], 10);
        const nb = parseInt(b.split(".")[1], 10);
        return na - nb;
      });
    });

    listaHab.innerHTML = Object.entries(porEixo).map(([eixoKey, cods]) => `
      <div class="grupo-eixo">
        <div class="grupo-eixo-header">${DB.eixos[eixoKey].icone} ${DB.eixos[eixoKey].nome}</div>
        ${cods.map(cod => {
          const def = DB.eixos[eixoKey].codigos.find(([c]) => c === cod);
          const desc = def ? def[1] : "(removido)";
          return `
            <div class="hab-modulo-linha">
              <span class="cod">${cod}</span>
              <span class="desc">${esc(desc)}</span>
              <button class="mini perigo" data-remover-hab="${cod}">✕</button>
            </div>
          `;
        }).join("")}
      </div>
    `).join("");

    listaHab.querySelectorAll("[data-remover-hab]").forEach(btn => {
      btn.onclick = () => {
        habilidadesTmp.delete(btn.dataset.removerHab);
        renderListaHab();
      };
    });
  }

  function analisarLote() {
    const k = select.value;
    const linhasRaw = textarea.value.split("\n").map(s => s.trim()).filter(Boolean);

    const vistas = new Set();
    const linhas = [];
    linhasRaw.forEach(l => {
      const chave = l.toLowerCase();
      if (vistas.has(chave)) return;
      vistas.add(chave);
      linhas.push(l);
    });

    if (linhas.length === 0) return [];

    const eixo = DB.eixos[k];
    let maior = 0;
    (eixo.codigos || []).forEach(([cod]) => {
      const prefixo = k + ".";
      if (cod && cod.startsWith(prefixo)) {
        const n = parseInt(cod.slice(prefixo.length), 10);
        if (!isNaN(n) && n > maior) maior = n;
      }
    });

    let proximoNum = maior + 1;

    return linhas.map(desc => {
      const existente = acharCodigoPorDescricao(k, desc);
      if (existente) {
        return { desc, cod: existente, novo: false };
      } else {
        const cod = `${k}.${proximoNum++}`;
        return { desc, cod, novo: true };
      }
    });
  }

  function renderPrevia() {
    const itens = analisarLote();
    if (itens.length === 0) {
      previa.innerHTML = "";
      btnAdd.disabled = true;
      btnAdd.textContent = "Adicionar ao módulo";
      return;
    }
    previa.innerHTML = `
      <div class="previa-lote">
        <div style="font-size:.8rem;color:var(--cor-suave);margin-bottom:6px">
          Prévia (${itens.length} linha(s)):
        </div>
        <ul>
          ${itens.map(it => `
            <li>
              <span><b>${it.cod}</b> — ${esc(it.desc)}</span>
              <span class="tag-status ${it.novo ? 'novo' : 'existe'}">${it.novo ? 'NOVO' : 'JÁ EXISTE'}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
    btnAdd.disabled = false;
    btnAdd.textContent = `Adicionar ${itens.length} habilidade(s) ao módulo`;
  }

  select.onchange = () => { renderPrevia(); };
  textarea.oninput = renderPrevia;

  renderListaHab();
  renderPrevia();

  btnAdd.onclick = () => {
    const itens = analisarLote();
    if (itens.length === 0) return;

    const duplicatas = itens.filter(it => !it.novo);

    if (duplicatas.length > 0) {
      const lista = duplicatas.map(d => `• "${d.desc}" já existe como ${d.cod}`).join("\n");

      const escolha = confirm(
        `Algumas habilidades já existem no sistema:\n\n${lista}\n\n` +
        `Clique OK para REUTILIZAR os códigos existentes.\n` +
        `Clique Cancelar para CRIAR CÓDIGOS NOVOS (duplicando a descrição).`
      );

      if (!escolha) {
        const eixo = DB.eixos[select.value];
        let maior = 0;
        (eixo.codigos || []).forEach(([cod]) => {
          const prefixo = select.value + ".";
          if (cod && cod.startsWith(prefixo)) {
            const n = parseInt(cod.slice(prefixo.length), 10);
            if (!isNaN(n) && n > maior) maior = n;
          }
        });
        let proximoNum = maior + 1;

        const novosItens = [];
        itens.forEach(it => {
          if (it.novo) {
            novosItens.push(it);
          } else {
            const cod = `${select.value}.${proximoNum++}`;
            novosItens.push({ desc: it.desc, cod, novo: true });
          }
        });

        novosItens.forEach(it => {
          if (!Array.isArray(DB.eixos[select.value].codigos)) DB.eixos[select.value].codigos = [];
          if (!DB.eixos[select.value].codigos.some(([c]) => c === it.cod)) {
            DB.eixos[select.value].codigos.push([it.cod, it.desc]);
          }
          habilidadesTmp.add(it.cod);
        });

        salvarDB();
        textarea.value = "";
        atualizarSelect();
        renderListaHab();
        renderPrevia();
        flash(`${novosItens.length} habilidade(s) adicionada(s)!`);
        return;
      }
    }

    itens.forEach(it => {
      if (it.novo) {
        if (!Array.isArray(DB.eixos[select.value].codigos)) DB.eixos[select.value].codigos = [];
        if (!DB.eixos[select.value].codigos.some(([c]) => c === it.cod)) {
          DB.eixos[select.value].codigos.push([it.cod, it.desc]);
        }
      }
      habilidadesTmp.add(it.cod);
    });

    salvarDB();
    textarea.value = "";
    atualizarSelect();
    renderListaHab();
    renderPrevia();
    flash(`${itens.length} habilidade(s) adicionada(s)!`);
  };

  document.getElementById("mSalvar").onclick = () => {
    const nome = document.getElementById("mNome").value.trim();
    const descricao = document.getElementById("mDesc").value.trim();
    const habilidades = [...habilidadesTmp];

    if (!nome) return alert("Informe o nome do módulo.");

    if (m) {
      m.nome = nome;
      m.descricao = descricao;
      m.habilidades = habilidades;
    } else {
      DB.modulos.push({
        id: uid(), nome, descricao, habilidades,
      });
    }
    salvarDB();
    modalModulos();
    flash("Módulo salvo!");
  };
}

function modalCatalogo() {
  const eixoKeys = Object.keys(DB.eixos);

  abrirModal(`
    <h2>📋 Catálogo de Habilidades</h2>
    <div class="aviso">
      Aqui você <b>consulta</b> as habilidades já cadastradas. Para criar novas, use o <b>📦 Módulos</b>.
      Você pode editar a descrição de uma habilidade — a mudança reflete em todos os módulos que a usam.
    </div>

    <div class="campo">
      <label>Eixo</label>
      <select id="cEixoSelect">
        ${eixoKeys.map(k => {
          const qtd = (DB.eixos[k].codigos || []).length;
          return `<option value="${k}">${DB.eixos[k].icone} ${DB.eixos[k].nome} — ${qtd} habilidade(s)</option>`;
        }).join("")}
      </select>
    </div>

    <div id="listaCatalogo" class="lista-conceitos" style="max-height:420px;overflow-y:auto"></div>

    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };

  const select = document.getElementById("cEixoSelect");
  const container = document.getElementById("listaCatalogo");

  function renderLista() {
    const k = select.value;
    const eixo = DB.eixos[k];
    const codigos = eixo.codigos || [];

    if (codigos.length === 0) {
      container.innerHTML = `<div class="vazio" style="padding:12px;font-size:.85rem">Nenhuma habilidade neste eixo ainda.<br><br>Vá em 📦 Módulos para criar.</div>`;
      return;
    }

    container.innerHTML = codigos.map(([cod, desc], i) => {
      const usos = contarModulosQueUsam(cod);
      return `
        <div class="conceito-linha">
          <span class="cod">${esc(cod)}</span>
          <span class="desc">
            ${esc(desc)}
            <span class="meta">Usada em ${usos} módulo(s)</span>
          </span>
          <span class="acoes">
            <button class="mini" data-editar="${i}">✏️</button>
            <button class="mini perigo" data-remover="${i}">🗑</button>
          </span>
        </div>
      `;
    }).join("");

    container.querySelectorAll("[data-editar]").forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.editar);
        const [cod, desc] = eixo.codigos[i];
        const nova = prompt(`Editar descrição de ${cod}:`, desc);
        if (nova === null) return;
        if (!nova.trim()) return alert("Descrição não pode ficar vazia.");
        eixo.codigos[i] = [cod, nova.trim()];
        salvarDB();
        renderLista();
        flash("Descrição atualizada!");
      };
    });

    container.querySelectorAll("[data-remover]").forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.remover);
        const [cod, desc] = eixo.codigos[i];
        const usos = contarModulosQueUsam(cod);

        if (usos > 0) {
          const mods = modulosQueUsam(cod).map(m => m.nome).join(", ");
          alert(`Não é possível remover "${cod}".\n\nEla é usada em ${usos} módulo(s):\n${mods}\n\nRemova-a desses módulos primeiro.`);
          return;
        }

        if (!confirm(`Remover "${cod} — ${desc}"?`)) return;
        eixo.codigos.splice(i, 1);
        salvarDB();
        renderLista();
        flash("Habilidade removida.");
      };
    });
  }

  select.onchange = renderLista;
  renderLista();
}

   MODAL DE EXPORTAR COMO TEXTO — v4.1
   Filtros, bloco de notas, copiar, baixar .txt
   ============================================================ */
document.getElementById("btnTexto").onclick = () => modalTexto();

function modalTexto() {
  const eixoKeys = Object.keys(DB.eixos);

  // Nome padrão do arquivo
  const nomePadrao = `habilidades-${hoje()}`;

  abrirModal(`
    <h2>📝 Exportar habilidades como texto</h2>
    <div class="aviso">
      Visualize e copie as habilidades formatadas. Útil para compartilhar com outros professores, montar material didático ou arquivar.
    </div>

    <div class="filtros-linha">
      <div class="campo" style="margin-bottom:0">
        <label>Eixo</label>
        <select id="tEixoSelect">
          <option value="">🌐 Todas as categorias</option>
          ${eixoKeys.map(k => `
            <option value="${k}">${DB.eixos[k].icone} ${DB.eixos[k].nome} (${(DB.eixos[k].codigos || []).length})</option>
          `).join("")}
        </select>
      </div>
      <div class="campo" style="margin-bottom:0">
        <label>Módulo</label>
        <select id="tModuloSelect">
          <option value="">📚 Todos os módulos</option>
          ${DB.modulos.map(m => `
            <option value="${m.id}">📦 ${esc(m.nome)} (${m.habilidades.length})</option>
          `).join("")}
        </select>
      </div>
    </div>

    <label class="checkbox-linha">
      <input type="checkbox" id="tIncluirModulos">
      <span>Incluir módulos que usam cada habilidade</span>
    </label>

    <div class="campo">
      <label>Nome do arquivo (sem extensão)</label>
      <input id="tNomeArquivo" value="${esc(nomePadrao)}" placeholder="Ex.: habilidades-thompson-1grau">
    </div>

    <div class="campo" style="margin-bottom:6px">
      <label>Conteúdo</label>
      <textarea id="tConteudo" class="bloco-notas" readonly></textarea>
    </div>

    <div class="acoes-bloco">
      <button class="primario" id="tCopiar">📋 Copiar tudo</button>
      <button class="cloud" id="tBaixar">💾 Baixar .txt</button>
      <button id="tAtualizar">🔄 Atualizar</button>
    </div>

    <div class="modal-acoes">
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = fecharModal;

  const selectEixo = document.getElementById("tEixoSelect");
  const selectModulo = document.getElementById("tModuloSelect");
  const chkModulos = document.getElementById("tIncluirModulos");
  const inputNome = document.getElementById("tNomeArquivo");
  const textarea = document.getElementById("tConteudo");

  /**
   * Gera o texto formatado com base nos filtros atuais.
   */
  function gerarTexto() {
    const eixoFiltro = selectEixo.value;    // "" = todos
    const moduloFiltro = selectModulo.value; // "" = todos
    const incluirModulos = chkModulos.checked;

    // Decide quais eixos processar
    const eixos = eixoFiltro
      ? [eixoFiltro]
      : Object.keys(DB.eixos);

    const blocos = [];

    eixos.forEach(eixoKey => {
      const eixo = DB.eixos[eixoKey];
      if (!eixo) return;

      // Filtra códigos
      let codigos = (eixo.codigos || []).slice(); // [cod, desc]

      // Se tem filtro de módulo, restringe aos códigos desse módulo
      if (moduloFiltro) {
        const mod = getModulo(moduloFiltro);
        if (mod) {
          const permitidos = new Set(
            mod.habilidades.filter(c => c.startsWith(eixoKey + "."))
          );
          codigos = codigos.filter(([cod]) => permitidos.has(cod));
        }
      }

      if (codigos.length === 0) return;

      // Ordena numericamente
      codigos.sort((a, b) => {
        const na = parseInt(a[0].split(".")[1], 10);
        const nb = parseInt(b[0].split(".")[1], 10);
        return na - nb;
      });

      // Cabeçalho
      const linhaCab = "═".repeat(50);
      let bloco = `${linhaCab}\n${eixo.icone} ${eixo.nome.toUpperCase()}\n${linhaCab}\n`;

      codigos.forEach(([cod, desc]) => {
        bloco += `${cod} — ${desc}\n`;
        if (incluirModulos) {
          const mods = modulosQueUsam(cod);
          if (mods.length > 0) {
            bloco += `     Usada em: ${mods.map(m => m.nome).join(", ")}\n`;
          } else {
            bloco += `     (não vinculada a nenhum módulo)\n`;
          }
        }
      });

      blocos.push(bloco);
    });

    if (blocos.length === 0) {
      return "(nenhuma habilidade encontrada com os filtros atuais)";
    }

    // Rodapé com informações
    const total = blocos.reduce((acc, b) => acc + (b.match(/^[A-Z0-9]+\.\d+ —/gm) || []).length, 0);
    const rodape = `\n${"─".repeat(50)}\nTotal: ${total} habilidade(s)\nGerado em: ${new Date().toLocaleString("pt-BR")}\n`;

    return blocos.join("\n") + rodape;
  }

  function atualizarTexto() {
    textarea.value = gerarTexto();
  }

  selectEixo.onchange = atualizarTexto;
  selectModulo.onchange = atualizarTexto;
  chkModulos.onchange = atualizarTexto;
  document.getElementById("tAtualizar").onclick = () => {
    atualizarTexto();
    flash("Atualizado!");
  };

  document.getElementById("tCopiar").onclick = async () => {
    try {
      await navigator.clipboard.writeText(textarea.value);
      flash("Copiado para a área de transferência!");
    } catch (e) {
      // Fallback para navegadores antigos
      textarea.select();
      document.execCommand("copy");
      flash("Copiado!");
    }
  };

  document.getElementById("tBaixar").onclick = () => {
    let nome = inputNome.value.trim() || `habilidades-${hoje()}`;
    // Remove caracteres inválidos para nome de arquivo
    nome = nome.replace(/[\\/:*?"<>|]/g, "-");
    if (!nome.toLowerCase().endsWith(".txt")) nome += ".txt";

    const blob = new Blob([textarea.value], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
    flash("Arquivo baixado!");
  };

  atualizarTexto();
}

document.getElementById("btnNuvem").onclick = () => modalNuvem();

function modalNuvem() {
  abrirModal(`
    <h2>☁️ Nuvem — Google Sheets</h2>
    <div class="aviso">
      Envie seus dados para a planilha do Google e restaure de qualquer dispositivo.
      O envio é mesclado por aluno: nada é perdido.
    </div>

    <div class="campo">
      <label>E-mail de identificação (opcional)</label>
      <input id="nEmail" placeholder="seu@email.com" value="${esc(CONFIG.email || "")}">
    </div>

    <div class="campo">
      <label>URL do Web App (fixa)</label>
      <input value="${esc(WEBAPP_URL)}" readonly style="background:#f5f3ee;color:var(--cor-suave);font-size:.75em">
    </div>

    <div class="modal-acoes" style="justify-content:space-between">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="primario" id="btnSalvarEmail">Salvar e-mail</button>
        <button class="cloud" id="btnEnviar">⬆️ Enviar para Google</button>
        <button class="cloud" id="btnRestaurar">⬇️ Restaurar do Google</button>
      </div>
      <button data-fechar>Fechar</button>
    </div>
  `);

  document.querySelector("[data-fechar]").onclick = () => { fecharModal(); render(); };

  document.getElementById("btnSalvarEmail").onclick = () => {
    CONFIG.email = document.getElementById("nEmail").value.trim();
    salvarConfig();
    flash("E-mail salvo!");
  };

  document.getElementById("btnEnviar").onclick = async () => {
    if (!confirm("Enviar TODOS os dados atuais para o Google Sheets?")) return;
    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    try {
      const resp = await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "salvar", email: CONFIG.email, dados: DB }),
      });
      const data = await resp.json();
      if (data.ok) {
        const r = data.resultado || {};
        const msg = [
          `Turmas:  +${r.turmas?.novos || 0} novo(s) / ${r.turmas?.atualizados || 0} atualizada(s)`,
          `Módulos: +${r.modulos?.novos || 0} novo(s) / ${r.modulos?.atualizados || 0} atualizado(s)`,
          `Eixos:   +${r.eixos?.novos || 0} novo(s) / ${r.eixos?.atualizados || 0} atualizado(s)`,
          `Alunos:  +${r.alunos?.novos || 0} novo(s) / ${r.alunos?.atualizados || 0} atualizado(s) / ${r.alunos?.ignorados || 0} ignorado(s)`,
        ].join("\n");
        alert("Enviado com sucesso!\n\n" + msg);
        fecharModal();
      } else {
        alert("Erro: " + (data.erro || "desconhecido"));
      }
    } catch (e) {
      alert("Falha ao enviar: " + e.message);
    }
    btn.disabled = false;
    btn.textContent = "⬆️ Enviar para Google";
  };

  document.getElementById("btnRestaurar").onclick = async () => {
    if (!confirm("Substituir os dados locais pelos do Google Sheets?")) return;
    const btn = document.getElementById("btnRestaurar");
    btn.disabled = true;
    btn.textContent = "Restaurando...";
    try {
      const resp = await fetch(WEBAPP_URL + "?acao=carregar");
      const data = await resp.json();
      if (data.ok && data.dados) {
        DB = data.dados;
        if (!DB.eixos) DB.eixos = {};
        Object.keys(EIXOS_PADRAO).forEach(k => {
          if (!DB.eixos[k]) {
            DB.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
          } else {
            if (!Array.isArray(DB.eixos[k].codigos)) DB.eixos[k].codigos = [];
            if (!DB.eixos[k].nome) DB.eixos[k].nome = EIXOS_PADRAO[k].nome;
            if (!DB.eixos[k].icone) DB.eixos[k].icone = EIXOS_PADRAO[k].icone;
          }
        });
        if (!DB.modulos) DB.modulos = modulosIniciais();
        if (!DB.turmas) DB.turmas = [];
        DB.turmas.forEach(t => t.alunos.forEach(a => {
          if (!a.modulos) a.modulos = [];
          if (!a.registros) a.registros = {};
          if (!a.observacoesGerais) a.observacoesGerais = "";
          if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
        }));
        salvarDB();
        fecharModal();
        render();
        alert("Dados restaurados do Google!");
      } else {
        alert("Nenhum dado encontrado ou erro: " + (data.erro || "desconhecido"));
      }
    } catch (e) {
      alert("Falha ao restaurar: " + e.message);
    }
    btn.disabled = false;
    btn.textContent = "⬇️ Restaurar do Google";
  };
}

document.getElementById("btnExportar").onclick = () => {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ficha-musical-backup-${hoje()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById("btnImportar").onclick = () => {
  document.getElementById("inputArquivo").click();
};

document.getElementById("inputArquivo").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const dados = JSON.parse(ev.target.result);
      if (!dados.turmas) throw new Error("Arquivo inválido.");
      if (!confirm("Substituir os dados atuais pelos do arquivo?")) return;
      DB = dados;
      if (!DB.eixos) DB.eixos = {};
      Object.keys(EIXOS_PADRAO).forEach(k => {
        if (!DB.eixos[k]) {
          DB.eixos[k] = JSON.parse(JSON.stringify(EIXOS_PADRAO[k]));
        } else {
          if (!Array.isArray(DB.eixos[k].codigos)) DB.eixos[k].codigos = [];
          if (!DB.eixos[k].nome) DB.eixos[k].nome = EIXOS_PADRAO[k].nome;
          if (!DB.eixos[k].icone) DB.eixos[k].icone = EIXOS_PADRAO[k].icone;
        }
      });
      if (!DB.modulos) DB.modulos = modulosIniciais();
      DB.turmas.forEach(t => t.alunos.forEach(a => {
        if (!a.modulos) a.modulos = [];
        if (!a.registros) a.registros = {};
        if (!a.observacoesGerais) a.observacoesGerais = "";
        if (!a.atualizadoEm) a.atualizadoEm = new Date().toISOString();
      }));
      salvarDB(); render();
      alert("Backup restaurado!");
    } catch (err) {
      alert("Erro ao importar: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

function flash(msg) {
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c2c2c;color:white;padding:10px 18px;border-radius:8px;font-size:.9rem;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2)";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

render();
</script>
