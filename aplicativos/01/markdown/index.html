<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linhas do Tempo — Pedagogia Musical</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161a23;
    --card: #1c2230;
    --card2: #232b3d;
    --txt: #e8ecf4;
    --txt2: #9aa4b8;
    --line: #2a3346;
    --accent: #6ea8fe;
    --accent2: #4d8bf0;
    --ok: #3ddc97;
    --warn: #ffb454;
    --err: #ff6b6b;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--txt);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 24px 80px;
  }

  /* Cabeçalho */
  .header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--txt);
    margin-bottom: 6px;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    color: var(--txt2);
    font-size: .95rem;
  }

  /* Seletor */
  .seletor {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .seletor button {
    background: var(--card);
    color: var(--txt2);
    border: 1px solid var(--line);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    font-family: inherit;
    transition: all .15s;
  }
  .seletor button:hover {
    color: var(--txt);
    border-color: var(--accent);
  }
  .seletor button.ativo {
    background: var(--accent);
    color: #0b0f18;
    border-color: var(--accent);
  }

  /* Conteúdo Markdown */
  #conteudo {
    color: var(--txt);
  }
  #conteudo h1,
  #conteudo h2,
  #conteudo h3,
  #conteudo h4,
  #conteudo h5,
  #conteudo h6 {
    color: var(--accent);
    font-weight: 700;
    line-height: 1.3;
    margin-top: 1.6em;
    margin-bottom: .6em;
  }
  #conteudo h1 {
    font-size: 1.7rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-top: 0;
  }
  #conteudo h2 {
    font-size: 1.35rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  #conteudo h3 { font-size: 1.15rem; }
  #conteudo h4 { font-size: 1rem; color: var(--txt); }
  #conteudo h5 { font-size: .95rem; color: var(--txt2); }
  #conteudo h6 { font-size: .9rem; color: var(--txt2); }

  #conteudo p {
    margin: 1em 0;
    color: var(--txt);
  }
  #conteudo strong { color: var(--txt); font-weight: 700; }
  #conteudo em { color: var(--txt); font-style: italic; }
  #conteudo a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .15s;
  }
  #conteudo a:hover { border-bottom-color: var(--accent); }

  #conteudo ul,
  #conteudo ol {
    margin: 1em 0;
    padding-left: 1.6em;
  }
  #conteudo li {
    margin: .35em 0;
    color: var(--txt);
  }
  #conteudo li::marker {
    color: var(--accent);
  }

  #conteudo blockquote {
    border-left: 3px solid var(--accent);
    margin: 1em 0;
    padding: .4em 0 .4em 18px;
    color: var(--txt2);
    background: rgba(110,168,254,.05);
    border-radius: 0 8px 8px 0;
  }
  #conteudo blockquote p { margin: .3em 0; color: var(--txt2); }

  #conteudo hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2em 0;
  }

  #conteudo code {
    background: var(--card);
    color: var(--warn);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .88em;
    border: 1px solid var(--line);
  }
  #conteudo pre {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #conteudo pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--txt);
    font-size: .85em;
  }

  #conteudo table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
    font-size: .92rem;
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  #conteudo th {
    background: var(--card2);
    color: var(--accent);
    font-weight: 700;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  #conteudo td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--txt);
    vertical-align: top;
  }
  #conteudo tr:last-child td { border-bottom: none; }
  #conteudo tr:hover td { background: rgba(110,168,254,.04); }

  /* Estado de carregamento */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--txt2);
    font-size: .95rem;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-left: 10px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Estado de erro */
  .erro {
    background: rgba(255,107,107,.08);
    border: 1px solid rgba(255,107,107,.3);
    border-left: 3px solid var(--err);
    border-radius: 8px;
    padding: 18px 20px;
    color: var(--txt);
    margin: 20px 0;
  }
  .erro strong { color: var(--err); }
  .erro code { margin-top: 8px; display: inline-block; }

  /* Rodapé */
  .footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--txt2);
    font-size: .82rem;
    text-align: center;
  }

  /* Responsivo */
  @media (max-width: 640px) {
    .container { padding: 20px 16px 60px; }
    .header h1 { font-size: 1.4rem; }
    #conteudo h1 { font-size: 1.35rem; }
    #conteudo h2 { font-size: 1.15rem; }
    #conteudo table { font-size: .82rem; }
    #conteudo th, #conteudo td { padding: 8px 10px; }
    .seletor button { padding: 8px 16px; font-size: .85rem; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Linhas do <span>Tempo</span></h1>
    <p>Selecione um instrumento para visualizar a progressão pedagógica.</p>
  </div>

  <div class="seletor" id="seletor">
    <button data-arquivo="linha-do-tempo-violino.md" class="ativo">🎻 Violino</button>
    <button data-arquivo="linha-do-tempo-piano.md">🎹 Piano</button>
    <button data-arquivo="linha-do-tempo-violao.md">🎸 Violão</button>
  </div>

  <div id="conteudo">
    <div class="loading">Carregando</div>
  </div>

  <div class="footer">
    Pedagogia Musical — Linhas do Tempo
  </div>

</div>

<script>
  // ---------- Configuração ----------
  var ARQUIVO_PADRAO = 'linha-do-tempo-violino.md';

  // ---------- Função para carregar e exibir o Markdown ----------
  function carregarMarkdown(arquivo) {
    var container = document.getElementById('conteudo');
    container.innerHTML = '<div class="loading">Carregando</div>';

    // Codifica o nome do arquivo para URLs (lida com espaços e acentos)
    var url = encodeURI(arquivo);

    fetch(url)
      .then(function (resposta) {
        if (!resposta.ok) {
          throw new Error('HTTP ' + resposta.status + ' (' + resposta.statusText + ')');
        }
        return resposta.text();
      })
      .then(function (texto) {
        // Converte Markdown em HTML
        if (typeof marked === 'undefined') {
          throw new Error('Biblioteca marked.js não carregou. Verifique a conexão com a internet.');
        }
        var html = marked.parse(texto);
        container.innerHTML = html;
        // Rola para o topo ao trocar de arquivo
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function (erro) {
        container.innerHTML =
          '<div class="erro">' +
            '<strong>Erro ao carregar o arquivo.</strong><br>' +
            'Arquivo: <code>' + escapeHtml(arquivo) + '</code><br>' +
            'Detalhe: ' + escapeHtml(erro.message) + '<br><br>' +
            'Verifique se:<br>' +
            '• O arquivo existe e está na mesma pasta do <code>index.html</code>;<br>' +
            '• O nome está exatamente igual (minúsculas, hífens);<br>' +
            '• Você ativou o GitHub Pages no repositório.' +
          '</div>';
        console.error(erro);
      });
  }

  // ---------- Utilitário: escapar HTML ----------
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------- Configura os botões ----------
  document.addEventListener('DOMContentLoaded', function () {
    var botoes = document.querySelectorAll('#seletor button');
    botoes.forEach(function (botao) {
      botao.addEventListener('click', function () {
        // Remove 'ativo' de todos
        botoes.forEach(function (b) { b.classList.remove('ativo'); });
        // Marca o clicado
        botao.classList.add('ativo');
        // Carrega o arquivo
        carregarMarkdown(botao.dataset.arquivo);
      });
    });

    // Carrega o padrão
    carregarMarkdown(ARQUIVO_PADRAO);
  });
</script>

</body>
</html>
