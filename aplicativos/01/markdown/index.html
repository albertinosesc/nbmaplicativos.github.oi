<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linhas do Tempo - Pedagogia Musical</title>
    <!-- Biblioteca para converter Markdown em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e8ecf4;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2, h3 { color: #6ea8fe; }
        a { color: #6ea8fe; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #2a3346;
            padding: 10px;
            text-align: left;
        }
        th { background: #1c2230; }
        code { background: #1c2230; padding: 2px 6px; border-radius: 4px; }
        blockquote {
            border-left: 3px solid #6ea8fe;
            margin-left: 0;
            padding-left: 20px;
            color: #9aa4b8;
        }
        .seletor {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .seletor button {
            background: #1c2230;
            color: #e8ecf4;
            border: 1px solid #2a3346;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .seletor button:hover {
            border-color: #6ea8fe;
        }
        .seletor button.ativo {
            background: #6ea8fe;
            color: #0b0f18;
            border-color: #6ea8fe;
        }
    </style>
</head>
<body>
    <h1>Linhas do Tempo</h1>
    <p>Selecione um instrumento para visualizar a progressão pedagógica:</p>
    
    <div class="seletor" id="seletor">
        <button data-arquivo="Linha do Tempo — Violino.md" class="ativo">🎻 Violino</button>
        <button data-arquivo="Linha do Tempo — Piano.md">🎹 Piano</button>
        <button data-arquivo="Linha do Tempo — Violao.md">🎸 Violão</button>
    </div>
    
    <div id="conteudo"></div>

    <script>
        // Função para carregar e exibir o Markdown
        async function carregarMarkdown(arquivo) {
            const container = document.getElementById('conteudo');
            try {
                // Busca o arquivo .md no repositório
                const resposta = await fetch(arquivo);
                const texto = await resposta.text();
                // Converte para HTML e insere na página
                container.innerHTML = marked.parse(texto);
            } catch (erro) {
                container.innerHTML = '<p>Erro ao carregar o arquivo. Verifique se o nome está correto e se o arquivo está na raiz do repositório.</p>';
                console.error(erro);
            }
        }

        // Configura os botões de seleção
        document.querySelectorAll('#seletor button').forEach(botao => {
            botao.addEventListener('click', () => {
                // Remove 'ativo' de todos, adiciona no clicado
                document.querySelectorAll('#seletor button').forEach(b => b.classList.remove('ativo'));
                botao.classList.add('ativo');
                // Carrega o arquivo correspondente
                carregarMarkdown(botao.dataset.arquivo);
            });
        });

        // Carrega o primeiro por padrão
        carregarMarkdown('Linha do Tempo — Violino.md');
    </script>
</body>
</html>
