<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodiCifra Studio - Notação Simplificada</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-main: #F1F5F9;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --github: #24292F;
            --note-color: #4F46E5;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        header h1 { font-size: 2rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        .panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .grid-meta {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) { .grid-meta { grid-template-columns: 1fr; } }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-weight: 600; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }

        input[type="text"], input[type="number"], select {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            width: 100%;
            background: var(--bg-main);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .tool-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        button {
            font-family: inherit;
            font-size: 0.85rem;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        button:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); }

        .btn-primary { background-color: var(--primary); color: white; border: none; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-github { background-color: var(--github); color: white; border: none; }
        .btn-github:hover { background-color: #1a1e24; }

        .btn-copy { background-color: #10B981; color: white; border: none; padding: 4px 10px; font-size: 0.75rem; }
        .btn-copy:hover { background-color: #059669; }

        .btn-paste { background-color: #F59E0B; color: white; border: none; padding: 4px 10px; font-size: 0.75rem; }
        .btn-paste:hover { background-color: #D97706; }

        .btn-print { background-color: #1E293B; color: white; border: none; }
        .btn-print:hover { background-color: #0F172A; }

        .btn-clear { background-color: #EF4444; color: white; border: none; padding: 4px 10px; font-size: 0.75rem; }
        .btn-clear:hover { background-color: #DC2626; }

        /* Editor */
        .editor-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .editor-header strong { font-size: 1rem; color: var(--text-main); }

        .counter-badge {
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            resize: vertical;
            background: var(--bg-main);
            transition: border-color 0.2s;
            line-height: 1.8;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Preview / Papel */
        .preview-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .sheet-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border);
        }

        .sheet-header h2 { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }

        .sheet-meta-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .sheet-music {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: #FFFFFF;
            border-radius: 8px;
            min-height: 120px;
            border: 1px solid var(--border);
        }

        .sheet-music .empty-message {
            text-align: center;
            color: #94a3b8;
            padding: 30px;
            font-size: 0.95rem;
        }

        /* ============================================
            NOTAÇÃO SIMPLIFICADA - ESTILO PAPEL NORMAL
            ============================================ */
        .simplified-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 0;
            background: transparent;
            align-items: center;
            justify-content: flex-start;
            border: none;
        }

        .simplified-note-unit {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 36px;
            padding: 3px 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .simplified-note-unit:hover {
            background: #F1F5F9;
        }

        .simplified-note {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            display: inline-block;
            position: relative;
            color: var(--note-color);
            background: transparent;
            transition: all 0.15s;
        }

        /* ============================================
            BARRAS E RITORNELLO
            ============================================ */
        .bar-line {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            font-size: 1.4rem;
            font-weight: 300;
            color: #94A3B8;
            padding: 0 2px;
        }

        .bar-final {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            padding: 0 2px;
            gap: 2px;
        }

        .bar-final .bar-thin {
            display: inline-block;
            width: 1.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        .bar-final .bar-thick {
            display: inline-block;
            width: 3.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        .ritornelo-start {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            padding: 0 2px;
            gap: 2px;
        }

        .ritornelo-start .bar-thin {
            display: inline-block;
            width: 1.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        .ritornelo-start .bar-thick {
            display: inline-block;
            width: 3.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        .ritornelo-start .dots-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-left: 2px;
        }

        .ritornelo-start .bar-dot {
            display: inline-block;
            width: 3.5px;
            height: 3.5px;
            background: var(--text-main);
            border-radius: 50%;
        }

        .ritornelo-end {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            padding: 0 2px;
            gap: 2px;
        }

        .ritornelo-end .dots-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-right: 2px;
        }

        .ritornelo-end .bar-dot {
            display: inline-block;
            width: 3.5px;
            height: 3.5px;
            background: var(--text-main);
            border-radius: 50%;
        }

        .ritornelo-end .bar-thin {
            display: inline-block;
            width: 1.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        .ritornelo-end .bar-thick {
            display: inline-block;
            width: 3.5px;
            height: 2rem;
            background: var(--text-main);
            border-radius: 1px;
        }

        /* ============================================
            OITAVAS
            ============================================ */
        .note-grave-simples::after,
        .note-grave-duplo::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: var(--note-color);
            border-radius: 1px;
        }

        .note-grave-duplo::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: var(--note-color);
            border-radius: 1px;
        }

        .note-aguda-simples::after,
        .note-aguda-duplo::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: var(--note-color);
            border-radius: 1px;
        }

        .note-aguda-duplo::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: var(--note-color);
            border-radius: 1px;
        }

        /* ============================================
            CORES DOS NÚMEROS (COLORIDO)
            ============================================ */
        .num-1 { color: #EF4444; }
        .num-2 { color: #F59E0B; }
        .num-3 { color: #10B981; }
        .num-4 { color: #3B82F6; }
        .num-5 { color: #8B5CF6; }
        .num-6 { color: #EC4899; }
        .num-7 { color: #14B8A6; }

        /* ============================================
            MODAL GITHUB
            ============================================ */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-card h3 { font-size: 1.2rem; }

        /* ============================================
            IMPRESSÃO
            ============================================ */
        @media print {
            .toolbar, header, .panel, .modal-bg, .editor-card {
                display: none !important;
            }
            
            .preview-card {
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: white !important;
            }
            
            .sheet-header {
                border-bottom: 2px solid #000 !important;
                margin-bottom: 10px !important;
                padding-bottom: 8px !important;
            }
            
            .sheet-header h2 { font-size: 1.4rem !important; color: #000 !important; }
            .sheet-meta-info { color: #333 !important; }
            
            .sheet-music {
                background: white !important;
                padding: 4px !important;
                min-height: auto !important;
                border: none !important;
            }
            
            .simplified-line {
                background: transparent !important;
                border: none !important;
                padding: 4px 0 !important;
                box-shadow: none !important;
                margin-bottom: 4px !important;
            }
            
            .simplified-note { color: #000 !important; }
            
            .note-grave-simples::after,
            .note-grave-duplo::after,
            .note-aguda-simples::after,
            .note-aguda-duplo::after,
            .note-grave-duplo::before,
            .note-aguda-duplo::before {
                background-color: #000 !important;
            }
            
            .bar-line,
            .bar-final .bar-thin,
            .bar-final .bar-thick,
            .ritornelo-start .bar-thin,
            .ritornelo-start .bar-thick,
            .ritornelo-end .bar-thin,
            .ritornelo-end .bar-thick,
            .ritornelo-start .bar-dot,
            .ritornelo-end .bar-dot {
                color: #000 !important;
                background: #000 !important;
            }
            
            .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            body { padding: 0 !important; margin: 0 !important; background: white !important; }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .grid-meta { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .tool-group { justify-content: center; flex-wrap: wrap; }
            .editor-header { flex-direction: column; align-items: stretch; text-align: center; }
            .editor-header > div { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 MelodiCifra Studio</h1>
        <p>Notação Simplificada com Oitavas</p>
    </header>

    <!-- Metadados -->
    <div class="panel grid-meta">
        <div class="input-group">
            <label>Nome da Música</label>
            <input type="text" id="songTitle" value="Minha Canção" oninput="renderMusic()">
        </div>
        <div class="input-group">
            <label>Compositor</label>
            <input type="text" id="songComposer" value="Domínio Público" oninput="renderMusic()">
        </div>
        <div class="input-group">
            <label>Andamento (BPM)</label>
            <input type="number" id="songBpm" value="120" min="30" max="300" oninput="renderMusic()">
        </div>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="panel toolbar">
        <div class="tool-group">
            <button onclick="exportJSON()">📥 Exportar</button>
            <button onclick="document.getElementById('importFileInput').click()">📤 Importar</button>
            <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importJSON(event)">
        </div>

        <div class="tool-group">
            <button class="btn-github" onclick="openGithubModal()">🐙 GitHub</button>
        </div>

        <div class="tool-group">
            <label style="font-size:0.8rem;font-weight:600;color:var(--text-muted);">Exibir:</label>
            <select id="notationMode" onchange="renderMusic()" style="padding:4px 8px;font-size:0.85rem;">
                <option value="cifra">Cifra</option>
                <option value="solfejo">Solfejo</option>
                <option value="numerico">Números</option>
                <option value="numerico_colorido">Números Coloridos</option>
            </select>
        </div>

        <div class="tool-group">
            <label style="font-size:0.8rem;font-weight:600;color:var(--text-muted);">Tom:</label>
            <button onclick="transpose(-1)" style="padding:4px 10px;font-size:0.85rem;">-1</button>
            <span id="transpositionVal" style="font-weight:700;min-width:24px;text-align:center;">0</span>
            <button onclick="transpose(1)" style="padding:4px 10px;font-size:0.85rem;">+1</button>
        </div>

        <div class="tool-group">
            <label style="font-size:0.8rem;font-weight:600;color:var(--text-muted);">Cor:</label>
            <input type="color" id="noteColorPicker" value="#4F46E5" onchange="updateNoteColor(this.value)" style="width:32px;height:32px;padding:2px;border-radius:6px;border:1px solid var(--border);cursor:pointer;">
        </div>

        <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <!-- Editor -->
    <div class="editor-card">
        <div class="editor-header">
            <strong>📝 Editor</strong>
            <div>
                <span class="counter-badge" id="elementCounter">0 elementos</span>
                <button class="btn-copy" onclick="copyText('simplifiedInput')">📋 Copiar</button>
                <button class="btn-paste" onclick="pasteText('simplifiedInput')">📄 Colar</button>
                <button class="btn-clear" onclick="clearEditor()">🗑️ Limpar</button>
            </div>
        </div>
        <textarea id="simplifiedInput" oninput="renderMusic()">C D E F |: G A B C :| D E F G ||
C, D, E, F, | G, A, B, C,</textarea>
    </div>

    <!-- Preview -->
    <div class="preview-card">
        <div class="sheet-header">
            <h2 id="displayTitle">Minha Canção</h2>
            <div class="sheet-meta-info">
                <span>Compositor: <span id="displayComposer">Domínio Público</span></span>
                <span>•</span>
                <span>Tempo: <span id="displayBpm">120</span> BPM</span>
            </div>
        </div>

        <div class="sheet-music" id="sheetOutput">
            <div class="empty-message">Digite a notação no editor acima</div>
        </div>
    </div>
</div>

<!-- Modal GitHub -->
<div class="modal-bg" id="githubModal">
    <div class="modal-card">
        <h3>🐙 Salvar no GitHub</h3>
        <div class="input-group">
            <label>Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="ghUser" placeholder="seu-usuario">
        </div>
        <div class="input-group">
            <label>Repositório</label>
            <input type="text" id="ghRepo" placeholder="meu-repertorio">
        </div>
        <div class="input-group">
            <label>Pasta (opcional)</label>
            <input type="text" id="ghPath" placeholder="musicas/">
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
            <button onclick="closeGithubModal()">Cancelar</button>
            <button class="btn-github" onclick="saveToGithub()">☁️ Salvar</button>
        </div>
    </div>
</div>

<script>
    // ============================================
    // MAPEAMENTOS
    // ============================================
    const noteMapSolfejo = { 'C': 'Dó', 'D': 'Ré', 'E': 'Mi', 'F': 'Fá', 'G': 'Sol', 'A': 'Lá', 'B': 'Si' };
    const noteMapNumeric = { 'C': '1', 'D': '2', 'E': '3', 'F': '4', 'G': '5', 'A': '6', 'B': '7' };
    const chromaticScale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    
    let transposeOffset = 0;

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    window.onload = function() {
        ['ghToken', 'ghUser', 'ghRepo', 'ghPath'].forEach(id => {
            if (localStorage.getItem(id)) document.getElementById(id).value = localStorage.getItem(id);
        });
        renderMusic();
    };

    // ============================================
    // FUNÇÕES GERAIS
    // ============================================
    function updateNoteColor(color) {
        document.documentElement.style.setProperty('--note-color', color);
    }

    function updateCounters() {
        const text = document.getElementById('simplifiedInput').value;
        const elements = text.split('\n')
            .filter(line => line.trim())
            .flatMap(line => line.trim().split(/\s+/))
            .filter(n => n.length > 0).length;
        document.getElementById('elementCounter').textContent = `${elements} elementos`;
    }

    function clearEditor() {
        if (confirm('Limpar o campo?')) {
            document.getElementById('simplifiedInput').value = '';
            renderMusic();
        }
    }

    function copyText(id) {
        const el = document.getElementById(id);
        el.select();
        try {
            document.execCommand('copy');
            const btn = el.parentElement.querySelector('.btn-copy');
            const orig = btn.textContent;
            btn.textContent = '✅ Feito!';
            setTimeout(() => btn.textContent = orig, 1500);
        } catch(e) { alert('Erro ao copiar'); }
    }

    async function pasteText(id) {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById(id).value = text;
            renderMusic();
        } catch(e) { alert('Use Ctrl+V para colar'); }
    }

    // ============================================
    // NOTAS ABC
    // ============================================
    function parseAbcNote(noteStr) {
        if (!noteStr) return null;
        const match = noteStr.match(/^([A-Ga-g])(#|b)?(,+'*|'+,*|,*|'*)$/);
        if (!match) return null;
        const letter = match[1];
        const accidental = match[2] || '';
        const octaveMarks = match[3] || '';
        const isLower = letter === letter.toLowerCase();
        return { baseNote: letter.toUpperCase() + accidental, isLower, octaveMarks };
    }

    function getOctaveClass(octaveMarks) {
        if (!octaveMarks) return '';
        const g = (octaveMarks.match(/,/g) || []).length;
        const a = (octaveMarks.match(/'/g) || []).length;
        if (g === 1) return 'note-grave-simples';
        if (g === 2) return 'note-grave-duplo';
        if (a === 1) return 'note-aguda-simples';
        if (a === 2) return 'note-aguda-duplo';
        return '';
    }

    function getDisplayNote(note, mode) {
        const abc = parseAbcNote(note);
        if (!abc) return note;
        let base = abc.baseNote;
        if (mode === 'solfejo') {
            const p = base.replace(/[#b]/g, '');
            const acc = base.substring(p.length);
            return (noteMapSolfejo[p] || p) + acc;
        }
        if (mode === 'numerico' || mode === 'numerico_colorido') {
            const p = base.replace(/[#b]/g, '');
            const acc = base.substring(p.length);
            return (noteMapNumeric[p] || p) + acc;
        }
        if (mode === 'cifra' && abc.isLower) return base.charAt(0).toLowerCase() + base.substring(1);
        return base;
    }

    function transposeNote(note, semitones) {
        if (!note) return note;
        const abc = parseAbcNote(note);
        if (!abc) return note;
        let idx = chromaticScale.indexOf(abc.baseNote);
        if (idx === -1) return note;
        let newIdx = (idx + semitones) % 12;
        if (newIdx < 0) newIdx += 12;
        const newBase = chromaticScale[newIdx];
        const letter = abc.isLower ? newBase.charAt(0).toLowerCase() : newBase.charAt(0);
        return letter + newBase.substring(1) + abc.octaveMarks;
    }

    function transpose(delta) {
        transposeOffset += delta;
        document.getElementById('transpositionVal').textContent = transposeOffset > 0 ? '+' + transposeOffset : transposeOffset;
        renderMusic();
    }

    // ============================================
    // RENDER
    // ============================================
    function parseSimplifiedNotation(text) {
        const elements = [];
        const parts = text.trim().split(/\s+/);
        for (let p of parts) {
            if (p === '|') elements.push({ type: 'bar' });
            else if (p === '||') elements.push({ type: 'bar_final' });
            else if (p === '|:') elements.push({ type: 'ritornelo_start' });
            else if (p === ':|') elements.push({ type: 'ritornelo_end' });
            else if (p === 'X') elements.push({ type: 'rest' });
            else if (p.match(/^[A-Ga-g][#b]?(,+'*|'+,*|,*|'*)$/)) {
                elements.push({ type: 'note', original: p });
            }
        }
        return elements;
    }

    function renderMusic() {
        document.getElementById('displayTitle').textContent = document.getElementById('songTitle').value || "Sem Título";
        document.getElementById('displayComposer').textContent = document.getElementById('songComposer').value || "Desconhecido";
        document.getElementById('displayBpm').textContent = document.getElementById('songBpm').value || "120";

        const text = document.getElementById('simplifiedInput').value;
        const mode = document.getElementById('notationMode').value;
        const output = document.getElementById('sheetOutput');

        const lines = text.split('\n');
        let html = '';
        let hasContent = false;

        for (let line of lines) {
            if (!line.trim()) {
                html += '<div style="height:12px;"></div>';
                continue;
            }
            
            const elements = parseSimplifiedNotation(line);
            if (!elements.length) continue;
            hasContent = true;

            html += '<div class="simplified-line">';
            for (let elem of elements) {
                if (elem.type === 'bar') {
                    html += `<div class="bar-line">│</div>`;
                    continue;
                }
                if (elem.type === 'bar_final') {
                    html += `<div class="bar-final"><span class="bar-thin"></span><span class="bar-thick"></span></div>`;
                    continue;
                }
                if (elem.type === 'ritornelo_start') {
                    html += `<div class="ritornelo-start"><span class="bar-thin"></span><span class="bar-thick"></span><div class="dots-container"><span class="bar-dot"></span><span class="bar-dot"></span></div></div>`;
                    continue;
                }
                if (elem.type === 'ritornelo_end') {
                    html += `<div class="ritornelo-end"><div class="dots-container"><span class="bar-dot"></span><span class="bar-dot"></span></div><span class="bar-thin"></span><span class="bar-thick"></span></div>`;
                    continue;
                }
                if (elem.type === 'rest') {
                    html += `<div class="simplified-note-unit"><span class="simplified-note" style="color:#94A3B8;font-size:1.2rem;">✕</span></div>`;
                    continue;
                }
                if (elem.type === 'note') {
                    const transposed = transposeNote(elem.original, transposeOffset);
                    const displayNote = getDisplayNote(transposed, mode);
                    const abc = parseAbcNote(transposed);
                    let octaveClass = abc ? getOctaveClass(abc.octaveMarks) : '';
                    let numClass = '';
                    
                    if (mode === 'numerico_colorido' && abc) {
                        const p = abc.baseNote.replace(/[#b]/g, '');
                        const n = noteMapNumeric[p];
                        if (n) numClass = `num-${n}`;
                    }
                    
                    html += `<div class="simplified-note-unit"><span class="simplified-note ${octaveClass} ${numClass}">${displayNote}</span></div>`;
                }
            }
            html += '</div>';
        }

        output.innerHTML = hasContent ? html : '<div class="empty-message">Digite a notação no editor acima</div>';
        updateCounters();
    }

    // ============================================
    // JSON
    // ============================================
    function getCurrentSongData() {
        return {
            title: document.getElementById('songTitle').value,
            composer: document.getElementById('songComposer').value,
            bpm: document.getElementById('songBpm').value,
            simplified: document.getElementById('simplifiedInput').value
        };
    }

    function exportJSON() {
        const data = getCurrentSongData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${data.title.replace(/\s+/g, '_')}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                document.getElementById('songTitle').value = data.title || '';
                document.getElementById('songComposer').value = data.composer || '';
                document.getElementById('songBpm').value = data.bpm || '120';
                document.getElementById('simplifiedInput').value = data.simplified || '';
                renderMusic();
            } catch(err) { alert('Arquivo inválido'); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ============================================
    // GITHUB
    // ============================================
    function openGithubModal() { document.getElementById('githubModal').style.display = 'flex'; }
    function closeGithubModal() { document.getElementById('githubModal').style.display = 'none'; }

    async function saveToGithub() {
        const token = document.getElementById('ghToken').value.trim();
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        let path = document.getElementById('ghPath').value.trim();

        if (!token || !user || !repo) { alert('Preencha todos os campos.'); return; }

        ['ghToken', 'ghUser', 'ghRepo', 'ghPath'].forEach(id => {
            localStorage.setItem(id, document.getElementById(id).value.trim());
        });

        const data = getCurrentSongData();
        const fileName = `${data.title.replace(/\s+/g, '_')}.json`;
        if (path && !path.endsWith('/')) path += '/';
        const fullPath = path + fileName;
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const url = `https://api.github.com/repos/${user}/${repo}/contents/${fullPath}`;

        try {
            let sha = null;
            const check = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (check.ok) { const info = await check.json(); sha = info.sha; }

            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Música: ${data.title}`, content, sha })
            });

            if (res.ok) {
                alert(`✅ Salvo em: ${fullPath}`);
                closeGithubModal();
            } else {
                const err = await res.json();
                alert(`❌ Erro: ${err.message}`);
            }
        } catch(e) { alert('Erro de conexão'); }
    }
</script>
