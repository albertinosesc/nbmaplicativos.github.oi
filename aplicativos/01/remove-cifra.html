<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor de Cifras - ABC Notation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        textarea, pre {
            font-family: 'Fira Code', monospace;
            tab-size: 4;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Removedor de Cifras</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Notação ABC &amp; Texto Musical</p>
                    </div>
                </div>
            </div>

            <!-- Header Quick Controls & Examples -->
            <div class="flex items-center gap-2 flex-wrap">
                <button id="btnExample" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors">
                    Carregar Exemplo ABC
                </button>
                <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors" title="Alternar Tema">
                    <svg id="themeIconSun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="mt-6 flex-grow flex flex-col gap-6">

            <!-- Control Bar / Options -->
            <section class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700/60 shadow-sm">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div class="flex flex-wrap items-center gap-4 text-xs font-medium">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="optQuotes" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                            <span>Remover cifras entre aspas <code class="bg-slate-100 dark:bg-slate-700 px-1 py-0.5 rounded text-indigo-600 dark:text-indigo-400">"C"</code> (Padrão ABC)</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="optPlainChords" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                            <span>Remover cifras de texto puro <code class="bg-slate-100 dark:bg-slate-700 px-1 py-0.5 rounded text-indigo-600 dark:text-indigo-400">(Em, G7, C/E)</code></span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="optCleanSpaces" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                            <span>Limpar espaços duplos/residuais</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="optAutoProcess" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                            <span>Processar automaticamente ao digitar</span>
                        </label>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="btnProcess" class="w-full sm:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-semibold rounded-lg shadow-sm transition-all flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Remover Cifras
                        </button>
                    </div>
                </div>
            </section>

            <!-- Editor Side-by-Side View -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
                
                <!-- Input Panel -->
                <div class="flex flex-col bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="bg-slate-50 dark:bg-slate-800/80 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <span class="text-xs font-semibold tracking-wide uppercase text-slate-500 dark:text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                            Entrada (Código ABC / Texto com Cifras)
                        </span>
                        <button id="btnClear" class="text-xs text-slate-500 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 transition-colors flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Limpar
                        </button>
                    </div>

                    <div class="relative flex-grow min-h-[300px] lg:min-h-[420px]">
                        <textarea id="inputText" placeholder="Cole seu código ABC ou texto com cifras aqui...&#10;&#10;Exemplo:&#10;X:1522&#10;T:Oats and Beans&#10;&quot;C&quot; E E E D | &quot;G&quot; F F F E |]" class="w-full h-full p-4 bg-transparent resize-none border-none focus:outline-none focus:ring-0 text-slate-800 dark:text-slate-200 text-sm leading-relaxed" spellcheck="false"></textarea>
                    </div>

                    <!-- Input Stats -->
                    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700/50 text-[11px] text-slate-500 dark:text-slate-400 flex justify-between">
                        <span id="inputCharCount">0 caracteres</span>
                        <span id="inputLineCount">0 linhas</span>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="flex flex-col bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700/60 shadow-sm overflow-hidden">
                    <div class="bg-slate-50 dark:bg-slate-800/80 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <span class="text-xs font-semibold tracking-wide uppercase text-slate-500 dark:text-slate-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            Resultado (Sem Cifras)
                        </span>

                        <div class="flex items-center gap-2">
                            <button id="btnCopy" class="px-2.5 py-1 text-xs font-medium bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-md transition-colors flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span>Copiar</span>
                            </button>
                            <button id="btnDownload" class="px-2.5 py-1 text-xs font-medium bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-md transition-colors flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                <span>Baixar</span>
                            </button>
                        </div>
                    </div>

                    <div class="relative flex-grow min-h-[300px] lg:min-h-[420px] bg-slate-50/50 dark:bg-slate-900/40">
                        <textarea id="outputText" readonly placeholder="O resultado limpo aparecerá aqui..." class="w-full h-full p-4 bg-transparent resize-none border-none focus:outline-none focus:ring-0 text-slate-800 dark:text-slate-200 text-sm leading-relaxed" spellcheck="false"></textarea>
                    </div>

                    <!-- Output Stats / Status Bar -->
                    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700/50 text-[11px] text-slate-500 dark:text-slate-400 flex flex-wrap justify-between gap-2">
                        <div class="flex items-center gap-3">
                            <span id="chordsRemovedBadge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
                                0 cifras removidas
                            </span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span id="outputCharCount">0 caracteres</span>
                            <span id="outputLineCount">0 linhas</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 z-50 pointer-events-none">
            <svg class="w-5 h-5 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMsg" class="text-sm font-medium">Notificação</span>
        </div>

        <!-- Footer -->
        <footer class="mt-8 pt-4 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
            Ferramenta para Músicos e Educadores Musicais &bull; Suporta Padrão Notação ABC 2.1
        </footer>
    </div>

    <!-- Application Logic -->
    <script>
        // Default Sample Code
        const SAMPLE_ABC = `X:1522
T:1522 - Oats and Beans
C:Paul C. Herfurth
L:1/4
M:4/4
I:linebreak $
K:C
"C" E E E D | C C C2 |"G" F F F E | D D D2 |$"C" E F"G" G D |"C" E F"G" G F |"C" E E"G" D D |
"C" C C C2 |]`;

        // DOM Elements
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const btnProcess = document.getElementById('btnProcess');
        const btnClear = document.getElementById('btnClear');
        const btnCopy = document.getElementById('btnCopy');
        const btnDownload = document.getElementById('btnDownload');
        const btnExample = document.getElementById('btnExample');
        const btnThemeToggle = document.getElementById('btnThemeToggle');
        
        // Options
        const optQuotes = document.getElementById('optQuotes');
        const optPlainChords = document.getElementById('optPlainChords');
        const optCleanSpaces = document.getElementById('optCleanSpaces');
        const optAutoProcess = document.getElementById('optAutoProcess');

        // Counters
        const inputCharCount = document.getElementById('inputCharCount');
        const inputLineCount = document.getElementById('inputLineCount');
        const outputCharCount = document.getElementById('outputCharCount');
        const outputLineCount = document.getElementById('outputLineCount');
        const chordsRemovedBadge = document.getElementById('chordsRemovedBadge');

        // Toast element
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // Regex definition for standalone chords (e.g. C, Am7, G/B, F#m7b5, Bbmaj7)
        const PLAIN_CHORD_REGEX = /\b[A-G](?:b|#)?(?:m|maj|min|dim|aug|sus\d?|\d)*(?:\/[A-G](?:b|#)?)?\b/g;

        // Core chord stripping logic
        function stripChords(text) {
            if (!text) return { result: '', removedCount: 0 };

            let removedCount = 0;
            let lines = text.split('\n');

            let processedLines = lines.map(line => {
                // Skip header lines in ABC notation (e.g. T:, K:, M:, X:)
                if (/^[A-Za-z]:/.test(line.trim())) {
                    return line;
                }

                let currentLine = line;

                // Option 1: Strip standard ABC chords inside double quotes "..."
                if (optQuotes.checked) {
                    const quoteMatches = currentLine.match(/"[^"]*"/g);
                    if (quoteMatches) {
                        removedCount += quoteMatches.length;
                        currentLine = currentLine.replace(/"[^"]*"/g, '');
                    }
                }

                // Option 2: Strip plain text chord lines / inline plain chords (outside header lines)
                if (optPlainChords.checked) {
                    // Check if entire line looks like a chord line (common in lead sheets)
                    const words = currentLine.trim().split(/\s+/);
                    const isChordLine = words.length > 0 && words.every(w => !w || PLAIN_CHORD_REGEX.test(w));

                    if (isChordLine && currentLine.trim().length > 0) {
                        removedCount += words.filter(w => w).length;
                        return ''; // Blank out whole chord line
                    }
                }

                // Option 3: Clean up multiple spaces left behind by removal
                if (optCleanSpaces.checked) {
                    // Reduce multiple spaces to single space, but preserve tab/line indentation if wanted
                    currentLine = currentLine.replace(/ {2,}/g, ' ');
                }

                return currentLine;
            });

            // Filter out completely blanked chord lines if cleaning spaces option is checked
            let finalResult = processedLines.join('\n');
            
            if (optCleanSpaces.checked) {
                // Fix spacing before bar lines | or bar closures |]
                finalResult = finalResult.replace(/ +(?=\|)/g, '');
                // Fix leading spaces on lines if any
                finalResult = finalResult.split('\n').map(l => l.trimEnd()).join('\n');
            }

            return { result: finalResult, removedCount };
        }

        // Run processing and update UI
        function processInput() {
            const val = inputText.value;
            const { result, removedCount } = stripChords(val);

            outputText.value = result;

            // Update stats
            const inLines = val ? val.split('\n').length : 0;
            const outLines = result ? result.split('\n').length : 0;

            inputCharCount.textContent = `${val.length} caracteres`;
            inputLineCount.textContent = `${inLines} linhas`;

            outputCharCount.textContent = `${result.length} caracteres`;
            outputLineCount.textContent = `${outLines} linhas`;

            chordsRemovedBadge.textContent = `${removedCount} cifra${removedCount !== 1 ? 's' : ''} removida${removedCount !== 1 ? 's' : ''}`;
        }

        // Show toast feedback
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Copy text helper
        function copyOutput() {
            if (!outputText.value) {
                showToast('Nada para copiar!');
                return;
            }
            
            // Standard fallback copy method for maximum compatibility
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = outputText.value;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            
            try {
                document.execCommand('copy');
                showToast('Resultado copiado com sucesso!');
            } catch (err) {
                showToast('Erro ao copiar texto.');
            } finally {
                document.body.removeChild(tempTextarea);
            }
        }

        // Download output as file
        function downloadOutput() {
            const text = outputText.value;
            if (!text) {
                showToast('Nada para baixar!');
                return;
            }

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'musica_sem_cifras.abc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Arquivo baixado!');
        }

        // Theme Toggle Functionality
        function initTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        btnThemeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Event Listeners
        inputText.addEventListener('input', () => {
            if (optAutoProcess.checked) processInput();
        });

        [optQuotes, optPlainChords, optCleanSpaces].forEach(checkbox => {
            checkbox.addEventListener('change', processInput);
        });

        btnProcess.addEventListener('click', () => {
            processInput();
            showToast('Cifras removidas!');
        });

        btnClear.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            processInput();
            showToast('Texto limpo!');
        });

        btnCopy.addEventListener('click', copyOutput);
        btnDownload.addEventListener('click', downloadOutput);

        btnExample.addEventListener('click', () => {
            inputText.value = SAMPLE_ABC;
            processInput();
            showToast('Exemplo carregado!');
        });

        // Initial setup
        initTheme();
        inputText.value = SAMPLE_ABC;
        processInput();
    </script>
</body>
</html>
