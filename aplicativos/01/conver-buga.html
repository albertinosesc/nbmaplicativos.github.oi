<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor ABC para Notação Simplificada (Piano 1 Linha)</title>
  
  <!-- Biblioteca ABCJS para renderizar a partitura na tela -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }
    
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.6rem;
      color: #1a365d;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #2d3748;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      background-color: #ffffff;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }

    /* Estilo dos Mapeamentos de Mãos */
    .mapping-section {
      background: #edf2f7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .hand-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 5px;
      border-bottom: 2px solid;
    }

    .hand-title.left {
      color: #2b6cb0;
      border-color: #3182ce;
    }

    .hand-title.right {
      color: #c53030;
      border-color: #e53e3e;
    }

    .hand-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .hand-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .field-card {
      background: white;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .field-card span {
      font-size: 0.8rem;
      color: #718096;
      display: block;
      margin-bottom: 4px;
    }

    .field-card input {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .btn-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2b6cb0;
    }

    button.btn-clear {
      background-color: #e53e3e;
    }

    button.btn-clear:hover {
      background-color: #c53030;
    }

    button.btn-copy {
      background-color: #38a169;
    }

    button.btn-copy:hover {
      background-color: #2f855a;
    }

    /* Visualizador da Partitura */
    #paper {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      overflow-x: auto;
      min-height: 120px;
    }

    /* Customização Visual das Notas/Letras no SVG Renderizado */
    .abcjs-lyric, 
    .abcjs-lyric text, 
    .abcjs-lyric tspan {
      font-size: 20px !important;
      fill: #0066cc !important;
      font-weight: bold !important;
    }

    .abcjs-container svg .abcjs-chord {
      font-size: 20px !important;
      font-weight: bold !important;
      fill: red !important;
      transform: translateX(-1px) translateY(25px);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Conversor ABC para Notação Simplificada (1 Linha com Dedilhado)</h1>

  <div class="grid-2">
    <div>
      <label for="abcInput">Código ABC de Entrada (Original):</label>
      <textarea id="abcInput" oninput="convertABC()">X:1
T:2000 - Go Tell Aunt Rhodie
L:1/4
K:C
M:4/4
B,C|DEF|GAB|cd |]</textarea>
    </div>

    <div>
      <label for="abcOutput">Código ABC de Saída (Editável):</label>
      <textarea id="abcOutput" oninput="renderFromOutput()"></textarea>
      <div style="margin-top: 8px; text-align: right;">
        <button class="btn-copy" onclick="copyOutput()">Copiar Código ABC</button>
      </div>
    </div>
  </div>

  <!-- Botões para ação nos campos -->
  <div class="btn-bar">
    <button type="button" onclick="loadDefaultPreset()">Carregar Exemplo Padrão</button>
    <button type="button" class="btn-clear" onclick="clearMapping()">Limpar 10 Campos</button>
  </div>

  <!-- Seção com os 10 campos de digitação livre -->
  <div class="mapping-section">
    <!-- Mão Esquerda (Linha w:) -->
    <div class="hand-title left">Mão Esquerda (Vai para a linha w:)</div>
    <div class="hand-grid" style="margin-bottom: 20px;">
      <div class="field-card">
        <span>Campo 1</span>
        <input type="text" id="left_note_1" placeholder="Nota" value="B," oninput="convertABC()">
        <input type="text" id="left_finger_1" placeholder="Dedo" value="5" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 2</span>
        <input type="text" id="left_note_2" placeholder="Nota" value="C" oninput="convertABC()">
        <input type="text" id="left_finger_2" placeholder="Dedo" value="4" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 3</span>
        <input type="text" id="left_note_3" placeholder="Nota" value="D" oninput="convertABC()">
        <input type="text" id="left_finger_3" placeholder="Dedo" value="3" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 4</span>
        <input type="text" id="left_note_4" placeholder="Nota" value="E" oninput="convertABC()">
        <input type="text" id="left_finger_4" placeholder="Dedo" value="2" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 5</span>
        <input type="text" id="left_note_5" placeholder="Nota" value="F" oninput="convertABC()">
        <input type="text" id="left_finger_5" placeholder="Dedo" value="1" oninput="convertABC()">
      </div>
    </div>

    <!-- Mão Direita (Entre "") -->
    <div class="hand-title right">Mão Direita (Vai para a nota "")</div>
    <div class="hand-grid">
      <div class="field-card">
        <span>Campo 6</span>
        <input type="text" id="right_note_1" placeholder="Nota" value="G" oninput="convertABC()">
        <input type="text" id="right_finger_1" placeholder="Dedo" value="1" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 7</span>
        <input type="text" id="right_note_2" placeholder="Nota" value="A" oninput="convertABC()">
        <input type="text" id="right_finger_2" placeholder="Dedo" value="2" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 8</span>
        <input type="text" id="right_note_3" placeholder="Nota" value="B" oninput="convertABC()">
        <input type="text" id="right_finger_3" placeholder="Dedo" value="3" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 9</span>
        <input type="text" id="right_note_4" placeholder="Nota" value="c" oninput="convertABC()">
        <input type="text" id="right_finger_4" placeholder="Dedo" value="4" oninput="convertABC()">
      </div>
      <div class="field-card">
        <span>Campo 10</span>
        <input type="text" id="right_note_5" placeholder="Nota" value="d" oninput="convertABC()">
        <input type="text" id="right_finger_5" placeholder="Dedo" value="5" oninput="convertABC()">
      </div>
    </div>
  </div>

  <label>Visualização da Partitura (Pauta Simplificada 1 Linha):</label>
  <div id="paper"></div>
</div>

<script>
  function getMappings() {
    const leftMap = {};
    const rightMap = {};

    for (let i = 1; i <= 5; i++) {
      const note = document.getElementById(`left_note_${i}`).value.trim();
      const finger = document.getElementById(`left_finger_${i}`).value.trim();
      if (note !== '') {
        leftMap[note] = finger !== '' ? finger : '1';
      }
    }

    for (let i = 1; i <= 5; i++) {
      const note = document.getElementById(`right_note_${i}`).value.trim();
      const finger = document.getElementById(`right_finger_${i}`).value.trim();
      if (note !== '') {
        rightMap[note] = finger !== '' ? finger : '1';
      }
    }

    return { leftMap, rightMap };
  }

  function convertABC() {
    const input = document.getElementById('abcInput').value;
    const lines = input.split('\n');
    const { leftMap, rightMap } = getMappings();

    let outputHeader = [];
    let musicLines = [];

    for (let line of lines) {
      let trimmed = line.trim();
      if (!trimmed) continue;

      if (trimmed.startsWith('X:') || trimmed.startsWith('T:') || trimmed.startsWith('M:')) {
        outputHeader.push(trimmed);
      } else if (trimmed.startsWith('L:')) {
        outputHeader.push('L:1/8');
      } else if (trimmed.startsWith('K:')) {
        outputHeader.push('K:C stafflines=1');
      } else if (!trimmed.startsWith('w:')) {
        musicLines.push(trimmed);
      }
    }

    const fullMusicText = musicLines.join(' ');
    
    // Captura notas ABC e barras de compasso (|], ||, |)
    const noteRegex = /([=^_]*[A-Ga-g][,']*)([0-9]*\/*[0-9]*)|(\|\]|\|\||\|)/g;

    let convertedMusic = '';
    let wTokens = [];

    let match;
    while ((match = noteRegex.exec(fullMusicText)) !== null) {
      const [fullToken, notePitch, duration, barLine] = match;

      if (barLine) {
        convertedMusic += barLine + ' ';
        wTokens.push(barLine);
      } else if (notePitch) {
        let isLeft = leftMap.hasOwnProperty(notePitch);
        let isRight = rightMap.hasOwnProperty(notePitch);

        let noteDuration = duration ? duration : '2';

        if (isRight) {
          const finger = rightMap[notePitch];
          convertedMusic += `"${finger}"B${noteDuration} `;
          wTokens.push('*'); // Mão direita gera asterisco na linha w:
        } else if (isLeft) {
          const finger = leftMap[notePitch];
          convertedMusic += `B${noteDuration} `;
          wTokens.push(finger); // Mão esquerda gera o número do dedo na linha w:
        } else {
          convertedMusic += `B${noteDuration} `;
          wTokens.push('*');
        }
      }
    }

    // Formata o resultado do campo w: concatenando asteriscos consecutivos para padrão ***
    let formattedW = '';
    for (let token of wTokens) {
      if (token === '|' || token === '|]' || token === '||') {
        formattedW += token + ' ';
      } else if (token === '*') {
        // Se o token anterior na string não for asterisco nem vazio, adiciona espaço
        if (formattedW.length > 0 && !formattedW.endsWith('*') && !formattedW.endsWith(' ')) {
          formattedW += ' ';
        }
        formattedW += '*';
      } else {
        if (formattedW.length > 0 && !formattedW.endsWith(' ')) {
          formattedW += ' ';
        }
        formattedW += token;
      }
    }

    let finalOutput = outputHeader.join('\n') + '\n';
    finalOutput += convertedMusic.trim() + '\n';
    
    if (formattedW.trim().length > 0) {
      finalOutput += 'w:' + formattedW.trim();
    }

    document.getElementById('abcOutput').value = finalOutput;
    renderFromOutput();
  }

  function renderFromOutput() {
    const abcText = document.getElementById('abcOutput').value;
    try {
      ABCJS.renderAbc('paper', abcText, {
        responsive: 'resize',
        add_classes: true,
        paddingtop: 10,
        paddingbottom: 10
      });
    } catch (e) {
      console.error(e);
    }
  }

  function clearMapping() {
    for (let i = 1; i <= 5; i++) {
      document.getElementById(`left_note_${i}`).value = '';
      document.getElementById(`left_finger_${i}`).value = '';
      document.getElementById(`right_note_${i}`).value = '';
      document.getElementById(`right_finger_${i}`).value = '';
    }
    convertABC();
  }

  function loadDefaultPreset() {
    document.getElementById('left_note_1').value = 'B,';
    document.getElementById('left_finger_1').value = '5';
    document.getElementById('left_note_2').value = 'C';
    document.getElementById('left_finger_2').value = '4';
    document.getElementById('left_note_3').value = 'D';
    document.getElementById('left_finger_3').value = '3';
    document.getElementById('left_note_4').value = 'E';
    document.getElementById('left_finger_4').value = '2';
    document.getElementById('left_note_5').value = 'F';
    document.getElementById('left_finger_5').value = '1';

    document.getElementById('right_note_1').value = 'G';
    document.getElementById('right_finger_1').value = '1';
    document.getElementById('right_note_2').value = 'A';
    document.getElementById('right_finger_2').value = '2';
    document.getElementById('right_note_3').value = 'B';
    document.getElementById('right_finger_3').value = '3';
    document.getElementById('right_note_4').value = 'c';
    document.getElementById('right_finger_4').value = '4';
    document.getElementById('right_note_5').value = 'd';
    document.getElementById('right_finger_5').value = '5';

    convertABC();
  }

  function copyOutput() {
    const copyText = document.getElementById('abcOutput');
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert('Código ABC copiado para a área de transferência!');
  }

  window.onload = convertABC;
</script>

</body>
</html>
