<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial de Notação Musical ABC</title>
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <button type="button" id="btn-toggle-sidebar" class="sidebar-toggle" title="Mostrar/Ocultar Índice">☰ Índice</button>
            <h1>🎵 Tutorial de Notação Musical ABC</h1>
            <button type="button" id="btn-admin-tab" class="admin-btn">⚙️ Admin</button>
        </div>
    </header>

    <div class="app-layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <input type="search" id="lesson-search" placeholder="🔍 Filtrar +1000 tópicos..." />
                <div class="sidebar-tree-actions">
                    <button type="button" id="btn-expand-all">Expandir tudo</button>
                    <button type="button" id="btn-collapse-all">Recolher tudo</button>
                </div>
            </div>
            <nav id="lesson-nav" class="lesson-tree"></nav>
        </aside>

        <main>
            <section id="admin-panel" class="admin-panel" style="display: none;"></section>

            <div class="lesson-actions" id="lesson-actions-bar">
                <button type="button" id="btn-copy-txt" class="action-btn" title="Copiar o conteúdo bruto do arquivo .TXT">📋 Copiar .TXT</button>
                <button type="button" id="btn-export-pdf" class="action-btn" title="Exportar a lição atual em PDF">📄 PDF</button>
            </div>

            <article id="lesson-content">
                <p>Carregando lição...</p>
            </article>
        </main>
    </div>

    <footer>
        <p>Tutorial ABC • Arquivos hospedados no GitHub</p>
    </footer>

    <!-- Módulos externos por tipo de conteúdo -->
    <script src="abc.js?v=1"></script>
    <script src="cifra.js?v=3"></script>
    <script src="markdown.js?v=1"></script>
    <script src="links.js?v=2"></script>
    <script src="video.js?v=1"></script>
    <script src="violao.js?v=1"></script>
    <script src="imagem.js?v=1"></script>
    <script src="pdf.js?v=1"></script>

    <!-- Núcleo principal -->
    <script src="script.js?v=4"></script>
</body>
</html>
